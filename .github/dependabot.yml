version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      capacitor-release-toolchain:
        applies-to: version-updates
        patterns:
          - "@capacitor/core"
          - "@capacitor/cli"
          - "@capacitor/android"
          - "@capacitor/ios"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
