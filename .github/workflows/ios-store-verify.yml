name: iOS Store Source Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ios-store-verify.yml
      - package.json
      - package-lock.json
      - capacitor.config.ts
      - public/**
      - backend/revenuecat_catalog.json
      - store/**
      - docs/STORE_LISTING_COPY.md
      - docs/BILLING_5_1.md
      - docs/DATA_SAFETY.md
      - scripts/build-native.mjs
      - scripts/check-javascript.mjs
      - scripts/configure-native.mjs
      - scripts/prepare-store-release.mjs
      - scripts/production-build-preflight.mjs
      - scripts/revenuecat-catalog.mjs
      - scripts/verify-native-release.mjs
      - scripts/verify-native-privacy.mjs
      - scripts/verify-store-metadata.mjs
      - scripts/verify-store-submission-packet.mjs
      - resources/PrivacyInfo.xcprivacy
      - resources/icon.png
      - resources/splash.png
      - store/submission-evidence.android.example.json
      - store/submission-evidence.ios.example.json
  push:
    branches: [main]
    paths:
      - .github/workflows/ios-store-verify.yml
      - package.json
      - package-lock.json
      - capacitor.config.ts
      - public/**
      - backend/revenuecat_catalog.json
      - store/**
      - docs/STORE_LISTING_COPY.md
      - docs/BILLING_5_1.md
      - docs/DATA_SAFETY.md
      - scripts/build-native.mjs
      - scripts/check-javascript.mjs
      - scripts/configure-native.mjs
      - scripts/native-api-origin.mjs
      - scripts/prepare-store-release.mjs
      - scripts/production-build-preflight.mjs
      - scripts/revenuecat-catalog.mjs
      - scripts/verify-mobile-signing.mjs
      - scripts/verify-native-release.mjs
      - scripts/verify-native-privacy.mjs
      - scripts/verify-store-metadata.mjs
      - scripts/verify-store-submission-packet.mjs
      - resources/PrivacyInfo.xcprivacy
      - resources/icon.png
      - resources/splash.png
      - store/submission-evidence.android.example.json
      - store/submission-evidence.ios.example.json

concurrency:
  group: ios-store-source-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-ios-source:
    name: Generate and compile unsigned iOS structural candidate (not release-ready)
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Require the current App Store toolchain
        run: |
          xcodebuild -version
          xcode_version="$(xcodebuild -version | awk 'NR == 1 { print $2 }')"
          xcode_major="${xcode_version%%.*}"
          ios_sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          ios_sdk_major="${ios_sdk_version%%.*}"
          if [[ ! "$xcode_major" =~ ^[0-9]+$ ]] || (( xcode_major < 26 )); then
            echo "App Store candidates require Xcode 26 or later; found ${xcode_version:-unknown}." >&2
            exit 1
          fi
          if [[ ! "$ios_sdk_major" =~ ^[0-9]+$ ]] || (( ios_sdk_major < 26 )); then
            echo "App Store candidates require the iOS 26 SDK or later; found ${ios_sdk_version:-unknown}." >&2
            exit 1
          fi
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate and verify unsigned iOS structural source (not release-ready)
        env:
          STORE_ALLOW_MISSING_PUBLIC_BILLING_KEYS: "1"
        run: npm run store:prepare:ios
      - name: Verify tracked signing controls
        run: npm run store:signing:check
      - name: Compile without signing or upload
        run: |
          if [[ -d ios/App/App.xcworkspace ]]; then
            container=(-workspace ios/App/App.xcworkspace)
          elif [[ -d ios/App/App.xcodeproj ]]; then
            container=(-project ios/App/App.xcodeproj)
          else
            echo 'Generated iOS project/workspace was not found.' >&2
            exit 1
          fi
          xcodebuild \
            "${container[@]}" \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/AskCrumpDerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build
      - name: Verify compiled privacy-manifest inventory
        run: |
          app_bundle="$(find "$RUNNER_TEMP/AskCrumpDerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -type d -name '*.app' -print -quit)"
          if [[ -z "$app_bundle" ]]; then
            echo 'Compiled iOS app bundle was not found.' >&2
            exit 1
          fi
          while IFS= read -r manifest; do
            plutil -lint "$manifest"
          done < <(find "$app_bundle" -type f -name 'PrivacyInfo.xcprivacy' -print)
          node scripts/verify-native-privacy.mjs ios-bundle "$app_bundle"
      - name: Record verification boundary
        run: |
          {
            echo '## Ask Crump iOS source verification'
            echo
            echo '- Generated from the reviewed Node 22 lockfile.'
            echo '- Used Xcode 26.3 with an asserted Xcode 26+ and iOS 26+ SDK toolchain.'
            echo '- Native source verifier passed.'
            echo '- Xcode compiled the Release configuration without signing.'
            echo '- The compiled app and Capacitor bundles contain valid, reconciled privacy manifests.'
            echo '- Missing RevenueCat public billing keys were explicitly allowed for structural CI; this output is not release-ready.'
            echo '- No certificate, provisioning profile, App Store credential, upload, or submission was used.'
          } >> "$GITHUB_STEP_SUMMARY"
