          grep -F "Unexpected verify_registered_and_create_session_v1 owner or ACL; refusing replacement." \
            "$RUNNER_TEMP/atomic-registered-verification-acl-refusal.log"
          psql -X --set=ON_ERROR_STOP=1 \
            --file=tests/postgres/atomic_registered_verification_acl_drift_cleanup.sql
          psql -X --set=ON_ERROR_STOP=1 --single-transaction \
