  legacy-account-deletion-security:
    name: Legacy account deletion security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: askcrump_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d askcrump_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: askcrump_test
      PGUSER: postgres
      PGPASSWORD: postgres-ci-only

    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Prove installations without the legacy function are unchanged
        run: |
          psql -X --set=ON_ERROR_STOP=1 --single-transaction \
            --file=migrations/20261024001624_harden_legacy_delete_own_account.sql
          psql -X --set=ON_ERROR_STOP=1 \
            --file=tests/postgres/test_legacy_delete_own_account_absent.sql
      - name: Apply the legacy fixture and hardening migration
        run: |
          psql -X --set=ON_ERROR_STOP=1 \
            --file=tests/postgres/legacy_delete_own_account_baseline.sql
          psql -X --set=ON_ERROR_STOP=1 --single-transaction \
            --file=migrations/20261024001624_harden_legacy_delete_own_account.sql
          psql -X --set=ON_ERROR_STOP=1 --single-transaction \
            --file=migrations/20261024001624_harden_legacy_delete_own_account.sql
      - name: Exercise legacy self-delete security boundaries
        run: >-
          psql -X --set=ON_ERROR_STOP=1
          --file=tests/postgres/test_legacy_delete_own_account_migration.sql
      - name: Prove unexpected definition drift fails closed
        run: |
          psql -X --set=ON_ERROR_STOP=1 \
            --file=tests/postgres/legacy_delete_own_account_drift_fixture.sql
          set +e
          psql -X --set=ON_ERROR_STOP=1 --set=VERBOSITY=verbose \
            --single-transaction \
            --file=migrations/20261024001624_harden_legacy_delete_own_account.sql \
            > "$RUNNER_TEMP/legacy-delete-drift-refusal.log" 2>&1
          migration_status=$?
          set -e
          cat "$RUNNER_TEMP/legacy-delete-drift-refusal.log"
          if [ "$migration_status" -eq 0 ]; then
            echo "Migration unexpectedly accepted legacy function definition drift."
            exit 1
          fi
          grep -F "55000" "$RUNNER_TEMP/legacy-delete-drift-refusal.log"
          grep -F "Unexpected public.delete_own_account() definition; refusing hardening." \
            "$RUNNER_TEMP/legacy-delete-drift-refusal.log"
          psql -X --set=ON_ERROR_STOP=1 \
            --file=tests/postgres/test_legacy_delete_own_account_drift_refusal.sql
      - name: Prove unexpected executor ACL drift fails closed
        run: |
          psql -X --set=ON_ERROR_STOP=1 \
            --file=tests/postgres/legacy_delete_own_account_acl_drift_fixture.sql
          set +e
          psql -X --set=ON_ERROR_STOP=1 --set=VERBOSITY=verbose \
            --single-transaction \
            --file=migrations/20261024001624_harden_legacy_delete_own_account.sql \
            > "$RUNNER_TEMP/legacy-delete-acl-refusal.log" 2>&1
          migration_status=$?
          set -e
          cat "$RUNNER_TEMP/legacy-delete-acl-refusal.log"
          if [ "$migration_status" -eq 0 ]; then
            echo "Migration unexpectedly accepted legacy function ACL drift."
            exit 1
          fi
          grep -F "55000" "$RUNNER_TEMP/legacy-delete-acl-refusal.log"
          grep -F "Unexpected public.delete_own_account() ACL; refusing hardening." \
            "$RUNNER_TEMP/legacy-delete-acl-refusal.log"
          psql -X --set=ON_ERROR_STOP=1 \
            --file=tests/postgres/test_legacy_delete_own_account_acl_drift_refusal.sql

  guest-free-access-contract:
    name: Guest and Free access contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: askcrump_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d askcrump_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: askcrump_test
      PGUSER: postgres
      PGPASSWORD: postgres-ci-only

    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply guest and Free prerequisites and migrations
        run: |
          psql -X --set=ON_ERROR_STOP=1 --single-transaction --file=tests/postgres/guest_sync_admission_baseline.sql
          psql -X --set=ON_ERROR_STOP=1 --single-transaction --file=migrations/002_server_authoritative_chat_sync.sql
          psql -X --set=ON_ERROR_STOP=1 --single-transaction --file=migrations/20261021003000_guest_mode.sql
          psql -X --set=ON_ERROR_STOP=1 --single-transaction --file=migrations/20261021020000_guest_message_receipts.sql
          psql -X --set=ON_ERROR_STOP=1 --single-transaction --file=migrations/20261021030000_guest_sync_admission.sql
      - name: Exercise shared rolling allowance
        run: >-
          psql -X --set=ON_ERROR_STOP=1
          --file=tests/postgres/test_free_message_reservation_migration.sql
      - name: Exercise guest sync and reply storage boundaries
        run: >-
          psql -X --set=ON_ERROR_STOP=1
          --file=tests/postgres/test_guest_sync_admission_migration.sql
      - name: Apply fail-closed guest-mode control
        run: >-
          psql -X --set=ON_ERROR_STOP=1 --single-transaction
          --file=migrations/20261021040000_guest_mode_control.sql
      - name: Install the production pg_cron scheduling contract stub
        run: >-
          psql -X --set=ON_ERROR_STOP=1
          --file=tests/postgres/guest_network_cron_stub.sql
      - name: Apply guest network message budget twice
        run: |
          psql -X --set=ON_ERROR_STOP=1 --single-transaction \
            --file=migrations/20261025010000_guest_network_message_budget.sql
          psql -X --set=ON_ERROR_STOP=1 --single-transaction \
            --command='set search_path=pg_catalog' \
            --file=migrations/20261025010000_guest_network_message_budget.sql
      - name: Exercise guest network message budget
        run: >-
          psql -X --set=ON_ERROR_STOP=1
          --file=tests/postgres/test_guest_network_message_budget_migration.sql
      - name: Prove retention target drift fails closed
        run: |
          psql -X --command="update cron.job set nodename = 'wrong-host.invalid', nodeport = 1 where jobname = 'askcrump_guest_network_retention_v1' and username = current_user"
          set +e
          psql -X --set=ON_ERROR_STOP=1 --set=VERBOSITY=verbose \
            --single-transaction \
            --file=migrations/20261025010000_guest_network_message_budget.sql \
            > "$RUNNER_TEMP/guest-network-cron-target-refusal.log" 2>&1
          migration_status=$?
          set -e
          cat "$RUNNER_TEMP/guest-network-cron-target-refusal.log"
          if [ "$migration_status" -eq 0 ]; then
            echo "Migration unexpectedly accepted guest-network cron target drift."
            exit 1
          fi
          grep -F "55000" "$RUNNER_TEMP/guest-network-cron-target-refusal.log"
          grep -F "Conflicting guest network retention schedule; refusing migration." \
            "$RUNNER_TEMP/guest-network-cron-target-refusal.log"
          psql -X --command="update cron.job set nodename = 'localhost', nodeport = inet_server_port() where jobname = 'askcrump_guest_network_retention_v1' and username = current_user"
          psql -X --set=ON_ERROR_STOP=1 --single-transaction \
            --file=migrations/20261025010000_guest_network_message_budget.sql
      - name: Prove receipt-table privacy drift fails closed
        run: |
          psql -X --command="grant select (network_key_hash) on public.guest_network_message_events to authenticated"
          psql -X --set=ON_ERROR_STOP=1 --single-transaction \
            --file=migrations/20261025010000_guest_network_message_budget.sql
          psql -X --tuples-only --no-align \
            --command="select not exists (select 1 from pg_attribute where attrelid = 'public.guest_network_message_events'::regclass and attnum > 0 and not attisdropped and attacl is not null)" \
            | grep -Fx 't'
          psql -X --command="create policy guest_network_drift_test on public.guest_network_message_events for select to authenticated using (true)"
          set +e
          psql -X --set=ON_ERROR_STOP=1 --set=VERBOSITY=verbose \
            --single-transaction \
            --file=migrations/20261025010000_guest_network_message_budget.sql \
            > "$RUNNER_TEMP/guest-network-table-security-refusal.log" 2>&1
          migration_status=$?
          set -e
