          grep -F "55000" "$RUNNER_TEMP/guest-network-table-security-refusal.log"
          grep -F "Unexpected guest network message-budget table security contract." \
            "$RUNNER_TEMP/guest-network-table-security-refusal.log"
          psql -X --command="drop policy guest_network_drift_test on public.guest_network_message_events"
          psql -X --set=ON_ERROR_STOP=1 --single-transaction \
