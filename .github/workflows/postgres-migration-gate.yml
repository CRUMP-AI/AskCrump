    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: askcrump_test
      PGUSER: postgres
      PGPASSWORD: postgres-ci-only

    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Prove ambiguous registration state fails closed
        run: |
          psql -X --set=ON_ERROR_STOP=1 --file=tests/postgres/registration_growth_cohort_baseline.sql
          psql -X --set=ON_ERROR_STOP=1 --file=tests/postgres/registration_growth_cohort_ambiguous_fixture.sql
          set +e
          psql -X --set=ON_ERROR_STOP=1 --set=VERBOSITY=verbose \
            --file=migrations/20261023191029_registration_submission_cohorts.sql \
            > "$RUNNER_TEMP/registration-cohort-refusal.log" 2>&1
          migration_status=$?
          set -e
          cat "$RUNNER_TEMP/registration-cohort-refusal.log"
          if [ "$migration_status" -eq 0 ]; then
            echo "Migration unexpectedly accepted ambiguous registration rows."
            exit 1
          fi
          grep -F "55000" "$RUNNER_TEMP/registration-cohort-refusal.log"
          grep -F "Found 2 ambiguous post-guest-launch account(s); refusing cohort migration." \
            "$RUNNER_TEMP/registration-cohort-refusal.log"
          psql -X --set=ON_ERROR_STOP=1 \
            --file=tests/postgres/registration_growth_cohort_refusal_rollback.sql
      - name: Apply registration cohort prerequisites and migration
        run: |
          psql -X --set=ON_ERROR_STOP=1 --file=migrations/20260908134343_durable_growth_measurement.sql
          psql -X --set=ON_ERROR_STOP=1 --file=migrations/20260913192512_clarify_optional_profile_growth_metric.sql
          psql -X --set=ON_ERROR_STOP=1 --file=migrations/20261001084000_project_artifact_continuity_aggregate.sql
          psql -X --set=ON_ERROR_STOP=1 --file=migrations/20261023191029_registration_submission_cohorts.sql
      - name: Exercise registration cohorts against PostgreSQL
        run: >-
          psql -X --set=ON_ERROR_STOP=1
          --file=tests/postgres/test_registration_growth_cohort_migration.sql
      - name: Apply immutable verification measurement migration
        run: >-
          psql -X --set=ON_ERROR_STOP=1
          --file=migrations/20261024043331_email_verification_measurement.sql
      - name: Exercise verified-user journey ordering against PostgreSQL
        run: >-
          psql -X --set=ON_ERROR_STOP=1
          --file=tests/postgres/test_email_verification_measurement_migration.sql
      - name: Prove duplicate reset-token state fails closed
        run: |
          psql -X --set=ON_ERROR_STOP=1 \
            --file=tests/postgres/atomic_password_reset_duplicate_fixture.sql
          set +e
          psql -X --set=ON_ERROR_STOP=1 --set=VERBOSITY=verbose \
            --single-transaction \
            --file=migrations/20261024051228_atomic_password_reset.sql \
            > "$RUNNER_TEMP/atomic-password-reset-refusal.log" 2>&1
          migration_status=$?
          set -e
          cat "$RUNNER_TEMP/atomic-password-reset-refusal.log"
          if [ "$migration_status" -eq 0 ]; then
            echo "Migration unexpectedly accepted duplicate reset tokens."
            exit 1
          fi
          grep -F "55000" "$RUNNER_TEMP/atomic-password-reset-refusal.log"
          grep -F "Found duplicate password-reset token hashes; refusing migration." \
            "$RUNNER_TEMP/atomic-password-reset-refusal.log"
          psql -X --set=ON_ERROR_STOP=1 \
            --file=tests/postgres/atomic_password_reset_refusal_rollback.sql
      - name: Apply atomic password-reset migration
        run: |
          psql -X --set=ON_ERROR_STOP=1 --single-transaction \
            --file=migrations/20261024051228_atomic_password_reset.sql
          psql -X --set=ON_ERROR_STOP=1 --single-transaction \
            --file=migrations/20261024051228_atomic_password_reset.sql
      - name: Exercise atomic password reset against PostgreSQL
        run: >-
          psql -X --set=ON_ERROR_STOP=1
          --file=tests/postgres/test_atomic_password_reset_migration.sql
      - name: Exercise atomic password login against PostgreSQL
        run: >-
          psql -X --set=ON_ERROR_STOP=1
          --file=tests/postgres/test_atomic_password_login_migration.sql
      - name: Exercise atomic registered verification against PostgreSQL
        run: >-
          psql -X --set=ON_ERROR_STOP=1
          --file=tests/postgres/test_atomic_registered_verification_migration.sql
      - name: Exercise reset and stale-login concurrency boundaries
        run: bash tests/postgres/test_atomic_password_reset_concurrency.sh
      - name: Prove unexpected password-reset ACL drift fails closed
        run: |
          psql -X --set=ON_ERROR_STOP=1 \
            --file=tests/postgres/atomic_password_reset_acl_drift_fixture.sql
          set +e
          psql -X --set=ON_ERROR_STOP=1 --set=VERBOSITY=verbose \
            --single-transaction \
            --file=migrations/20261024051228_atomic_password_reset.sql \
            > "$RUNNER_TEMP/atomic-password-reset-acl-refusal.log" 2>&1
          migration_status=$?
          set -e
          cat "$RUNNER_TEMP/atomic-password-reset-acl-refusal.log"
          if [ "$migration_status" -eq 0 ]; then
            echo "Migration unexpectedly accepted password-reset ACL drift."
            exit 1
          fi
          grep -F "55000" "$RUNNER_TEMP/atomic-password-reset-acl-refusal.log"
          grep -F "Unexpected consume_password_reset_v1 owner or ACL; refusing replacement." \
            "$RUNNER_TEMP/atomic-password-reset-acl-refusal.log"
          psql -X --set=ON_ERROR_STOP=1 \
            --file=tests/postgres/atomic_password_reset_acl_drift_cleanup.sql
          psql -X --set=ON_ERROR_STOP=1 --single-transaction \
            --file=migrations/20261024051228_atomic_password_reset.sql
      - name: Prove unexpected password-login ACL drift fails closed
        run: |
          psql -X --set=ON_ERROR_STOP=1 \
            --file=tests/postgres/atomic_password_login_acl_drift_fixture.sql
