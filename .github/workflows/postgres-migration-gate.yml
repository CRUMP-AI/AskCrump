          POSTGRES_PASSWORD: postgres-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d askcrump_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATABASE: askcrump_test
      PGUSER: postgres
      PGPASSWORD: postgres-ci-only

    steps:
      - uses: actions/checkout@v7
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply prerequisite schema and migrations
        run: |
          psql -X --set=ON_ERROR_STOP=1 --file=tests/postgres/atomic_video_reservation_baseline.sql
          psql -X --set=ON_ERROR_STOP=1 --file=migrations/015_video_engine_continuations.sql
          psql -X --set=ON_ERROR_STOP=1 --file=migrations/016_video_engine_root_fk_index.sql
          psql -X --set=ON_ERROR_STOP=1 --file=migrations/20260924224459_atomic_video_reservation_billing.sql
      - name: Exercise migration against PostgreSQL
        run: >-
          psql -X --set=ON_ERROR_STOP=1
          --file=tests/postgres/test_atomic_video_reservation_billing.sql
