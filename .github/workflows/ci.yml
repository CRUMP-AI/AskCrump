name: CI

on:
  push:
    branches: [main, ci/autonomous-integrated-20260916]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  autonomous-atomic-postgres:
    name: Autonomous atomic dispatch PostgreSQL 15
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-postgres-test.txt
      - name: Install PostgreSQL probe dependency
        run: pip install -r requirements-postgres-test.txt
      - name: Start owned loopback PostgreSQL
        run: |
          docker run --detach --rm \
            --name askcrump-autonomous-atomic-postgres \
            --network host \
            --env POSTGRES_DB=postgres \
            --env POSTGRES_PASSWORD=postgres \
            --env POSTGRES_USER=postgres \
            postgres:15 \
            -c listen_addresses=127.0.0.1 \
            -c port=55433
          for attempt in {1..30}; do
            if docker exec askcrump-autonomous-atomic-postgres \
              pg_isready -h 127.0.0.1 -p 55433 -U postgres -d postgres; then
              exit 0
            fi
            sleep 1
          done
          docker logs askcrump-autonomous-atomic-postgres
          exit 1
      - name: Apply migrations and exercise atomic dispatch
        run: python scripts/verify_autonomous_atomic_dispatch_postgres.py
        env:
          ASKCRUMP_DISPOSABLE_POSTGRES_ACK: I_OWN_THIS_DISPOSABLE_LOCAL_CLUSTER
          ASKCRUMP_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:55433/postgres
      - name: Stop owned loopback PostgreSQL
        if: always()
        run: docker stop askcrump-autonomous-atomic-postgres || true

  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check app.py backend tests
      - name: Audit production dependencies
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Compile application
        run: python -m compileall -q app.py backend
      - name: Run test suite
        run: pytest -q
        env:
          APP_ENV: test
          APP_URL: http://testserver
          COOKIE_SECURE: "false"
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-service-key

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit JavaScript dependencies
        run: npm audit --package-lock-only --audit-level=moderate
      - name: Install browser verifier
        run: npx playwright install --with-deps chromium
      - name: Validate browser code
        run: npm test
      - name: Validate interactive controls
        run: npm run test:browser-controls
      - name: Validate public accessibility
        run: npm run test:a11y
      - name: Validate production bundle and store evidence
        run: npm run build && npm run store:verify:metadata && npm run store:verify:privacy
