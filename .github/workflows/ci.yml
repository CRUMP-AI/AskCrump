name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check app.py backend tests
      - name: Audit production dependencies
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Compile application
        run: python -m compileall -q app.py backend
      - name: Run test suite
        run: pytest -q
        env:
          APP_ENV: test
          APP_URL: http://testserver
          COOKIE_SECURE: "false"
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-service-key

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Validate offline intelligence evaluator contract
        run: npm run test:intelligence-contract
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser API fixture dependencies
        run: pip install -r requirements.txt
      - name: Audit JavaScript dependencies
        run: npm audit --package-lock-only --audit-level=moderate
      - name: Install browser verifier
        run: npx playwright install --with-deps chromium
      - name: Validate browser code
        run: npm test
      - name: Validate interactive controls
        run: npm run test:browser-controls
      - name: Validate public accessibility
        run: npm run test:a11y
      - name: Validate production bundle and store evidence
        run: npm run build && npm run store:verify:metadata && npm run store:verify:privacy

  v2-status:
    name: Crump Code v2 status labeling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Run against the raw head content, not the PR merge commit, so the
          # generator and its checks validate what would actually be merged.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Regenerate status record
        run: python3 scripts/crump_code_v2_status.py --out /tmp/status.v2.json
      - name: Committed status must match regenerated output
        run: |
          python3 - <<'EOF'
          import json, sys
          committed = json.load(open("benchmarks/crump_code/real_tasks_v2/status.v2.json"))
          fresh = json.load(open("/tmp/status.v2.json"))
          if committed != fresh:
              sys.exit("committed status.v2.json differs from regenerated output")
          print("status.v2.json matches regenerated output;", len(fresh["cases"]),
                "cases;", fresh["aggregate"])
          EOF
      - name: Run status generator negative tests
        run: python3 -m pytest tests/test_crump_code_v2_status.py -q

  v2-executor:
    name: Crump Code v2 executor boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Run against the raw head content, not the PR merge commit, so the
          # boundary checks validate what would actually be merged.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run executor boundary tests
        run: python3 -m pytest tests/test_crump_code_v2_executor.py -q

  v2-integration:
    name: Crump Code v2 driver-executor integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Run against the raw head content, not the PR merge commit, so the
          # integration and its determinism check validate what would
          # actually be merged.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run integration unit tests
        run: python3 -m pytest tests/test_crump_code_v2_integration.py -q
      - name: Run real fake-only 20-case integration end to end
        # Fake provider only: no model calls, no credentials, no spend.
        # Exits nonzero unless the report is valid AND deterministic.
        run: >-
          python3 scripts/crump_code_v2_integration.py
          --corpus-root benchmarks/crump_code/real_tasks_v2
          --work-root /tmp/crump-code-v2-integration
          --out /tmp/integration_report.v1.json
          --seed v1
