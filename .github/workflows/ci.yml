name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check app.py backend tests
      - name: Compile application
        run: python -m compileall -q app.py backend
      - name: Run test suite
        run: pytest -q
        env:
          APP_ENV: test
          APP_URL: http://testserver
          COOKIE_SECURE: "false"
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-service-key

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser verifier
        run: npx playwright install --with-deps chromium
      - name: Validate browser code
        run: npm test
      - name: Validate interactive controls
        run: npm run test:browser-controls
      - name: Validate production bundle and store evidence
        run: npm run build && npm run store:verify:metadata && npm run store:verify:privacy
