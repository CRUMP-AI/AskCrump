name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python 3.12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint Python
        run: ruff check app.py backend tests
      - name: Compile application
        run: python -m compileall -q app.py backend
      - name: Run test suite
        run: pytest -q
        env:
          APP_ENV: test
          APP_URL: http://testserver
          COOKIE_SECURE: "false"
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_SERVICE_KEY: test-service-key

  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate browser code
        run: npm test
