<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Password reset handoff fixture</title>
  <style>
    body { background:#0b0b0b; color:#f5f2ec; font:16px/1.5 system-ui,sans-serif; padding:32px; }
    form { display:grid; gap:12px; width:min(440px,100%); }
    input,button { box-sizing:border-box; min-height:44px; padding:10px 12px; }
    .auth-error { color:#ffb4ab; margin-top:12px; }
    .auth-success { color:#bdebbf; margin-top:12px; }
  </style>
</head>
<body>
  <div id="authContainer" style="display:none">
    <div id="loginForm" style="display:none">
      <h1>Welcome back.</h1>
      <form id="loginFormElement">
        <label for="loginEmail">Email</label>
        <input id="loginEmail" type="email" autocomplete="email" required>
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" autocomplete="current-password" required>
        <button type="submit">Sign in</button>
      </form>
      <div id="loginError" class="auth-error" role="alert" style="display:none"></div>
      <div id="loginSuccess" class="auth-success" role="status" style="display:none"></div>
      <div id="verificationNeeded" style="display:none"></div>
    </div>
    <div id="registerForm" style="display:none"></div>
    <div id="forgotPasswordForm" style="display:none"></div>
    <div id="resetPasswordForm" style="display:none" data-token="">
      <h1>Set new password.</h1>
      <form id="resetPasswordFormElement">
        <label for="newPassword">New Password</label>
        <input id="newPassword" type="password" required minlength="10" maxlength="256" autocomplete="new-password">
        <label for="confirmNewPassword">Confirm New Password</label>
        <input id="confirmNewPassword" type="password" required autocomplete="new-password">
        <button type="submit">Reset Password</button>
      </form>
      <div id="resetPasswordError" class="auth-error" role="alert" style="display:none"></div>
      <div id="resetPasswordSuccess" class="auth-success" role="status" aria-live="polite" style="display:none"></div>
    </div>
  </div>
  <div id="tosModal" style="display:none"></div>
  <div id="onboardingModal" style="display:none"></div>
  <div id="appContainer" style="display:none"><textarea id="userInput"></textarea></div>
  <output id="fixtureResetCalls" aria-label="Password reset request count">0</output>
  <script>
    const nativeSetTimeout = window.setTimeout.bind(window);
    window.setTimeout = (callback, delay, ...args) => nativeSetTimeout(
      callback,
      delay === 1800 ? 75 : delay,
      ...args,
    );
    window.__fixture = {resetCalls: 0};
    window.va = () => {};
    window.CrumpAPI = {ready: Promise.resolve()};
    window.deviceAuth = {
      async checkSession() { return {success:true, authenticated:false}; },
      async login() { return {success:false}; },
      async logout() {},
    };
    window.configureUserStorage = () => {};
    window.profileManager = {applyServerSubscription() {}, updateProfile() {}};
    window.SyncManager = {pull: () => Promise.resolve()};
    window.fetch = (url) => {
      if (url !== '/api/auth/reset-password') {
        throw new Error(`Unexpected fixture request: ${url}`);
      }
      window.__fixture.resetCalls += 1;
      document.getElementById('fixtureResetCalls').textContent = String(window.__fixture.resetCalls);
      return Promise.resolve(new Response(JSON.stringify({
        success:true,
        message:'Password updated. Sign in with your new password.',
      }), {status:200, headers:{'Content-Type':'application/json'}}));
    };
  </script>
  <script src="/public/auth-resilience.js?v=fixture-password-reset-handoff"></script>
  <script src="/public/auth-controller.js?v=fixture-password-reset-handoff-2"></script>
</body>
</html>
