<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ask Crump image preview stability fixture</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/public/crump-5.0.css?v=image-reference-entry-fixture-1">
</head>
<body>
  <main id="fixtureWorkspace">
    <button id="openImageStudio" type="button" onclick="window.CrumpImageStudio?.open()">Open Image Studio</button>
    <section id="transientImageEntry">
      <button id="openImageStudioTransient" type="button" onclick="this.parentElement.hidden = true; window.CrumpImageStudio?.open()">Open Image Studio from a transient chooser</button>
    </section>
    <div class="input-area">
      <div id="filePreview"></div>
      <div class="input-container">
        <button id="attachBtn" type="button">Attach</button>
        <textarea id="userInput"></textarea>
        <button id="sendButton" type="button">Send</button>
      </div>
    </div>
    <input id="fileInput" type="file" accept="image/*">
    <output id="fixtureResult">waiting</output>
  </main>
  <script>
    window.__fixtureUserA = {id: '00000000-0000-0000-0000-000000000001'};
    window.__fixtureUserB = {id: '00000000-0000-0000-0000-000000000002'};
    window.currentUser = null;
    window.__xhrAborts = 0;
    window.fetch = async path => {
      const url = String(path || '');
      if (url === '/api/files/sign-upload') {
        return new Response(JSON.stringify({
          file: {id: '11111111-1111-4111-8111-111111111111', name: 'fixture.png', type: 'image/png', size: 68},
          uploadUrl: '/fixture-upload',
        }), {status: 200, headers: {'Content-Type': 'application/json'}});
      }
      if (url.includes('/complete')) {
        return new Response(JSON.stringify({
          file: {id: '11111111-1111-4111-8111-111111111111', name: 'fixture.png', type: 'image/png', size: 68},
        }), {status: 200, headers: {'Content-Type': 'application/json'}});
      }
      return new Response('{}', {status: 200, headers: {'Content-Type': 'application/json'}});
    };

    window.__uploadCacheControl = null;
    class FixtureXHR {
      constructor() {
        this.status = 200;
        this.listeners = {};
        this.uploadListeners = {};
        this.upload = {addEventListener: (name, handler) => { this.uploadListeners[name] = handler; }};
      }
      open() {}
      setRequestHeader() {}
      getResponseHeader() { return null; }
      addEventListener(name, handler) { this.listeners[name] = handler; }
      abort() { window.__xhrAborts += 1; this.listeners.abort?.(); }
      send(body) {
        window.__uploadCacheControl = body?.get?.('cacheControl') || null;
        [20, 45, 70, 95].forEach((loaded, index) => {
          setTimeout(() => this.uploadListeners.progress?.({lengthComputable: true, loaded, total: 100}), 45 * (index + 1));
        });
        setTimeout(() => this.listeners.load?.(), 250);
      }
    }
    window.XMLHttpRequest = FixtureXHR;
    window.__lastToast = null;
    window.showToast = (message, tone) => { window.__lastToast = {message, tone}; };

    window.__previewImagesAdded = 0;
    const observer = new MutationObserver(records => {
      records.forEach(record => record.addedNodes.forEach(node => {
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        if (node.matches?.('.crump50-upload-visual img')) window.__previewImagesAdded += 1;
        window.__previewImagesAdded += node.querySelectorAll?.('.crump50-upload-visual img').length || 0;
      }));
    });
    observer.observe(document.getElementById('filePreview'), {childList: true, subtree: true});
  </script>
  <script src="/public/safe-storage.js"></script>
  <script src="/public/app.js?v=auth-boundary-fixture-1"></script>
  <script src="/public/crump-5.0.js?v=image-reference-entry-fixture-1"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.currentUser = window.__fixtureUserA;
      window.dispatchEvent(new Event('crump:authenticated-ready'));
    }, {once: true});
  </script>
</body>
</html>
