<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Ask Crump Precision Edit fixture</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/public/crump-precision-image-edit.css?v=precision-edit-fixture-1">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1016; color: white; font-family: Arial, sans-serif; }
    #fixtureWorkspace { display: grid; justify-items: center; gap: 14px; }
    #openPrecision { min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; }
  </style>
</head>
<body>
  <main id="fixtureWorkspace">
    <button id="openPrecision" type="button">Open Precision Edit</button>
    <output id="fixtureOutput">waiting</output>
  </main>
  <script>
    window.__precisionStaged = null;
    window.__localSaveRequest = null;
    window.__appliedLocalFile = null;
    window.__lastToast = null;
    window.currentChatId = '22222222-2222-4222-8222-222222222222';
    window.showToast = (message, tone) => { window.__lastToast = {message, tone}; };
    const nativeFetch = window.fetch.bind(window);
    window.fetch = async (input, init = {}) => {
      const url = String(input || '');
      if (url.includes('/image-adjust')) {
        window.__localSaveRequest = {url, body: JSON.parse(String(init.body || '{}'))};
        return new Response(JSON.stringify({
          success: true,
          providerUsed: false,
          creditsUsed: 0,
          file: {
            id: '33333333-3333-4333-8333-333333333333',
            name: 'Crump_Local_Edit.png',
            type: 'image/png',
            size: 3210,
            url: '/api/files/33333333-3333-4333-8333-333333333333/content',
          },
        }), {status: 200, headers: {'Content-Type': 'application/json'}});
      }
      return nativeFetch(input, init);
    };
    window.CrumpImageStudio = Object.freeze({
      applyPrecisionSelection(payload) {
        window.__precisionStaged = payload;
        document.getElementById('fixtureOutput').textContent = 'selection staged';
      },
    });
    const source = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1c2834"/><stop offset="1" stop-color="#aa8750"/></linearGradient></defs>
        <rect width="640" height="480" fill="url(#g)"/>
        <circle cx="320" cy="220" r="125" fill="#d4b48b"/>
        <rect x="270" y="335" width="100" height="90" rx="32" fill="#212832"/>
      </svg>
    `)}`;
    document.getElementById('openPrecision').addEventListener('click', () => {
      window.CrumpPrecisionImageEditor.open({
        file: {id: '11111111-1111-4111-8111-111111111111', name: 'private-photo.png', type: 'image/png'},
        url: source,
        onApplied({file}) {
          window.__appliedLocalFile = file;
          document.getElementById('fixtureOutput').textContent = 'local edit applied';
          return true;
        },
      });
    });
  </script>
  <script src="/public/crump-precision-image-edit.js?v=precision-edit-fixture-1"></script>
</body>
</html>
