<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Ask Crump Precision Edit fixture</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/public/crump-precision-image-edit.css?v=precision-edit-fixture-1">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0b1016; color: white; font-family: Arial, sans-serif; }
    #fixtureWorkspace { display: grid; justify-items: center; gap: 14px; }
    #openPrecision { min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; }
  </style>
</head>
<body>
  <main id="fixtureWorkspace">
    <button id="openPrecision" type="button">Open Precision Edit</button>
    <output id="fixtureOutput">waiting</output>
  </main>
  <script>
    window.__precisionStaged = null;
    window.__localSaveRequest = null;
    window.__localSaveRequests = [];
    window.__localSaveFailure = false;
    window.__localSaveMetadataSize = '';
    window.__holdLocalSave = false;
    window.__ignoreLocalSaveAbort = false;
    window.__releaseLocalSave = null;
    window.__localSaveAborts = 0;
    window.__localSaveIgnoredAborts = 0;
    window.__localSaveResponses = 0;
    window.__localSaveSequence = 0;
    window.__unexpectedFetches = [];
    window.__appliedLocalFile = null;
    window.__localAppliedEvents = 0;
    window.__precisionStageCalls = 0;
    window.__lastToast = null;
    window.__versionRequest = null;
    window.currentChatId = '22222222-2222-4222-8222-222222222222';
    window.showToast = (message, tone) => { window.__lastToast = {message, tone}; };
    window.addEventListener('crump:local-image-edit-applied', () => { window.__localAppliedEvents += 1; });
    const nativeFetch = window.fetch.bind(window);
    window.fetch = async (input, init = {}) => {
      const url = String(input || '');
      if (url.includes('/versions')) {
        window.__versionRequest = url;
        return new Response(JSON.stringify({
          success: true,
          currentId: '11111111-1111-4111-8111-111111111111',
          versions: [
            {
              id: '00000000-0000-4000-8000-000000000000', name: 'Original.png', type: 'image/png',
              url: source, isOriginal: true, isCurrent: false, editKind: 'original', createdAt: '2026-09-07T18:00:00Z',
            },
            {
              id: '11111111-1111-4111-8111-111111111111', name: 'private-photo.png', type: 'image/png',
              url: source, isOriginal: false, isCurrent: true, editKind: 'local', createdAt: '2026-09-07T19:00:00Z',
            },
          ],
        }), {status: 200, headers: {'Content-Type': 'application/json'}});
      }
      if (url.includes('/image-adjust')) {
        const childNumber = ++window.__localSaveSequence;
        const savedFileId = `33333333-3333-4333-8333-${String(childNumber).padStart(12, '0')}`;
        const sourceFileId = decodeURIComponent(url.split('/api/files/')[1]?.split('/image-adjust')[0] || '');
        const request = {url, body: JSON.parse(String(init.body || '{}')), savedFileId};
        window.__localSaveRequest = request;
        window.__localSaveRequests.push(request);
        if (window.__holdLocalSave) {
          await new Promise((resolve, reject) => {
            const abort = () => {
              if (window.__ignoreLocalSaveAbort) {
                window.__localSaveIgnoredAborts += 1;
                return;
              }
              window.__releaseLocalSave = null;
              window.__localSaveAborts += 1;
              reject(new DOMException('The local save was aborted.', 'AbortError'));
            };
            window.__releaseLocalSave = () => {
              init.signal?.removeEventListener?.('abort', abort);
              window.__releaseLocalSave = null;
              resolve();
            };
            if (init.signal?.aborted) abort();
            else init.signal?.addEventListener?.('abort', abort, {once: true});
          });
        }
        window.__localSaveResponses += 1;
        if (window.__localSaveFailure) {
          return new Response(JSON.stringify({
            success: false,
            error: 'Fixture local save failed.',
          }), {status: 503, headers: {'Content-Type': 'application/json'}});
        }
        return new Response(JSON.stringify({
          success: true,
          providerUsed: false,
          creditsUsed: 0,
          file: {
            id: savedFileId,
            name: 'Crump_Local_Edit.png',
            type: 'image/png',
            size: 3210,
            url: `/api/files/${savedFileId}/content`,
            metadata: {
              sourceFileId,
              size: window.__localSaveMetadataSize || (
                request.body?.transform?.operations?.some(operation => operation?.type === 'rotate')
                  ? '480x640'
                  : '640x480'
              ),
            },
          },
        }), {status: 200, headers: {'Content-Type': 'application/json'}});
      }
      window.__unexpectedFetches.push({url, method: String(init.method || 'GET').toUpperCase()});
      return nativeFetch(input, init);
    };
    window.CrumpImageStudio = Object.freeze({
      applyPrecisionSelection(payload) {
        window.__precisionStageCalls += 1;
        window.__precisionStaged = payload;
        document.getElementById('fixtureOutput').textContent = 'selection staged';
      },
    });
    const source = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" width="640" height="480" viewBox="0 0 640 480">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1c2834"/><stop offset="1" stop-color="#aa8750"/></linearGradient></defs>
        <rect width="640" height="480" fill="url(#g)"/>
        <circle cx="320" cy="220" r="125" fill="#d4b48b"/>
        <rect x="270" y="335" width="100" height="90" rx="32" fill="#212832"/>
      </svg>
    `)}`;
    document.getElementById('openPrecision').addEventListener('click', () => {
      window.CrumpPrecisionImageEditor.open({
        file: {id: '11111111-1111-4111-8111-111111111111', name: 'private-photo.png', type: 'image/png'},
        url: source,
        onApplied({file}) {
          window.__appliedLocalFile = file;
          document.getElementById('fixtureOutput').textContent = 'local edit applied';
          return true;
        },
      });
    });
  </script>
  <script src="/public/crump-precision-image-edit.js?v=precision-edit-fixture-1"></script>
</body>
</html>
