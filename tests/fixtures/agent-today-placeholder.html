<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Today placeholder fixture</title>
  <script>
    // Reproduces the signed-in Today home composition: the workspace body
    // holds the Today layer (inserted first by the layer itself) and the
    // launchpad hero below it. The agent endpoints are stubbed in their
    // real shapes so the fixture can sit in either Google state:
    // ?state=planned renders the not-connected brief (slim notice, local
    // counts only), ?state=live renders the connected brief card from
    // the brief payload. Both states carry four pending approvals (two
    // with long recipient lists and long subjects) and one live
    // browser run.
    // ?theme=dark|light picks the appearance ground the layer lands on.
    (function () {
      var params = new URLSearchParams(location.search);
      document.documentElement.setAttribute('data-theme', params.get('theme') || 'dark');
      var state = params.get('state') || 'planned';
      var connected = state === 'live';
      // ?tasks=mixed|scheduled|empty picks the Tasks record the drawer
      // renders (default: the Today composition, whose Tasks panel the
      // queue interactions already exercise). ?guest=1 renders the
      // guest session, which must make zero agent calls.
      var tasksState = params.get('tasks') || '';
      // ?headlines=1 swaps the pending list for the headline
      // derivation matrix: one recipient with a carried display
      // name, three recipients, six recipients, a long subject, a
      // missing subject, missing recipients, and a calendar create.
      // The verifier asserts each card's exact headline in the
      // Tasks panel, where every pending approval renders in full.
      var headlinesMode = params.get('headlines') === '1';
      var guest = params.get('guest') === '1';
      window.__fetchCalls = [];
      if (guest) {
        window.currentUser = { id: 'fixture-guest', isGuest: true, fullName: 'Guest' };
        window.CrumpAccess = { isGuest: function () { return true; } };
        window.CrumpAuthBoundary = { authenticatedUserId: function () { return ''; } };
      } else {
        window.currentUser = { id: 'fixture-user', fullName: 'Gregory Crump', name: 'Gregory Crump' };
        window.CrumpAuthBoundary = { authenticatedUserId: function () { return 'fixture-user'; } };
      }
      var caps = [
        { id: 'gmail.send', status: 'planned', title: 'Send an email', verbPhrase: 'Send an email to' },
        { id: 'calendar.create', status: 'planned', title: 'Book a calendar event', verbPhrase: 'Book' },
        { id: 'browser.act', status: 'planned', title: 'Act in the browser', verbPhrase: 'Open the browser and' },
        { id: 'agent.today_brief', status: 'live', title: 'Today brief' },
        { id: 'agent.morning_brief', status: 'live', title: 'Send the morning brief', verbPhrase: 'Brief you every morning' },
        { id: 'research.web_search', status: 'live', title: 'Savannah technology hiring and company metrics review with extended notes', verbPhrase: 'Research' },
        { id: 'gmail.search', status: 'live', title: 'Search email', verbPhrase: 'Search email for' },
      ];
      var approvals = [
        {
          id: 'approval-1', runId: 'run-approval-1', capabilityId: 'gmail.send',
          summary: 'Send an email — Send an email to',
          payload: {
            to: ['ada@example.com', 'ben@example.com', 'cy@example.com'],
            subject: 'Following up',
            body: 'Thanks for your time today — sending the notes we discussed.',
          },
          creditCost: 2, status: 'pending', expiresAt: null, createdAt: '2026-11-10T14:00:00Z',
        },
        {
          id: 'approval-2', runId: 'run-approval-2', capabilityId: 'calendar.create',
          summary: 'Book a calendar event — Book',
          payload: {
            summary: 'Team sync', start: '2026-11-10T20:00:00Z', end: '2026-11-10T20:30:00Z',
            attendees: ['ada@example.com'],
          },
          creditCost: null, status: 'pending', expiresAt: null, createdAt: '2026-11-10T14:05:00Z',
        },
        {
          id: 'approval-3', runId: 'run-approval-3', capabilityId: 'gmail.send',
          summary: 'Send an email — Send an email to',
          payload: {
            to: [
              'alexandria.longaddress@some-company-example.com',
              'bartholomew.longaddress@some-company-example.com',
              'christopher.longaddress@some-company-example.com',
              'dorothea.longaddress@some-company-example.com',
            ],
            subject: 'Quarterly planning notes and next steps',
            body: 'Sharing the planning notes from this morning.',
          },
          creditCost: null, status: 'pending', expiresAt: null, createdAt: '2026-11-10T14:10:00Z',
        },
        {
          id: 'approval-4', runId: 'run-approval-4', capabilityId: 'gmail.send',
          summary: 'Send an email — Send an email to',
          payload: {
            to: [
              'alexandria.longaddress@some-company-example.com',
              'bartholomew.longaddress@some-company-example.com',
              'christopher.longaddress@some-company-example.com',
              'dorothea.longaddress@some-company-example.com',
              'evangeline.longaddress@some-company-example.com',
              'frederick.longaddress@some-company-example.com',
            ],
            subject: 'Quarterly planning notes and next steps for the full launch team review',
            body: 'Sharing the planning notes from this morning, with the launch checklist attached for the whole team.',
          },
          creditCost: null, status: 'pending', expiresAt: null, createdAt: '2026-11-10T14:15:00Z',
        },
      ];
      var runs = [
        {
          // The live run carries its goal — the work in the user's
          // own terms — the way a run created from a request does;
          // its detail below records the step it is on.
          id: 'run-live-1', capabilityId: 'browser.act', status: 'running',
          goal: 'Researching 4 Savannah tech roles',
          createdAt: '2026-11-10T14:20:00Z', updatedAt: '2026-11-10T14:25:00Z',
        },
      ];
      var automations = [
        {
          id: 'auto-1', capabilityId: 'agent.morning_brief',
          schedule: { kind: 'daily', time: '07:00', timezone: 'America/New_York' },
          payload: { schedule: 'daily 07:00 America/New_York' },
          enabled: true, lastRunAt: '2026-11-09T12:00:00Z', nextRunAt: '2026-11-11T12:00:00Z',
          createdAt: '2026-11-08T12:00:00Z', updatedAt: '2026-11-09T12:00:00Z',
        },
        {
          id: 'auto-2', capabilityId: 'research.web_search',
          schedule: { kind: 'daily', time: '08:30', timezone: 'America/New_York' },
          payload: {},
          enabled: false, lastRunAt: null, nextRunAt: '2026-11-11T13:30:00Z',
          createdAt: '2026-11-08T12:00:00Z', updatedAt: '2026-11-09T12:00:00Z',
        },
      ];
      if (tasksState === 'mixed') {
        runs = runs.concat([{
          id: 'run-done-1', capabilityId: 'gmail.search', status: 'succeeded',
          createdAt: '2026-11-10T11:00:00Z', updatedAt: '2026-11-10T11:05:00Z',
          resultSummary: 'Found 3 threads about the launch checklist.',
        }]);
      } else if (tasksState === 'scheduled') {
        approvals = [];
        runs = [];
      } else if (tasksState === 'empty') {
        approvals = [];
        runs = [];
        automations = [];
      }
      if (headlinesMode) {
        runs = [];
        approvals = [
          {
            id: 'matrix-1', runId: 'run-matrix-1', capabilityId: 'gmail.send',
            summary: 'Send an email — Send an email to',
            payload: {
              to: ['Ada Lovelace <ada@example.com>'],
              subject: 'Following up',
              body: 'Thanks for your time today.',
            },
            creditCost: null, status: 'pending', expiresAt: null, createdAt: '2026-11-10T14:00:00Z',
          },
          {
            id: 'matrix-2', runId: 'run-matrix-2', capabilityId: 'gmail.send',
            summary: 'Send an email — Send an email to',
            payload: {
              to: ['ada@example.com', 'ben@example.com', 'cy@example.com'],
              subject: 'Following up',
              body: 'Thanks for your time today.',
            },
            creditCost: null, status: 'pending', expiresAt: null, createdAt: '2026-11-10T14:01:00Z',
          },
          {
            id: 'matrix-3', runId: 'run-matrix-3', capabilityId: 'gmail.send',
            summary: 'Send an email — Send an email to',
            payload: {
              to: [
                'ada@example.com', 'ben@example.com', 'cy@example.com',
                'dee@example.com', 'eli@example.com', 'fay@example.com',
              ],
              subject: 'Following up',
              body: 'Thanks for your time today.',
            },
            creditCost: null, status: 'pending', expiresAt: null, createdAt: '2026-11-10T14:02:00Z',
          },
          {
            id: 'matrix-4', runId: 'run-matrix-4', capabilityId: 'gmail.send',
            summary: 'Send an email — Send an email to',
            payload: {
              to: ['ben@example.com', 'cy@example.com'],
              subject: 'Quarterly planning notes and next steps for the full launch team review',
              body: 'Sharing the planning notes from this morning.',
            },
            creditCost: null, status: 'pending', expiresAt: null, createdAt: '2026-11-10T14:03:00Z',
          },
          {
            id: 'matrix-5', runId: 'run-matrix-5', capabilityId: 'gmail.send',
            summary: 'Send an email — Send an email to',
            payload: {
              to: ['ada@example.com'],
              body: 'Sharing the notes from this morning.',
            },
            creditCost: null, status: 'pending', expiresAt: null, createdAt: '2026-11-10T14:04:00Z',
          },
          {
            id: 'matrix-6', runId: 'run-matrix-6', capabilityId: 'gmail.send',
            summary: 'Send an email — Send an email to',
            payload: {
              subject: 'Following up',
              body: 'Thanks for your time today.',
            },
            creditCost: null, status: 'pending', expiresAt: null, createdAt: '2026-11-10T14:05:00Z',
          },
          {
            id: 'matrix-7', runId: 'run-matrix-7', capabilityId: 'calendar.create',
            summary: 'Book a calendar event — Book',
            payload: {
              summary: 'Team sync', start: '2026-11-10T20:00:00Z', end: '2026-11-10T20:30:00Z',
              attendees: ['ada@example.com'],
            },
            creditCost: null, status: 'pending', expiresAt: null, createdAt: '2026-11-10T14:06:00Z',
          },
        ];
      }
      var runDetails = {
        'run-live-1': {
          id: 'run-live-1', capabilityId: 'browser.act', status: 'running',
          goal: 'Researching 4 Savannah tech roles',
          createdAt: '2026-11-10T14:20:00Z', updatedAt: '2026-11-10T14:25:00Z',
          steps: [
            { type: 'run.created', createdAt: '2026-11-10T14:20:00Z' },
            { type: 'run.queued', createdAt: '2026-11-10T14:21:00Z' },
            {
              type: 'step.progress',
              payload: { label: 'Reviewing employer career pages' },
              createdAt: '2026-11-10T14:24:00Z',
            },
          ],
          pendingActions: [], resultSummary: null,
        },
        'run-done-1': {
          id: 'run-done-1', capabilityId: 'gmail.search', status: 'succeeded',
          createdAt: '2026-11-10T11:00:00Z', updatedAt: '2026-11-10T11:05:00Z',
          steps: [{ type: 'run.created', createdAt: '2026-11-10T11:00:00Z' }],
          pendingActions: [], resultSummary: 'Found 3 threads about the launch checklist.',
        },
      };
      var googleStatus = connected
        ? {
            configured: true, connected: true,
            accounts: [{
              email: 'gregory@example.com', status: 'connected',
              scopes: [
                'https://www.googleapis.com/auth/gmail.readonly',
                'https://www.googleapis.com/auth/calendar.readonly',
              ],
            }],
          }
        : { configured: true, connected: false, accounts: [] };
      var brief = connected
        ? {
            brief: {
              generatedAt: '2026-11-10T14:30:00Z',
              calendar: [{
                id: 'event-1', summary: 'Design review',
                start: '2026-11-10T20:30:00Z', end: '2026-11-10T21:00:00Z',
                location: '', attendees: [],
              }],
              inboxHighlights: [{
                id: 'message-1', from: 'Ada <ada@example.com>',
                subject: 'Launch checklist', snippet: 'The checklist is ready.',
                date: 'Mon, 10 Nov 2026 09:12:00 -0500',
              }],
            },
          }
        : {
            brief: {
              generatedAt: '2026-11-10T14:30:00Z',
              calendar: 'unavailable: Google is not connected for this account.',
              inboxHighlights: 'unavailable: Google is not connected for this account.',
            },
          };
      window.fetch = function (path) {
        window.__fetchCalls.push(String(path));
        var data = {};
        var target = String(path);
        if (target.indexOf('/api/connections/google/status') === 0) data = googleStatus;
        else if (target.indexOf('/api/agent/capabilities') === 0) data = { capabilities: caps };
        else if (target.indexOf('/api/agent/approvals') === 0) data = { approvals: approvals };
        else if (target.indexOf('/api/agent/automations') === 0) data = { automations: automations };
        else if (target.indexOf('/api/agent/today') === 0) data = brief;
        else if (target.indexOf('/api/agent/runs/') === 0) {
          var detailId = decodeURIComponent(target.slice('/api/agent/runs/'.length));
          data = { run: runDetails[detailId] || null };
        }
        else if (target.indexOf('/api/agent/runs') === 0) data = { runs: runs };
        return Promise.resolve({
          ok: true,
          status: 200,
          json: function () { return Promise.resolve(data); },
        });
      };
    })();
  </script>

          <section id="v1Launchpad" class="v1-launchpad" aria-label="Start something">
            <div class="v1-launchpad-intro">
              <div id="v1Greeting" class="v1-launchpad-greeting">Good afternoon, Gregory.</div>
              <h1>What can I help you get done?</h1>
              <p>Start with a question, continue meaningful work, or make something worth keeping.</p>

            <p class="v1-launchpad-actions-label">Ways to begin</p>

  <script src="/public/crump-agent-today-1.0.js?v=5.9.76-agent-today-19"></script>
