<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project resume real application-state boundary fixture</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/public/crump-vision-projects-1.0.css?v=project-resume-real-state-1">
</head>
<body>
  <main id="fixtureRoot"></main>
  <aside id="chatsList" aria-label="Conversations"></aside>
  <section id="chatContainer" aria-label="Messages"></section>
  <textarea id="userInput" aria-label="Message Crump"></textarea>
  <button id="sendButton" type="button">Send</button>
  <button id="newChatBtn" type="button">New</button>
  <input id="fileInput" type="file">
  <script>
    (() => {
      'use strict';

      const ownerA = '11111111-1111-4111-8111-111111111111';
      const ownerB = 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';
      const projectId = '22222222-2222-4222-8222-222222222222';
      const ownerAChat = {
        id: '33333333-3333-4333-8333-333333333333',
        chat_id: '33333333-3333-4333-8333-333333333333',
        title: 'Owner A private launch plan',
        messages: [{id: 'private-a-message', role: 'user', content: 'owner-a-private-content'}],
        createdAt: '2026-10-23T12:15:00Z',
        updatedAt: '2026-10-24T01:05:00Z',
        revision: 2,
      };
      const ownerBChat = {
        id: 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
        chat_id: 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
        title: 'Owner B retained work',
        messages: [{id: 'private-b-message', role: 'user', content: 'owner-b-private-content'}],
        createdAt: '2026-10-24T02:00:00Z',
        updatedAt: '2026-10-24T02:00:00Z',
        revision: 1,
      };
      const ownerADeletion = {
        id: '44444444-4444-4444-8444-444444444444',
        deleted_at: '2026-10-24T01:10:00Z',
      };
      const ownerBDeletion = {
        id: 'cccccccc-cccc-4ccc-8ccc-cccccccccccc',
        deleted_at: '2026-10-24T02:10:00Z',
      };
      let currentUserValue = {id: ownerA};
      let authOwnerId = ownerA;
      let authRevision = 0;
      let currentDestination = 'projects';
      let projectsView = null;
      const scrubbers = new Map();
      const pendingPulls = new Map();

      Object.defineProperty(window, 'currentUser', {
        configurable: true,
        get: () => currentUserValue,
        set(nextUser) {
          const nextOwnerId = String(nextUser?.id || '');
          if (nextOwnerId !== authOwnerId) {
            authRevision += 1;
            scrubbers.forEach(scrub => scrub({
              reason: nextOwnerId ? 'authenticated-user-changed' : 'authenticated-user-cleared',
              previousUserId: authOwnerId,
              nextUserId: nextOwnerId,
              revision: authRevision,
            }));
          }
          currentUserValue = nextUser || null;
          authOwnerId = nextOwnerId;
        },
      });
      window.CrumpAuthBoundary = Object.freeze({
        authenticatedUserId: () => authOwnerId,
        revision: () => authRevision,
        register(name, scrub) {
          scrubbers.set(String(name), scrub);
          return () => scrubbers.delete(String(name));
        },
      });
      window.SafeStorage = {
        getItem: key => localStorage.getItem(key),
        setItem: (key, value) => localStorage.setItem(key, value),
        removeItem: key => localStorage.removeItem(key),
      };
      window.renderMessages = messages => {
        const fragment = document.createDocumentFragment();
        (Array.isArray(messages) ? messages : []).forEach(message => {
          const node = document.createElement('p');
          node.dataset.messageId = String(message?.id || '');
          node.textContent = String(message?.content || '');
          fragment.appendChild(node);
        });
        document.getElementById('chatContainer').replaceChildren(fragment);
        window.__fixture.renderMessageCalls += 1;
      };
      window.showToast = (message, type) => window.__fixture.toasts.push({message, type});
      window.CrumpAnalytics = {
        track(name, detail) {
          window.__fixture.actions.push('track');
          window.__fixture.events.push({name, detail});
          return Promise.resolve(true);
        },
      };
      window.CrumpVision = {
        registerView(id, view) {
          if (id !== 'projects') throw new Error(`Unexpected fixture view: ${id}`);
          projectsView = view;
          if (currentDestination === 'projects') view.render(document.getElementById('fixtureRoot'));
          return true;
        },
        current: () => currentDestination,
        navigate(id) {
          if (currentDestination === 'projects') projectsView?.onHide?.();
          currentDestination = id;
          window.__fixture.actions.push(`navigate:${id}`);
          window.__fixture.navigations.push(id);
          const root = document.getElementById('fixtureRoot');
          if (id === 'projects') projectsView?.render(root);
          else {
            root.className = '';
            root.innerHTML = `<section data-fixture-destination="${id}">${id === 'library' ? 'Library remains active' : 'Ask workspace'}</section>`;
          }
        },
      };

      localStorage.clear();
      localStorage.setItem(`crump_chats:${ownerA}`, JSON.stringify([ownerAChat]));
      localStorage.setItem(`crump_chats:${ownerB}`, JSON.stringify([ownerBChat]));
      localStorage.setItem(`crump_deleted_chats_v4:${ownerA}`, JSON.stringify([ownerADeletion]));
      localStorage.setItem(`crump_deleted_chats_v4:${ownerB}`, JSON.stringify([ownerBDeletion]));
      localStorage.setItem(`crump_last_sync_v4:${ownerA}`, JSON.stringify('a-cursor-original'));
      localStorage.setItem(`crump_last_sync_v4:${ownerB}`, JSON.stringify('b-cursor-original'));

      window.__fixture = {
        ownerA,
        ownerB,
        projectId,
        ownerAChat,
        ownerBChat,
        ownerADeletion,
        ownerBDeletion,
        actions: [],
        events: [],
        loadCalls: [],
        navigations: [],
        pullClaims: [],
        pushClaims: [],
        pushPayloads: [],
        replaceCalls: 0,
        renderListCalls: 0,
        renderMessageCalls: 0,
        syncResults: [],
        toasts: [],
        currentDestination: () => currentDestination,
      };

      window.fetch = (input, options = {}) => {
        const url = new URL(String(input), window.location.href);
        const path = url.pathname;
        const ownerBView = authOwnerId === ownerB;
        let body;
        if (path === '/api/projects') {
          body = {success: true, projects: [{
            id: projectId,
            name: ownerBView ? 'Owner B Project' : 'Owner A Project',
            description: ownerBView ? 'Owner B private project.' : 'Owner A private project.',
            created_at: '2026-10-23T12:00:00Z',
            updated_at: '2026-10-24T01:00:00Z',
          }]};
        } else if (path === `/api/projects/${projectId}`) {
          body = {success: true, project: {
            id: projectId,
            name: ownerBView ? 'Owner B Project' : 'Owner A Project',
            description: ownerBView ? 'Owner B private project.' : 'Owner A private project.',
            created_at: '2026-10-23T12:00:00Z',
            updated_at: '2026-10-24T01:00:00Z',
          }, context: {canon: [], manuscripts: []}};
        } else if (path === `/api/projects/${projectId}/chats`) {
          const chat = ownerBView ? ownerBChat : ownerAChat;
          body = {success: true, conversations: [{
            chatId: chat.id,
            title: chat.title,
            createdAt: chat.createdAt,
            updatedAt: chat.updatedAt,
          }]};
        } else if (path === '/api/library/books') {
          body = {success: true, books: []};
        } else if (path === '/api/sync/pull') {
          const claim = new Headers(options.headers || {}).get('X-Ask-Crump-Sync-Owner') || '';
          window.__fixture.pullClaims.push(claim);
          return new Promise(resolve => pendingPulls.set(claim, resolve));
        } else if (path === '/api/sync/push') {
          const claim = new Headers(options.headers || {}).get('X-Ask-Crump-Sync-Owner') || '';
          window.__fixture.pushClaims.push(claim);
          window.__fixture.pushPayloads.push({
            ownerId: claim,
            payload: JSON.parse(String(options.body || '{}')),
          });
          return Promise.resolve(new Response(JSON.stringify({success: true}), {
            status: 200,
            headers: {'Content-Type': 'application/json'},
          }));
        } else {
          return Promise.resolve(new Response(JSON.stringify({
            success: false,
            error: `Unexpected fixture path: ${path}`,
          }), {status: 404, headers: {'Content-Type': 'application/json'}}));
        }
        return Promise.resolve(new Response(JSON.stringify(body), {
          status: 200,
          headers: {'Content-Type': 'application/json'},
        }));
      };

      window.__fixture.resolvePull = (ownerId, {success = true} = {}) => {
        const resolve = pendingPulls.get(ownerId);
        pendingPulls.delete(ownerId);
        const chat = ownerId === ownerB ? ownerBChat : ownerAChat;
        resolve?.(new Response(JSON.stringify(success ? {
          success: true,
          serverTime: ownerId === ownerB ? '2026-10-24T07:01:00Z' : '2026-10-24T07:00:00Z',
          data: {chats: [chat], settings: null},
        } : {
          success: false,
          code: 'SYNC_TEMPORARILY_UNAVAILABLE',
          error: 'Synthetic owner-bound pull failure.',
        }), {
          status: success ? 200 : 503,
          headers: {'Content-Type': 'application/json'},
        }));
      };
    })();
  </script>
  <script src="/public/app.js?v=project-resume-real-state-1"></script>
  <script src="/public/sync-manager.js?v=project-resume-real-state-1"></script>
  <script src="/public/chat-sync.js?v=project-resume-real-state-1"></script>
  <script>
    (() => {
      const fixture = window.__fixture;
      window.configureUserStorage(fixture.ownerA);

      const realReplaceChats = window.replaceChats;
      window.replaceChats = (...args) => {
        fixture.replaceCalls += 1;
        return realReplaceChats(...args);
      };
      const realRenderChatsList = window.renderChatsList;
      window.renderChatsList = (...args) => {
        fixture.renderListCalls += 1;
        return realRenderChatsList(...args);
      };
      const realLoadChat = window.loadChat;
      window.loadChat = id => {
        fixture.loadCalls.push(String(id));
        fixture.actions.push(`load:${id}`);
        return realLoadChat(id);
      };

      window.replaceChats([fixture.ownerAChat]);
      window.loadChat(fixture.ownerAChat.id);
      fixture.actions.length = 0;
      fixture.loadCalls.length = 0;
      fixture.replaceCalls = 0;
      fixture.renderListCalls = 0;
      fixture.renderMessageCalls = 0;
      window.__crumpSyncData = {chats: [fixture.ownerAChat], settings: null};
      fixture.aStorageOriginal = localStorage.getItem(`crump_chats:${fixture.ownerA}`);
      fixture.bStorageOriginal = localStorage.getItem(`crump_chats:${fixture.ownerB}`);
      fixture.aCursorOriginal = localStorage.getItem(`crump_last_sync_v4:${fixture.ownerA}`);
      fixture.bCursorOriginal = localStorage.getItem(`crump_last_sync_v4:${fixture.ownerB}`);

      const realSynchronize = window.syncChatsFromServer;
      fixture.startSync = () => {
        // Force the network path for the delayed-response regression. Tests
        // can then seed an owner-A prefetch while that request is in flight to
        // prove the auth scrub discards it before owner B begins.
        window.__crumpSyncData = null;
        const promise = realSynchronize();
        promise.then(result => fixture.syncResults.push(result));
        return promise;
      };
      fixture.seedOwnerAPrefetch = () => {
        window.__crumpSyncData = {chats: [fixture.ownerAChat], settings: null};
      };
      fixture.switchToOwnerB = () => {
        window.currentUser = {id: fixture.ownerB};
        window.configureUserStorage(fixture.ownerB);
      };
      fixture.restartOwnerBSession = () => {
        window.currentUser = null;
        window.currentUser = {id: fixture.ownerB};
        window.configureUserStorage(fixture.ownerB);
      };
      fixture.switchToLogout = () => {
        window.currentUser = null;
      };
      fixture.openLibrary = () => window.CrumpVision.navigate('library');
      fixture.reopenProjects = () => window.CrumpVision.navigate('projects');
    })();
  </script>
  <script src="/public/crump-vision-projects-1.0.js?v=project-resume-real-state-1"></script>
</body>
</html>
