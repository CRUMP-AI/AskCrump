<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Project resume authentication-boundary fixture</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/public/crump-vision-projects-1.0.css?v=project-resume-auth-fixture-1">
</head>
<body>
  <main id="fixtureRoot"></main>
  <textarea id="userInput" aria-label="Message Crump"></textarea>
  <script>
    (() => {
      'use strict';

      const scenario = new URL(window.location.href).searchParams.get('scenario') || 'same';
      const ownerA = '11111111-1111-4111-8111-111111111111';
      const ownerB = 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa';
      const projectId = '22222222-2222-4222-8222-222222222222';
      const chatId = '33333333-3333-4333-8333-333333333333';
      const ownerAChat = {
        id: chatId,
        chat_id: chatId,
        title: 'Supervisor launch plan',
        messages: [{id: 'private-a-message', role: 'user', content: 'owner-a-private-content'}],
        created_at: '2026-10-23T12:15:00Z',
        updated_at: '2026-10-24T01:05:00Z',
        revision: 2,
      };
      const ownerBChat = {
        id: 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
        chat_id: 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
        title: 'Owner B work',
        messages: [],
        createdAt: '2026-10-24T02:00:00Z',
        updatedAt: '2026-10-24T02:00:00Z',
        revision: 1,
      };
      let currentUserValue = {id: ownerA};
      let authOwnerId = ownerA;
      let authRevision = 0;
      let pendingPullResolve = null;
      const scrubbers = new Map();

      window.STORAGE_KEYS = {
        CHATS: `crump_chats:${ownerA}`,
        CURRENT_CHAT: `crump_current_chat:${ownerA}`,
        ASSISTANT_NAME: `crump_assistant_name:${ownerA}`,
        WORK_MODE: `crump_work_mode:${ownerA}`,
        WORK_START: `crump_work_start:${ownerA}`,
        WORK_END: `crump_work_end:${ownerA}`,
      };
      window.configureUserStorage = userId => {
        STORAGE_KEYS.CHATS = `crump_chats:${userId}`;
        STORAGE_KEYS.CURRENT_CHAT = `crump_current_chat:${userId}`;
        STORAGE_KEYS.ASSISTANT_NAME = `crump_assistant_name:${userId}`;
        STORAGE_KEYS.WORK_MODE = `crump_work_mode:${userId}`;
        STORAGE_KEYS.WORK_START = `crump_work_start:${userId}`;
        STORAGE_KEYS.WORK_END = `crump_work_end:${userId}`;
      };
      window.SafeStorage = {
        getItem: key => localStorage.getItem(key),
        setItem: (key, value) => localStorage.setItem(key, value),
      };

      Object.defineProperty(window, 'currentUser', {
        configurable: true,
        get: () => currentUserValue,
        set(nextUser) {
          const nextOwnerId = String(nextUser?.id || '');
          if (authOwnerId !== nextOwnerId) {
            authRevision += 1;
            scrubbers.forEach(scrub => scrub({
              previousUserId: authOwnerId,
              nextUserId: nextOwnerId,
              revision: authRevision,
            }));
          }
          currentUserValue = nextUser || null;
          authOwnerId = nextOwnerId;
        },
      });
      window.CrumpAuthBoundary = Object.freeze({
        authenticatedUserId: () => authOwnerId,
        revision: () => authRevision,
        register(name, scrub) {
          scrubbers.set(String(name), scrub);
          return () => scrubbers.delete(String(name));
        },
      });

      localStorage.clear();
      localStorage.setItem(`crump_chats:${ownerA}`, '[]');
      localStorage.setItem(`crump_chats:${ownerB}`, JSON.stringify([ownerBChat]));
      localStorage.setItem(`crump_last_sync_v4:${ownerA}`, JSON.stringify('a-cursor-original'));
      localStorage.setItem(`crump_last_sync_v4:${ownerB}`, JSON.stringify('b-cursor-original'));
      window.chats = [];
      window.currentChatId = '';
      window.__fixture = {
        scenario,
        ownerA,
        ownerB,
        projectId,
        chatId,
        actions: [],
        events: [],
        loadCalls: [],
        navigations: [],
        pullCalls: 0,
        pushCalls: 0,
        replaceCalls: 0,
        renderListCalls: 0,
        renderMessageCalls: 0,
        syncCalls: 0,
        syncResult: null,
        syncSettled: false,
        toasts: [],
        switchToOwnerB() {
          window.currentUser = {id: ownerB};
          window.configureUserStorage(ownerB);
          window.chats = [ownerBChat];
          window.currentChatId = '';
        },
        resolveOwnerAPull() {
          const resolve = pendingPullResolve;
          pendingPullResolve = null;
          resolve?.(new Response(JSON.stringify({
            success: true,
            serverTime: '2026-10-24T06:30:00Z',
            data: {chats: [ownerAChat], settings: null},
          }), {status: 200, headers: {'Content-Type': 'application/json'}}));
        },
      };

      window.fetch = input => {
        const path = new URL(String(input), window.location.href).pathname;
        let body;
        if (path === '/api/projects') {
          const ownerBView = authOwnerId === ownerB;
          body = {success: true, projects: [{
            id: projectId,
            name: ownerBView ? 'Owner B Project' : 'Launch Project',
            description: ownerBView ? 'Owner B private work.' : 'A private continuation fixture.',
            created_at: '2026-10-23T12:00:00Z',
            updated_at: '2026-10-24T01:00:00Z',
          }]};
        } else if (path === `/api/projects/${projectId}`) {
          const ownerBView = authOwnerId === ownerB;
          body = {success: true, project: {
            id: projectId,
            name: ownerBView ? 'Owner B Project' : 'Launch Project',
            description: ownerBView ? 'Owner B private work.' : 'A private continuation fixture.',
            created_at: '2026-10-23T12:00:00Z',
            updated_at: '2026-10-24T01:00:00Z',
          }, context: {canon: [], manuscripts: []}};
        } else if (path === `/api/projects/${projectId}/chats`) {
          const ownerBView = authOwnerId === ownerB;
          body = {success: true, conversations: [{
            chatId: ownerBView ? ownerBChat.id : chatId,
            title: ownerBView ? ownerBChat.title : ownerAChat.title,
            createdAt: ownerBView ? ownerBChat.createdAt : ownerAChat.created_at,
            updatedAt: ownerBView ? ownerBChat.updatedAt : ownerAChat.updated_at,
          }]};
        } else if (path === '/api/library/books') {
          body = {success: true, books: []};
        } else if (path === '/api/sync/pull') {
          window.__fixture.pullCalls += 1;
          return new Promise(resolve => { pendingPullResolve = resolve; });
        } else if (path === '/api/sync/push') {
          window.__fixture.pushCalls += 1;
          return Promise.resolve(new Response(JSON.stringify({success: true}), {
            status: 200,
            headers: {'Content-Type': 'application/json'},
          }));
        } else {
          return Promise.resolve(new Response(JSON.stringify({success: false, error: `Unexpected fixture path: ${path}`}), {
            status: 404,
            headers: {'Content-Type': 'application/json'},
          }));
        }
        return Promise.resolve(new Response(JSON.stringify(body), {
          status: 200,
          headers: {'Content-Type': 'application/json'},
        }));
      };

      window.replaceChats = chats => {
        window.__fixture.replaceCalls += 1;
        window.__fixture.actions.push('replace');
        localStorage.setItem(STORAGE_KEYS.CHATS, JSON.stringify(chats));
      };
      window.renderChatsList = () => { window.__fixture.renderListCalls += 1; };
      window.renderMessages = () => { window.__fixture.renderMessageCalls += 1; };
      window.loadChat = id => {
        window.__fixture.loadCalls.push(id);
        window.__fixture.actions.push(`load:${id}`);
        if ((window.chats || []).some(item => String(item.id || item.chat_id || '') === String(id))) {
          window.currentChatId = String(id);
        }
      };
      window.showToast = (message, type) => window.__fixture.toasts.push({message, type});
      window.CrumpAnalytics = {
        track(name, detail) {
          window.__fixture.actions.push('track');
          window.__fixture.events.push({name, detail});
          return Promise.resolve(true);
        },
      };
      window.CrumpVision = {
        registerView(id, view) {
          if (id !== 'projects') throw new Error(`Unexpected fixture view: ${id}`);
          view.render(document.getElementById('fixtureRoot'));
          return true;
        },
        navigate(id) {
          window.__fixture.actions.push(`navigate:${id}`);
          window.__fixture.navigations.push(id);
        },
      };
    })();
  </script>
  <script src="/public/sync-manager.js?v=project-resume-auth-fixture-1"></script>
  <script src="/public/chat-sync.js?v=project-resume-auth-fixture-1"></script>
  <script>
    (() => {
      const synchronize = window.syncChatsFromServer;
      window.syncChatsFromServer = () => {
        window.__fixture.syncCalls += 1;
        return synchronize().then(result => {
          window.__fixture.syncResult = result;
          window.__fixture.syncSettled = true;
          return result;
        });
      };
    })();
  </script>
  <script src="/public/crump-vision-projects-1.0.js?v=project-resume-auth-fixture-1"></script>
</body>
</html>
