<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Ask Crump creation sheet containment fixture</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/public/crump-5.0.css?v=creation-sheet-containment-fixture-1">
  <style>
    body { margin:0; min-height:100vh; background:#090c10; color:#f7f3e9; font:16px/1.5 system-ui,sans-serif; }
    aside, main, nav { display:block; padding:18px; }
    aside, nav { background:#111720; }
    button, textarea { font:inherit; }
    textarea { width:min(600px,90vw); min-height:90px; }
    .input-area, .input-container { display:grid; gap:12px; }
    #toastContainer { position:fixed; right:12px; top:12px; }
  </style>
</head>
<body>
  <aside id="fixtureSidebar">
    <button id="backgroundAction" type="button">Background action</button>
  </aside>
  <main id="fixtureWorkspace">
    <button id="openDocumentStudio" type="button" onclick="window.CrumpDocumentStudio?.open()">Open Document Studio</button>
    <section id="transientDocumentEntry">
      <button id="openDocumentStudioTransient" type="button" onclick="this.parentElement.hidden = true; window.CrumpDocumentStudio?.open()">Open Document Studio from a transient chooser</button>
    </section>
    <div class="input-area">
      <div id="filePreview"></div>
      <div class="input-container">
        <button id="attachBtn" type="button">Attach</button>
        <textarea id="userInput" aria-label="Message Crump"></textarea>
        <button id="sendButton" type="button">Send</button>
      </div>
    </div>
    <input id="fileInput" type="file">
  </main>
  <nav id="fixtureNavigation" aria-label="Fixture navigation">
    <button type="button">Ask</button>
  </nav>
  <div id="toastContainer" aria-live="polite"></div>
  <script>
    window.fetch = async () => new Response('{}', {status:200, headers:{'Content-Type':'application/json'}});
    window.showToast = () => {};
  </script>
  <script src="/public/crump-5.0.js?v=creation-sheet-containment-fixture-1"></script>
</body>
</html>
