<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask Crump file delivery fixture</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/public/crump-5.0.css?v=file-delivery-fixture-1">
  <style>
    .crump53-overlay { position: fixed; inset: 0; z-index: 10000; background: rgba(0,0,0,.45); }
  </style>
</head>
<body class="crump-50">
  <main><button id="fixtureOpener" type="button">Open saved file</button><div id="chatContainer"></div><textarea id="userInput"></textarea></main>
  <div class="crump53-overlay"><section role="dialog" aria-label="Ask Crump Files">Files panel</section></div>
  <script>
    window.__fixture = {downloads: [], openedWindows: 0};
    window.currentChatId = 'fixture-chat';
    window.chats = [{
      id: 'fixture-chat',
      messages: [
        {id: 'message-docx', role: 'assistant', artifact: {
          id: '22222222-2222-4222-8222-222222222222', name: 'Project brief.docx',
          title: 'Project brief', format: 'docx',
          type: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document', size: 4096,
        }},
        {id: 'message-pdf', role: 'assistant', artifact: {
          id: '33333333-3333-4333-8333-333333333333', name: 'Project brief.pdf',
          title: 'Project brief', format: 'pdf', type: 'application/pdf', size: 4096,
        }},
        {id: 'message-pptx', role: 'assistant', artifact: {
          id: '44444444-4444-4444-8444-444444444444', name: 'Project slides.pptx',
          title: 'Project slides', format: 'pptx',
          type: 'application/vnd.openxmlformats-officedocument.presentationml.presentation', size: 4096,
        }},
      ],
    }];
    window.renderMessages = messages => {
      const container = document.getElementById('chatContainer');
      container.replaceChildren();
      for (const message of messages) {
        const row = document.createElement('div');
        row.dataset.messageId = message.id;
        const wrapper = document.createElement('div');
        wrapper.className = 'message-wrapper';
        row.appendChild(wrapper);
        container.appendChild(row);
      }
    };
    window.showToast = () => {};
    window.open = () => { window.__fixture.openedWindows += 1; };
    document.addEventListener('click', event => {
      const link = event.target.closest('a[download]');
      if (!link) return;
      event.preventDefault();
      window.__fixture.downloads.push({
        href: link.getAttribute('href'),
        target: link.getAttribute('target'),
        download: link.getAttribute('download'),
      });
    });
  </script>
  <script src="/public/crump-5.0.js?v=file-delivery-fixture-1"></script>
</body>
</html>
