<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Campaign attribution handoff fixture</title>
</head>
<body>
  <main>
    <h1>Campaign attribution handoff fixture</h1>
    <a id="presentationCta" data-cta="presentation-hero" data-plan="free" href="/app?signup=1&amp;source=presentation-hero&amp;plan=free&amp;intent=presentation">Create a presentation</a>
    <a id="resumeCta" data-cta="resume-hero" data-plan="free" href="/app?signup=1&amp;source=resume-hero&amp;plan=free&amp;intent=resume">Build my résumé</a>
    <a id="resumeSignin" data-cta="resume-nav-signin" data-plan="free" href="/app?source=resume-nav-signin&amp;plan=free&amp;intent=resume">Sign in</a>
    <output id="fixturePresentationHref" aria-label="Presentation destination">pending</output>
    <output id="fixtureResumeHref" aria-label="Resume destination">pending</output>
    <output id="fixtureSigninHref" aria-label="Sign-in destination">pending</output>
    <output id="fixtureEvents" aria-label="Recorded marketing events">pending</output>
    <output id="fixtureStoredSource" aria-label="Stored acquisition source">pending</output>
    <output id="fixtureErrors" aria-label="Browser errors">0</output>
  </main>
  <script>
    window.__fixture = {events: [], errors: []};
    window.va = (command, payload) => window.__fixture.events.push({command, payload});
    window.addEventListener('error', event => {
      window.__fixture.errors.push(String(event.message || 'error'));
      document.getElementById('fixtureErrors').textContent = String(window.__fixture.errors.length);
    });
    document.querySelectorAll('a').forEach(link => link.addEventListener('click', event => event.preventDefault()));
  </script>
  <script src="/public/landing.js?v=campaign-attribution-fixture"></script>
  <script>
    const presentation = document.getElementById('presentationCta');
    const resume = document.getElementById('resumeCta');
    const signin = document.getElementById('resumeSignin');
    [presentation, resume, signin].forEach(link => {
      link.dispatchEvent(new MouseEvent('click', {bubbles: true, cancelable: true}));
    });
    document.getElementById('fixturePresentationHref').textContent = presentation.getAttribute('href');
    document.getElementById('fixtureResumeHref').textContent = resume.getAttribute('href');
    document.getElementById('fixtureSigninHref').textContent = signin.getAttribute('href');
    document.getElementById('fixtureEvents').textContent = JSON.stringify(window.__fixture.events);
    document.getElementById('fixtureStoredSource').textContent = sessionStorage.getItem('askcrump.acquisition-source') || 'none';
  </script>
</body>
</html>
