<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Plan center clarity fixture</title>
  <link rel="stylesheet" href="/public/crump-billing-5.1.css">
</head>
<body style="margin:0;background:#0f1419;color:#f4f1eb;font-family:Arial,sans-serif">
  <main id="billingFixtureBackground">
    <button id="upgradeBtnSidebar" type="button"><span>Plan &amp; credits</span></button>
    <output id="billingFixtureErrors" aria-label="Browser errors">0</output>
    <output id="billingFixtureCheckouts" aria-label="Checkout requests">0</output>
    <output id="billingFixturePortals" aria-label="Portal requests">0</output>
  </main>
  <script>
    window.currentUser = {id: 'fixture-user'};
    const fixtureNeedsBillingRecovery = new URLSearchParams(location.search).get('status') === 'past_due';
    window.CRUMP_CONFIG = {
      webProfessionalPriceLabel: '$20/month',
      webEnterprisePriceLabel: '$50/month',
    };
    window.__planCenterEvents = [];
    window.BillingManager = {
      isNative: () => false,
      getProducts: async () => ({}),
      getCreditProducts: async () => ({}),
      manageSubscription: async () => {
        const output = document.getElementById('billingFixturePortals');
        output.textContent = String(Number(output.textContent || 0) + 1);
      },
    };
    window.showToast = () => {};
    const recordBrowserError = () => {
      const output = document.getElementById('billingFixtureErrors');
      output.textContent = String(Number(output.textContent || 0) + 1);
    };
    window.addEventListener('error', recordBrowserError);
    window.addEventListener('unhandledrejection', recordBrowserError);
    window.fetch = async (url, options = {}) => {
      const pathname = new URL(String(url), window.location.href).pathname;
      if (pathname === '/api/analytics/events') {
        const event = JSON.parse(String(options.body || '{}'));
        window.__planCenterEvents.push(event);
        document.documentElement.dataset.lastPlanEvent = event.eventName;
        document.documentElement.dataset.lastPlanSource = event.source;
        document.documentElement.dataset.lastPlanKey = event.eventKey;
        return new Response(JSON.stringify({success: true, recorded: true}), {
          status: 200,
          headers: {'Content-Type': 'application/json'},
        });
      }
      if (pathname === '/api/stripe/create-checkout-session') {
        const output = document.getElementById('billingFixtureCheckouts');
        output.textContent = String(Number(output.textContent || 0) + 1);
        return new Response(JSON.stringify({success: false, error: 'Fixture blocks checkout.'}), {
          status: 409,
          headers: {'Content-Type': 'application/json'},
        });
      }
      if (pathname === '/api/billing/credits/checkout') {
        const output = document.getElementById('billingFixtureCheckouts');
        output.textContent = String(Number(output.textContent || 0) + 1);
        return new Response(JSON.stringify({success: false, error: 'Fixture blocks credit checkout.'}), {
          status: 409,
          headers: {'Content-Type': 'application/json'},
        });
      }
      if (pathname === '/api/stripe/customer-portal') {
        const output = document.getElementById('billingFixturePortals');
        output.textContent = String(Number(output.textContent || 0) + 1);
        return new Response(JSON.stringify({success: false, error: 'Fixture recorded portal.'}), {
          status: 409,
          headers: {'Content-Type': 'application/json'},
        });
      }
      const responses = {
        '/api/billing/credits/status': {
          credits: {balance: 12},
          catalog: [
            {code: 'credits_50', credits: 50, price: '$4.99', available: true},
            {code: 'credits_150', credits: 150, price: '$9.99', available: true},
            {code: 'credits_400', credits: 400, price: '$19.99', available: true},
          ],
          history: [],
        },
        '/api/usage/check': {daily: {limit: 25, used: 3, remaining: 22}},
        '/api/billing/status': fixtureNeedsBillingRecovery
          ? {tier: 'free', status: 'past_due', provider: 'stripe', manageable: true}
          : {tier: 'free', status: 'inactive', provider: null, manageable: false},
      };
      return new Response(JSON.stringify(responses[pathname] || {}), {
        status: 200,
        headers: {'Content-Type': 'application/json'},
      });
    };
  </script>
  <script src="/public/crump-billing-5.1.js?v=billing-modal-containment-fixture-1"></script>
  <script src="/public/crump-5.2.js?v=billing-modal-containment-fixture-1"></script>
  <script src="/public/crump-5.2.2.js?v=credit-pack-accessibility-fixture-1"></script>
  <script src="/public/crump-subscriptions-5.3.2.js?v=commerce-recovery-fixture-1"></script>
</body>
</html>
