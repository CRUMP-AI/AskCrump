<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>Crump AI - N² Engine</title>
    
    <!-- Styles -->
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="/new-features.css">
    
    <!-- PWA -->
    <link rel="icon" type="image/png" href="/assets/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a1628">
    
    <!-- Syntax Highlighting - Prism.js -->
    <link href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.css" rel="stylesheet" />
    
    <!-- Math Rendering - KaTeX -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    
    <!-- PDF.js -->
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
    <script>
        // Configure PDF.js worker
        if (typeof pdfjsLib !== 'undefined') {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
        }
    </script>
</head>
<body>
    <!-- ============================================ -->
    <!-- MAIN APP CONTAINER -->
    <!-- ============================================ -->
    <div class="app-container">
        
        <!-- ============================================ -->
        <!-- SIDEBAR (Chat List) -->
        <!-- ============================================ -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h2>💬 Chats</h2>
                <button class="icon-btn" id="newChatBtn" title="New Chat">
                    ➕
                </button>
            </div>
            
            <div class="chats-list" id="chatsList">
                <!-- Chat list items will be rendered here by JavaScript -->
            </div>
            
            <div class="sidebar-footer">
                <button class="icon-btn" id="settingsBtn" title="Settings">
                    ⚙️
                </button>
                <button class="icon-btn" id="usageStatsBtn" title="Usage Stats" onclick="window.showUsageStats()">
                    📊
                </button>
            </div>
        </aside>
        
        <!-- ============================================ -->
        <!-- MAIN CHAT AREA -->
        <!-- ============================================ -->
        <main class="main-content">
            
            <!-- Header -->
            <header class="header">
                <div class="header-left">
                    <button class="icon-btn mobile-menu-btn" id="toggleSidebarBtn">
                        ☰
                    </button>
                    <h1 class="app-title">Crump AI</h1>
                    <span class="version-badge">v2.12.1</span>
                    <!-- Tier badge will be added here by JavaScript -->
                </div>
                
                <div class="header-right">
                    <button class="icon-btn" id="searchWebBtn" title="Enable Web Search">
                        🔍
                    </button>
                    <button class="icon-btn" id="voiceBtn" title="Voice Input">
                        🎤
                    </button>
                </div>
            </header>
            
            <!-- Chat Container (Messages Display) -->
            <div class="chat-container" id="chatContainer">
                <!-- Messages will be rendered here by JavaScript -->
                <div class="welcome-message">
                    <h2>👋 Welcome to Crump AI</h2>
                    <p>Powered by the N² Engine</p>
                    <p class="welcome-subtext">Start a conversation to see the magic happen!</p>
                </div>
            </div>
            
            <!-- Input Area -->
            <div class="input-container">
                <!-- File Preview (appears when files uploaded) -->
                <div id="filePreview" class="file-preview-container"></div>
                
                <!-- Main Input Box -->
                <div class="input-wrapper">
                    <button class="icon-btn" id="attachBtn" title="Attach File">
                        📎
                    </button>
                    <input type="file" id="fileInput" style="display: none;" accept="image/*,application/pdf,.txt,.doc,.docx" multiple>
                    
                    <textarea 
                        id="userInput" 
                        placeholder="Type your message... (Shift+Enter for new line)"
                        rows="1"
                    ></textarea>
                    
                    <button class="icon-btn primary" id="sendButton" title="Send Message">
                        ➤
                    </button>
                </div>
                
                <!-- Quick Actions -->
                <div class="quick-actions">
                    <span class="quick-action-hint">Quick actions:</span>
                    <button class="quick-action-btn" onclick="document.getElementById('userInput').value='Generate an image of '; document.getElementById('userInput').focus();">
                        🎨 Generate Image
                    </button>
                    <button class="quick-action-btn" onclick="document.getElementById('userInput').value='Search for '; document.getElementById('userInput').focus();">
                        🔍 Web Search
                    </button>
                    <button class="quick-action-btn" onclick="document.getElementById('userInput').value='Help me code '; document.getElementById('userInput').focus();">
                        💻 Code Help
                    </button>
                </div>
            </div>
        </main>
    </div>
    
    <!-- ============================================ -->
    <!-- SCRIPTS - Load in this specific order -->
    <!-- ============================================ -->
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-python.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-jsx.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-sql.min.js"></script>
    
    <!-- KaTeX for math -->
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    
    <!-- Core Crump Modules (load in order) -->
    <script src="/engines.js"></script>
    <script src="/profile-manager.js"></script>
    <script src="/image-generation.js"></script>
    <script src="/ui-functions.js"></script>
    <script src="/upgrade-ui.js"></script>
    <script src="/app.js"></script>
    
    <!-- Additional UI Helper Script -->
    <script>
        // Render chats list
        window.renderChatsList = function() {
            const container = document.getElementById('chatsList');
            if (!container || !window.chats) return;
            
            container.innerHTML = window.chats.map(chat => `
                <div class="chat-item ${chat.id === window.currentChatId ? 'active' : ''}" 
                     onclick="window.loadChat ? window.loadChat('${chat.id}') : null">
                    <div class="chat-title">${chat.title || 'New Chat'}</div>
                    <div class="chat-time">${new Date(chat.updated).toLocaleDateString()}</div>
                </div>
            `).join('');
        };
        
        // Toggle sidebar on mobile
        document.addEventListener('DOMContentLoaded', () => {
            const toggleBtn = document.getElementById('toggleSidebarBtn');
            const sidebar = document.getElementById('sidebar');
            
            if (toggleBtn && sidebar) {
                toggleBtn.addEventListener('click', () => {
                    sidebar.classList.toggle('open');
                });
            }
            
            // Attach button functionality
            const attachBtn = document.getElementById('attachBtn');
            const fileInput = document.getElementById('fileInput');
            
            if (attachBtn && fileInput) {
                attachBtn.addEventListener('click', () => {
                    fileInput.click();
                });
            }
            
            // Auto-resize textarea
            const textarea = document.getElementById('userInput');
            if (textarea) {
                textarea.addEventListener('input', function() {
                    this.style.height = 'auto';
                    this.style.height = Math.min(this.scrollHeight, 200) + 'px';
                });
            }
        });
    </script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('✅ Service Worker registered'))
                    .catch(err => console.log('⚠️ SW registration failed (expected in dev):', err));
            });
        }
    </script>
</body>
</html>
