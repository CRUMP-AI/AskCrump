<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crump AI - N² Engine</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/png" href="/assets/icon-192.png">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0a1628">
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen" class="splash-screen">
        <div class="splash-content">
            <div class="splash-icon">👑</div>
            <div class="splash-title">Crump AI</div>
            <div class="splash-subtitle">N² Engine</div>
            <div class="splash-loader"></div>
        </div>
    </div>

    <!-- Tutorial Overlay -->
    <div id="tutorial-overlay" class="tutorial-overlay">
        <div class="tutorial-modal">
            <div class="tutorial-progress">
                <div class="tutorial-progress-bar" id="tutorialProgressBar"></div>
            </div>
            <div class="tutorial-body" id="tutorialBody"></div>
            <div class="tutorial-footer">
                <span id="tutorialStep" class="tutorial-step-indicator"></span>
                <div class="tutorial-actions">
                    <button onclick="skipTutorial()" class="tutorial-btn secondary">Skip</button>
                    <button onclick="nextTutorialStep()" class="tutorial-btn primary">Next</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Sidebar -->
    <div id="sidebar" class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">👑</span>
                <span class="logo-text">Crump · N² Engine</span>
            </div>
            <button class="icon-btn" onclick="createNewChat()" title="New Chat">
                <span style="font-size: 18px;">✨</span>
            </button>
        </div>

        <div class="search-bar">
            <input type="text" placeholder="Search chats..." oninput="filterChats(this.value)" />
        </div>

        <div id="chatsList" class="chats-list"></div>

        <div class="sidebar-footer">
            <button class="sidebar-footer-btn" onclick="toggleSettings()">
                <span>⚙️</span> Settings
            </button>
            <button class="sidebar-footer-btn" onclick="exportAllData()">
                <span>💾</span> Export Data
            </button>
        </div>
    </div>

    <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Header -->
        <div class="header">
            <button class="icon-btn mobile-only" onclick="toggleSidebar()">☰</button>
            <div class="logo-text">👑 Crump <span style="font-size: 14px; color: #b8941f;">· N² Engine</span></div>
            
            <!-- Context Cards Container -->
            <div class="context-cards-container">
                <div id="contextCards" class="context-cards"></div>
                
                <!-- Premium Context Dropdown -->
                <div id="contextDropdown" class="context-dropdown">
                    <input type="text" id="contextPickerInput" placeholder="Add context..." class="context-input" />
                    <div id="contextDropdownMenu" class="context-dropdown-menu">
                        <div class="context-dropdown-section">
                            <div class="context-dropdown-label">QUICK ADD</div>
                            <button onclick="addContextFromSuggestion('🔧 Debugging')">🔧 Debugging</button>
                            <button onclick="addContextFromSuggestion('📊 Data Analysis')">📊 Data Analysis</button>
                            <button onclick="addContextFromSuggestion('🎨 Design')">🎨 Design</button>
                            <button onclick="addContextFromSuggestion('✍️ Writing')">✍️ Writing</button>
                            <button onclick="addContextFromSuggestion('🚀 Deployment')">🚀 Deployment</button>
                            <button onclick="addContextFromSuggestion('🧪 Testing')">🧪 Testing</button>
                            <button onclick="addContextFromSuggestion('📖 Research')">📖 Research</button>
                            <button onclick="addContextFromSuggestion('📋 Planning')">📋 Planning</button>
                        </div>
                    </div>
                </div>
            </div>

            <button class="icon-btn" onclick="toggleSettings()">⚙️</button>
        </div>

        <!-- Continue Context Banner -->
        <div id="continueContextBanner" class="continue-context-banner" style="display: none;"></div>

        <!-- Chat Container -->
        <di
