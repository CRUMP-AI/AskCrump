<!-- ==========================================
CRUMP AI - AUTHENTICATION UI
Login, Signup, and Email Verification
========================================== -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crump AI - Sign In</title>
    <link rel="stylesheet" href="/styles.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--color-bg-primary);
            padding: 2rem;
        }

        .auth-card {
            background: var(--color-bg-secondary);
            border-radius: 16px;
            padding: 3rem;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .auth-logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .auth-logo img {
            width: 64px;
            height: 64px;
            margin-bottom: 1rem;
        }

        .auth-logo h1 {
            font-size: 2rem;
            color: var(--color-text-primary);
            margin: 0 0 0.5rem 0;
        }

        .auth-logo p {
            color: var(--color-text-secondary);
            margin: 0;
        }

        .auth-screen {
            display: none;
        }

        .auth-screen.active {
            display: block;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--color-text-primary);
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: 0.875rem;
            background: var(--color-bg-tertiary);
            border: 1px solid var(--color-border);
            border-radius: 8px;
            color: var(--color-text-primary);
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--color-accent-primary);
            box-shadow: 0 0 0 3px rgba(201, 184, 146, 0.1);
        }

        .btn-auth {
            width: 100%;
            padding: 0.875rem;
            background: var(--color-accent-primary);
            color: var(--color-bg-primary);
            border: none;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-auth:hover {
            background: var(--color-accent-hover);
        }

        .btn-auth:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .auth-link {
            text-align: center;
            margin-top: 1.5rem;
            color: var(--color-text-secondary);
        }

        .auth-link a {
            color: var(--color-accent-primary);
            text-decoration: none;
            font-weight: 500;
        }

        .auth-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            padding: 0.875rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
            padding: 0.875rem;
            border-radius: 8px;
            margin-bottom: 1.5rem;
            font-size: 0.875rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            color: var(--color-text-secondary);
        }

        .checkbox-label input {
            cursor: pointer;
        }

        .verification-code-input {
            text-align: center;
            font-size: 2rem;
            letter-spacing: 0.5rem;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .auth-card {
                padding: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="/assets/logo-c.png" alt="Crump">
                <h1>Crump AI</h1>
                <p>Your Personal AI Assistant</p>
            </div>

            <!-- LOGIN SCREEN -->
            <div id="loginScreen" class="auth-screen active">
                <div id="loginError" class="error-message" style="display: none;"></div>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input 
                            type="email" 
                            id="loginEmail" 
                            class="form-input" 
                            placeholder="your@email.com" 
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <input 
                            type="password" 
                            id="loginPassword" 
                            class="form-input" 
                            placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" 
                            required
                            autocomplete="current-password"
                        >
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            <span>Remember me for 30 days</span>
                        </label>
                    </div>

                    <button type="submit" class="btn-auth" id="loginBtn">
                        Sign In
                    </button>
                </form>

                <div class="auth-link">
                    Don't have an account? <a href="#" onclick="showScreen('signup')">Sign up</a>
                </div>
            </div>

            <!-- SIGNUP SCREEN -->
            <div id="signupScreen" class="auth-screen">
                <div id="signupError" class="error-message" style="display: none;"></div>
                
                <form id="signupForm">
                    <div class="form-group">
                        <label for="signupName">Name</label>
                        <input 
                            type="text" 
                            id="signupName" 
                            class="form-input" 
                            placeholder="John Doe" 
                            required
                            autocomplete="name"
                        >
                    </div>

                    <div class="form-group">
                        <label for="signupEmail">Email</label>
                        <input 
                            type="email" 
                            id="signupEmail" 
                            class="form-input" 
                            placeholder="your@email.com" 
                            required
                            autocomplete="email"
                        >
                    </div>

                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <input 
                            type="password" 
                            id="signupPassword" 
                            class="form-input" 
                            placeholder="â€¢â€¢â€¢â€¢â€¢â€¢â€¢â€¢" 
                            required
                            autocomplete="new-password"
                            minlength="8"
                        >
                        <small style="color: var(--color-text-tertiary); font-size: 0.875rem; display: block; margin-top: 0.5rem;">
                            Must be at least 8 characters
                        </small>
                    </div>

                    <button type="submit" class="btn-auth" id="signupBtn">
                        Create Account
                    </button>
                </form>

                <div class="auth-link">
                    Already have an account? <a href="#" onclick="showScreen('login')">Sign in</a>
                </div>
            </div>

            <!-- EMAIL VERIFICATION SCREEN -->
            <div id="verifyScreen" class="auth-screen">
                <div id="verifyError" class="error-message" style="display: none;"></div>
                <div id="verifySuccess" class="success-message" style="display: none;"></div>
                
                <p style="text-align: center; color: var(--color-text-secondary); margin-bottom: 2rem;">
                    We sent a 6-digit code to<br>
                    <strong id="verifyEmail" style="color: var(--color-text-primary);"></strong>
                </p>

                <form id="verifyForm">
                    <div class="form-group">
                        <label for="verifyCode">Verification Code</label>
                        <input 
                            type="text" 
                            id="verifyCode" 
                            class="form-input verification-code-input" 
                            placeholder="000000" 
                            required
                            maxlength="6"
                            pattern="[0-9]{6}"
                        >
                    </div>

                    <button type="submit" class="btn-auth" id="verifyBtn">
                        Verify Email
                    </button>
                </form>

                <div class="auth-link">
                    <a href="#" onclick="showScreen('login')">Back to login</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/auth.js"></script>
    <script>
        let currentEmail = '';

        // Show screen
        function showScreen(screen) {
            document.querySelectorAll('.auth-screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screen + 'Screen').classList.add('active');
            
            // Clear errors
            document.querySelectorAll('.error-message, .success-message').forEach(el => {
                el.style.display = 'none';
            });
        }

        // Show error
        function showError(screen, message) {
            const errorEl = document.getElementById(screen + 'Error');
            errorEl.textContent = message;
            errorEl.style.display = 'block';
        }

        // Show success
        function showSuccess(screen, message) {
            const successEl = document.getElementById(screen + 'Success');
            successEl.textContent = message;
            successEl.style.display = 'block';
        }

        // Login form
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('loginBtn');
            btn.disabled = true;
            btn.textContent = 'Signing in...';

            try {
                const email = document.getElementById('loginEmail').value;
                const password = document.getElementById('loginPassword').value;
                const rememberMe = document.getElementById('rememberMe').checked;

                await window.authManager.login(email, password, rememberMe);
                
                // Redirect to app
                window.location.href = '/';

            } catch (error) {
                showError('login', error.message);
                btn.disabled = false;
                btn.textContent = 'Sign In';
            }
        });

        // Signup form
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('signupBtn');
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                const name = document.getElementById('signupName').value;
                const email = document.getElementById('signupEmail').value;
                const password = document.getElementById('signupPassword').value;

                const result = await window.authManager.signup(email, password, name);
                
                // Show verification screen
                currentEmail = email;
                document.getElementById('verifyEmail').textContent = email;
                showScreen('verify');

                if (result.devMode) {
                    showSuccess('verify', `Dev Mode: Your code is ${result.devCode}`);
                }

            } catch (error) {
                showError('signup', error.message);
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        });

        // Verify form
        document.getElementById('verifyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('verifyBtn');
            btn.disabled = true;
            btn.textContent = 'Verifying...';

            try {
                const code = document.getElementById('verifyCode').value;
                
                await window.authManager.verifyEmail(currentEmail, code);
                
                // Redirect to app
                window.location.href = '/';

            } catch (error) {
                showError('verify', error.message);
                btn.disabled = false;
                btn.textContent = 'Verify Email';
            }
        });

        // Auto-format verification code
        document.getElementById('verifyCode').addEventListener('input', (e) => {
            e.target.value = e.target.value.replace(/[^0-9]/g, '');
        });
    </script>
</body>
</html>
