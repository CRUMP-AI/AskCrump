<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ask Crump — v2 Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070a0e;
  --bg-2: #0a0d12;
  --surface: #10141a;
  --surface-2: #141a21;
  --line: rgba(255,255,255,.075);
  --line-soft: rgba(255,255,255,.045);
  --line-gold: rgba(213,185,113,.23);
  --gold: #d5b971;
  --gold-2: #b69855;
  --gold-3: #806438;
  --gold-pale: #f0e2bd;
  --ink: #f1efe9;
  --ink-2: #c9c6bf;
  --muted: #8a9196;
  --faint: #5b6166;
  --display: Georgia, "Times New Roman", serif;
  --body: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Monaco, Consolas, monospace;
  --ease: cubic-bezier(.2,.78,.2,1);
  --r-lg: 20px; --r-md: 14px; --r-sm: 10px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: #04060a; color: var(--ink);
  font-family: var(--body); -webkit-font-smoothing: antialiased;
  display: grid; place-items: center; min-height: 100dvh; padding: 18px;
}
button { font: inherit; color: inherit; }
img { -webkit-user-drag: none; }

/* ================= stage / device ================= */
.stage {
  width: min(1280px, 100%); height: min(900px, calc(100dvh - 36px));
  background:
    radial-gradient(1000px 560px at 74% -26%, rgba(213,185,113,.05), transparent 68%),
    var(--bg);
  border: 1px solid rgba(255,255,255,.07); border-radius: 22px;
  display: flex; overflow: hidden; position: relative;
  box-shadow: 0 60px 140px rgba(0,0,0,.55);
  transition: width .4s var(--ease), height .4s var(--ease), border-radius .4s var(--ease);
}
.stage.phone { width: 392px; height: min(852px, calc(100dvh - 36px)); border-radius: 52px; }
.stage.phone .sidebar { display: none; }
.stage.phone .tabbar { display: flex; }
.stage.phone .fab-create { display: grid; }
.stage.phone .statusbar { display: flex; }
.stage.phone .main { padding: 0; }

/* floating demo controls */
.demo-bar {
  position: fixed; right: 18px; bottom: 18px; z-index: 200;
  display: flex; gap: 8px; align-items: center;
  background: rgba(16,20,26,.92); border: 1px solid var(--line);
  border-radius: 999px; padding: 6px; backdrop-filter: blur(12px);
}
.demo-bar .lbl { font-size: 10px; letter-spacing: .14em; color: var(--faint); padding: 0 6px 0 10px; font-weight: 700; }
.dctl {
  border: 1px solid var(--line); background: transparent; color: var(--muted);
  font-size: 11.5px; font-weight: 600; padding: 7px 13px; border-radius: 999px; cursor: pointer;
  transition: border-color .15s, color .15s;
}
.dctl:hover { border-color: var(--line-gold); color: var(--ink); }
.dctl.on { border-color: var(--line-gold); color: var(--gold); }

/* ================= sidebar ================= */
.sidebar {
  width: 264px; flex: 0 0 auto; display: flex; flex-direction: column;
  border-right: 1px solid var(--line-soft); background: rgba(255,255,255,.008);
  padding: 20px 14px 16px;
}
.brand-lockup { height: 46px; border-radius: 10px; overflow: hidden; margin: 2px 6px 18px; border: 1px solid rgba(213,185,113,.16); }
.brand-lockup img { width: 100%; height: 100%; object-fit: contain; display: block; }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-label { font-size: 9.5px; font-weight: 700; letter-spacing: .18em; color: var(--faint); text-transform: uppercase; padding: 14px 12px 6px; }
.nav-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  border: 0; background: transparent; color: var(--ink-2); text-align: left;
  font-size: 13.5px; font-weight: 500; padding: 10px 12px; border-radius: 12px; cursor: pointer;
  transition: background .14s, color .14s;
}
.nav-item svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; flex: 0 0 auto; opacity: .85; }
.nav-item:hover { background: rgba(255,255,255,.035); color: var(--ink); }
.nav-item.active { background: rgba(213,185,113,.09); color: var(--gold-pale); }
.nav-item.active svg { opacity: 1; }
.nav-item .tag {
  margin-left: auto; font-size: 9px; font-weight: 800; letter-spacing: .1em;
  color: #0a0d12; background: linear-gradient(180deg,#e2cd97,#bd9f62);
  padding: 3px 8px; border-radius: 999px;
}
.side-foot { margin-top: auto; }
.user-card {
  display: flex; align-items: center; gap: 11px; width: 100%;
  border: 1px solid var(--line-soft); background: rgba(255,255,255,.018);
  border-radius: 14px; padding: 10px 12px; cursor: pointer; text-align: left;
  transition: border-color .15s;
}
.user-card:hover { border-color: var(--line-gold); }
.avatar {
  width: 36px; height: 36px; border-radius: 50%; flex: 0 0 auto;
  background: linear-gradient(140deg,#3a3324,#241f14); border: 1px solid rgba(213,185,113,.35);
  display: grid; place-items: center; font-family: var(--display); font-size: 16px; color: var(--gold-pale);
}
.user-card strong { display: block; font-size: 13px; font-weight: 600; }
.user-card small { display: block; font-size: 11px; color: var(--muted); margin-top: 2px; }
.upgrade-btn {
  width: 100%; margin-top: 10px; border: 1px solid rgba(213,185,113,.45);
  background: rgba(213,185,113,.08); color: var(--gold-pale);
  font-size: 12.5px; font-weight: 700; padding: 11px; border-radius: 13px; cursor: pointer;
  transition: background .15s;
}
.upgrade-btn:hover { background: rgba(213,185,113,.15); }

/* ================= main ================= */
.main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; position: relative; }
.statusbar { display: none; align-items: center; justify-content: space-between; padding: 20px 28px 6px; font-size: 13px; font-weight: 600; color: var(--ink); flex: 0 0 auto; }
.statusbar .sic { display: flex; gap: 6px; align-items: center; color: var(--ink-2); }
.viewport { flex: 1 1 auto; position: relative; overflow: hidden; display: flex; flex-direction: column; }
.view { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; opacity: 0; pointer-events: none; transition: opacity .22s ease; }
.view.active { opacity: 1; pointer-events: auto; }

/* bottom tab bar (phone) */
.tabbar {
  display: none; flex: 0 0 auto; align-items: stretch; justify-content: space-around;
  border-top: 1px solid var(--line-soft); background: rgba(10,13,18,.96);
  padding: 8px 6px calc(10px + env(safe-area-inset-bottom));
}
.tab {
  border: 0; background: none; color: var(--faint); display: flex; flex-direction: column;
  align-items: center; gap: 4px; font-size: 9.5px; font-weight: 600; letter-spacing: .04em;
  padding: 6px 10px; cursor: pointer; border-radius: 10px; min-width: 60px;
}
.tab svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.tab.active { color: var(--gold); }
.fab-create {
  display: none; position: absolute; right: 18px; bottom: 92px; z-index: 60;
  width: 54px; height: 54px; border-radius: 50%; place-items: center; cursor: pointer;
  border: 1px solid rgba(213,185,113,.5); color: #0a0d12;
  background: linear-gradient(180deg,#e6d09c,#c2a468);
  box-shadow: 0 10px 28px rgba(0,0,0,.45);
}
.fab-create svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }

/* ================= shared type ================= */
.eyebrow { color: var(--gold); font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; margin-bottom: 12px; }
h1.serif, h2.serif { font-family: var(--display); font-weight: 400; letter-spacing: -.03em; color: #f4f0e8; margin: 0; }
.page { flex: 1 1 auto; overflow-y: auto; padding: 46px 30px 70px; }
.page-inner { width: min(920px, 100%); margin: 0 auto; }
.page h1.serif { font-size: clamp(32px, 4vw, 46px); margin-bottom: 8px; }
.page .sub { color: var(--muted); font-size: 13.5px; line-height: 1.65; margin: 0 0 28px; max-width: 600px; }
.section-label { color: var(--gold-2); font-size: 10px; font-weight: 750; letter-spacing: .15em; text-transform: uppercase; margin: 30px 0 12px; display: flex; align-items: center; gap: 10px; }
.section-label .more { margin-left: auto; font-size: 11px; letter-spacing: .02em; text-transform: none; color: var(--muted); font-weight: 600; background: none; border: 0; cursor: pointer; }
.section-label .more:hover { color: var(--gold); }

/* buttons */
.btn-gold {
  border: 1px solid rgba(213,185,113,.5); background: rgba(213,185,113,.1); color: var(--gold-pale);
  font-size: 12.5px; font-weight: 700; padding: 10px 16px; border-radius: 11px; cursor: pointer;
  transition: background .15s, transform .1s;
}
.btn-gold:hover { background: rgba(213,185,113,.18); }
.btn-gold:active { transform: scale(.97); }
.btn-solid {
  border: 1px solid rgba(213,185,113,.55); color: #0a0d12;
  background: linear-gradient(180deg,#e6d09c,#c0a265);
  font-size: 13px; font-weight: 800; padding: 12px 20px; border-radius: 13px; cursor: pointer;
  transition: filter .15s, transform .1s;
}
.btn-solid:hover { filter: brightness(1.06); }
.btn-solid:active { transform: scale(.98); }
.btn-ghost {
  border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  font-size: 12.5px; font-weight: 600; padding: 10px 15px; border-radius: 11px; cursor: pointer;
  transition: border-color .15s, color .15s;
}
.btn-ghost:hover { border-color: var(--line-gold); color: var(--ink); }
.btn-quiet { border: 0; background: none; color: var(--muted); font-size: 12.5px; font-weight: 600; cursor: pointer; padding: 8px 10px; border-radius: 9px; }
.btn-quiet:hover { color: var(--ink); background: rgba(255,255,255,.04); }

/* toast */
.toast {
  position: absolute; left: 50%; bottom: 30px; transform: translateX(-50%) translateY(8px);
  background: #171d25; border: 1px solid var(--line-gold); color: var(--gold-pale);
  font-size: 12.5px; padding: 11px 18px; border-radius: 999px; opacity: 0; pointer-events: none;
  transition: opacity .2s ease, transform .2s ease; white-space: nowrap; z-index: 300;
  max-width: 90%; overflow: hidden; text-overflow: ellipsis;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* empty state — a showcase */
.empty {
  display: flex; flex-direction: column; align-items: center; text-align: center;
  padding: 56px 24px; border: 1px dashed rgba(213,185,113,.22); border-radius: var(--r-lg);
  background: rgba(213,185,113,.02);
}
.empty img { width: 92px; height: 92px; border-radius: 26px; object-fit: cover; display: block; margin-bottom: 20px; border: 1px solid rgba(213,185,113,.2); }
.empty h3 { font-family: var(--display); font-weight: 400; font-size: 24px; letter-spacing: -.02em; margin: 0 0 8px; color: #f2eee6; }
.empty p { color: var(--muted); font-size: 13px; line-height: 1.65; max-width: 380px; margin: 0 0 20px; }
.empty .sugs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

/* modal / sheet */
.scrim {
  position: absolute; inset: 0; background: rgba(3,5,8,.62); backdrop-filter: blur(3px);
  display: grid; place-items: center; padding: 22px; z-index: 120; opacity: 0; pointer-events: none; transition: opacity .2s;
}
.scrim.show { opacity: 1; pointer-events: auto; }
.modal {
  width: min(520px, 100%); max-height: 86%; overflow-y: auto;
  background: #10151c; border: 1px solid var(--line-gold); border-radius: 22px; padding: 28px;
  transform: translateY(10px); transition: transform .22s var(--ease);
}
.scrim.show .modal { transform: none; }
.modal h2.serif { font-size: 26px; margin-bottom: 6px; }
.modal .msub { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0 0 20px; }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 7px; }
.field input, .field textarea, .field select {
  width: 100%; background: rgba(255,255,255,.035); border: 1px solid var(--line);
  border-radius: 12px; color: var(--ink); font: inherit; font-size: 14px; padding: 12px 14px; outline: none;
  transition: border-color .15s;
}
.field input:focus, .field textarea:focus { border-color: rgba(213,185,113,.4); }
.field textarea { resize: vertical; min-height: 90px; }
.modal-actions { display: flex; gap: 10px; margin-top: 22px; }
.modal-actions .btn-solid, .modal-actions .btn-ghost { flex: 1; }

/* toggle switch */
.switch { position: relative; width: 46px; height: 27px; flex: 0 0 auto; cursor: pointer; }
.switch input { opacity: 0; width: 0; height: 0; }
.switch .tk { position: absolute; inset: 0; border-radius: 999px; background: rgba(255,255,255,.1); border: 1px solid var(--line); transition: background .18s, border-color .18s; }
.switch .tk::after { content: ""; position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; border-radius: 50%; background: #c9c6bf; transition: transform .18s var(--ease), background .18s; }
.switch input:checked + .tk { background: rgba(213,185,113,.32); border-color: rgba(213,185,113,.55); }
.switch input:checked + .tk::after { transform: translateX(19px); background: #e9d6a4; }

/* ================= code studio ================= */
.studio-banner {
  display: flex; align-items: center; gap: 12px;
  border: 1px solid var(--line-gold); background: rgba(213,185,113,.055);
  border-radius: 14px; padding: 12px 16px; margin-bottom: 20px;
  font-size: 13px; color: var(--gold-pale);
}
.studio-banner img { width: 30px; height: 30px; border-radius: 9px; object-fit: cover; display: block; }
.code-tabs { display: none; gap: 6px; margin-bottom: 14px; background: rgba(255,255,255,.03); border: 1px solid var(--line); border-radius: 13px; padding: 4px; }
.code-tabs button { flex: 1; border: 0; background: none; color: var(--muted); font-size: 12px; font-weight: 700; padding: 9px 4px; border-radius: 9px; cursor: pointer; }
.code-tabs button.on { background: rgba(213,185,113,.12); color: var(--gold-pale); }
.stage.phone .code-tabs { display: flex; }
.code-cols { display: grid; grid-template-columns: 208px minmax(0,1.18fr) minmax(0,1fr); gap: 14px; align-items: start; }
.stage.phone .code-cols { display: block; }
.stage.phone .code-pane { display: none; }
.stage.phone .code-pane.on { display: block; }
.code-pane {
  border: 1px solid var(--line); border-radius: var(--r-lg); min-width: 0;
  background: linear-gradient(180deg, rgba(255,255,255,.022), rgba(255,255,255,.01));
  padding: 18px;
}
.code-pane-h { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 14px; }
.code-pane-h strong { font-size: 14px; font-weight: 700; }
.code-pane-h small { color: var(--faint); font-size: 11px; }
.file-row {
  display: flex; align-items: center; gap: 11px; width: 100%;
  border: 1px solid transparent; background: none; text-align: left;
  padding: 9px 10px; border-radius: 11px; cursor: pointer; margin-bottom: 2px;
  transition: background .14s, border-color .14s;
}
.file-row:hover { background: rgba(255,255,255,.035); }
.file-row.on { background: rgba(213,185,113,.09); border-color: rgba(213,185,113,.25); }
.fext {
  width: 40px; height: 30px; flex: 0 0 auto; display: grid; place-items: center;
  font-size: 9px; font-weight: 800; letter-spacing: .06em; color: var(--gold);
  border: 1px solid rgba(213,185,113,.28); border-radius: 8px; background: rgba(213,185,113,.06);
}
.file-row .fn { min-width: 0; }
.file-row .fn strong { display: block; font-size: 12.5px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.file-row .fn small { display: block; font-size: 10.5px; color: var(--faint); margin-top: 2px; }
.code-shell { border: 1px solid var(--line-soft); border-radius: 13px; background: #0a0d12; padding: 16px; overflow-x: auto; }
.codeview { font-family: var(--mono); font-size: 12.5px; line-height: 1.72; color: #d8d3c8; white-space: pre; margin: 0; }
.codeview .tg { color: #d5b971; }
.codeview .at { color: #9ec49a; }
.codeview .st { color: #9ec49a; }
.codeview .kw { color: #d5b971; }
.codeview .cm { color: #5f6a75; font-style: italic; }
.sug-label { font-size: 10px; font-weight: 750; letter-spacing: .15em; text-transform: uppercase; color: var(--gold-2); margin: 20px 0 10px; }
.code-note { font-size: 12px; color: var(--muted); margin: 10px 2px 0; line-height: 1.6; }
.preview-frame { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #fff; height: 380px; }
.stage.phone .preview-frame { height: 330px; }
.preview-frame iframe { width: 100%; height: 100%; border: 0; display: block; }
.think-inline { display: flex; align-items: center; gap: 12px; padding: 16px 4px; }
.think-inline img { width: 32px; height: 32px; border-radius: 10px; object-fit: cover; display: block; }
.think-inline small { color: var(--muted); font-size: 12.5px; }
.diff { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-top: 14px; background: #0a0d12; }
.diff-head { padding: 14px 16px 10px; border-bottom: 1px solid var(--line-soft); }
.diff-head .df { font-size: 11px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--gold-2); margin-bottom: 6px; }
.diff-head p { margin: 0; font-size: 13.5px; color: var(--ink); line-height: 1.6; }
.dl { font-family: var(--mono); font-size: 12px; line-height: 1.6; padding: 7px 14px; white-space: pre-wrap; word-break: break-word; }
.dl-ctx { color: var(--muted); }
.dl-del { background: rgba(214,96,96,.09); color: #e8a6a6; }
.dl-add { background: rgba(120,196,130,.09); color: #a9d8ae; }
.diff-actions { display: flex; gap: 10px; padding: 14px 16px; }
.diff-actions .btn-solid, .diff-actions .btn-ghost { flex: 1; }
.ckpt { display: flex; align-items: center; gap: 10px; border: 1px solid var(--line-soft); border-radius: 12px; padding: 10px 12px; margin-bottom: 8px; background: rgba(255,255,255,.012); }
.ckpt.cur { border-color: var(--line-gold); }
.ckpt .cdot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex: 0 0 auto; opacity: .7; }
.ckpt.cur .cdot { opacity: 1; }
.ckpt .cn { min-width: 0; flex: 1; }
.ckpt .cn strong { display: block; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ckpt .cn small { display: block; font-size: 10.5px; color: var(--faint); margin-top: 2px; }
.ckpt .btn-quiet { font-size: 11.5px; padding: 6px 8px; flex: 0 0 auto; }
.idea-sub { max-width: 560px; }
</style>
<style>
/* ================= onboarding ================= */

.ob-lockup { width: min(420px, 86%); aspect-ratio: 2.6/1; border-radius: 14px; overflow: hidden; margin: 0 auto 30px; border: 1px solid rgba(213,185,113,.25); }
.ob-lockup img { width: 100%; height: 100%; object-fit: contain; display: block; }
.ob h1.serif { font-size: clamp(38px, 5vw, 56px); line-height: 1.02; margin: 14px 0 0; }
.ob h1.serif em { font-style: italic; color: var(--gold); }
.ob .lede { color: var(--muted); font-size: 14.5px; line-height: 1.7; max-width: 460px; margin: 18px auto 0; }

.ob-back { position: absolute; top: 26px; left: 30px; }
.ob-skip { position: absolute; top: 26px; right: 30px; }
.value-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 34px; text-align: left; }
.value-card { border: 1px solid var(--line); border-radius: 18px; padding: 20px 16px; background: rgba(255,255,255,.015); }
.value-card .vi { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; border: 1px solid rgba(213,185,113,.2); background: rgba(213,185,113,.06); color: #d9bf84; margin-bottom: 14px; }
.value-card .vi svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.value-card strong { display: block; font-size: 13.5px; font-weight: 650; margin-bottom: 6px; }
.value-card small { color: var(--muted); font-size: 11.5px; line-height: 1.55; display: block; }
.sso-row { display: grid; gap: 10px; margin-top: 26px; }
.sso-btn { display: flex; align-items: center; justify-content: center; gap: 10px; border: 1px solid var(--line); background: rgba(255,255,255,.025); color: var(--ink); font-size: 13.5px; font-weight: 600; padding: 13px; border-radius: 13px; cursor: pointer; transition: border-color .15s; }
.sso-btn:hover { border-color: var(--line-gold); }
.or-div { display: flex; align-items: center; gap: 12px; color: var(--faint); font-size: 11px; letter-spacing: .1em; margin: 20px 0; }
.or-div::before, .or-div::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.pick-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
.pick {
  border: 1px solid var(--line); background: transparent; color: var(--ink-2);
  font-size: 13px; font-weight: 600; padding: 10px 18px; border-radius: 999px; cursor: pointer; transition: all .15s;
}
.pick.on { border-color: rgba(213,185,113,.6); background: rgba(213,185,113,.1); color: var(--gold-pale); }

/* ================= home ================= */
.home-hero { display: flex; align-items: center; gap: 18px; margin-bottom: 8px; }
.home-hero img { width: 64px; height: 64px; border-radius: 18px; object-fit: cover; border: 1px solid rgba(213,185,113,.25); }
.home-hero h1.serif { font-size: clamp(30px, 3.6vw, 42px); }
.sug-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip {
  padding: 10px 16px; border: 1px solid rgba(213,185,113,.3); border-radius: 999px;
  background: rgba(213,185,113,.06); color: #e8e2d4; font-size: 13px; font-weight: 500;
  cursor: pointer; transition: background .15s, border-color .15s, transform .15s;
}
.chip:hover { background: rgba(213,185,113,.13); border-color: rgba(213,185,113,.55); transform: translateY(-1px); }
.hrow { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(230px, 280px); gap: 10px; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x mandatory; }
.hcard {
  scroll-snap-align: start; border: 1px solid var(--line); border-radius: var(--r-lg);
  background: linear-gradient(180deg, rgba(255,255,255,.022), rgba(255,255,255,.01));
  padding: 18px; cursor: pointer; text-align: left; min-height: 150px;
  display: flex; flex-direction: column; gap: 8px;
  transition: border-color .15s, transform .15s;
}
.hcard:hover { border-color: rgba(213,185,113,.2); transform: translateY(-2px); }
.hcard .lt { color: var(--gold-2); font-size: 9.5px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
.hcard strong { font-family: var(--display); font-weight: 500; font-size: 18px; letter-spacing: -.01em; color: #f2eee6; }
.hcard small { color: var(--muted); font-size: 11.5px; line-height: 1.5; }
.hcard .go { margin-top: auto; color: var(--faint); font-size: 12px; font-weight: 600; }
.studio-tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stile {
  border: 1px solid var(--line); border-radius: var(--r-lg); padding: 22px; cursor: pointer; text-align: left;
  background: linear-gradient(150deg, rgba(213,185,113,.07), rgba(255,255,255,.012) 55%);
  transition: border-color .15s, transform .15s; min-height: 170px; display: flex; flex-direction: column; gap: 8px;
}
.stile:hover { border-color: rgba(213,185,113,.25); transform: translateY(-2px); }
.stile .si { width: 44px; height: 44px; border-radius: 13px; display: grid; place-items: center; border: 1px solid rgba(213,185,113,.25); background: rgba(213,185,113,.07); color: #d9bf84; }
.stile .si svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.6; }
.stile strong { font-family: var(--display); font-size: 20px; font-weight: 500; color: #f2eee6; }
.stile small { color: var(--muted); font-size: 12px; line-height: 1.55; }
.recent-row { display: flex; align-items: center; gap: 14px; width: 100%; border: 1px solid var(--line-soft); background: rgba(255,255,255,.012); border-radius: 15px; padding: 14px 16px; cursor: pointer; text-align: left; margin-bottom: 8px; transition: border-color .15s; }
.recent-row:hover { border-color: rgba(213,185,113,.2); }
.recent-row .ri { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; border: 1px solid rgba(213,185,113,.18); background: rgba(213,185,113,.05); color: #cfb97f; flex: 0 0 auto; }
.recent-row .ri svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.recent-row strong { display: block; font-size: 13.5px; font-weight: 600; }
.recent-row small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 3px; }
.recent-row .go { margin-left: auto; color: var(--faint); }

/* ================= chat ================= */
.chat-wrap { flex: 1 1 auto; display: flex; min-height: 0; }
.convo-list {
  width: 300px; flex: 0 0 auto; border-right: 1px solid var(--line-soft);
  display: flex; flex-direction: column; background: rgba(255,255,255,.008); padding: 18px 14px;
}
.convo-list .cl-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; padding: 0 4px; }
.convo-search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 11px; padding: 9px 12px; margin-bottom: 12px; background: rgba(255,255,255,.02); }
.convo-search svg { width: 15px; height: 15px; stroke: var(--faint); fill: none; stroke-width: 2; flex: 0 0 auto; }
.convo-search input { border: 0; background: none; outline: none; color: var(--ink); font: inherit; font-size: 13px; width: 100%; }
.convo-search input::placeholder { color: var(--faint); }
.convos { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; }
.convo-item {
  border: 0; background: none; text-align: left; cursor: pointer; border-radius: 12px; padding: 11px 12px;
  transition: background .14s; width: 100%;
}
.convo-item:hover { background: rgba(255,255,255,.035); }
.convo-item.active { background: rgba(213,185,113,.09); }
.convo-item strong { display: block; font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.convo-item small { display: block; color: var(--faint); font-size: 11px; margin-top: 3px; }
.thread-pane { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }
.chat-top {
  flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
  padding: 16px 26px; border-bottom: 1px solid var(--line-soft);
}
.chat-top .back-chats { display: none; }
.chat-top strong { font-family: var(--display); font-size: 17px; font-weight: 500; letter-spacing: -.01em; }
.chat-top small { color: var(--faint); font-size: 11px; display: block; margin-top: 1px; }
.thread { flex: 1 1 auto; overflow-y: auto; padding: 30px 26px 20px; scroll-behavior: smooth; }
.message { display: flex; width: min(100%, 800px); margin: 0 auto 24px; animation: msg-in .22s var(--ease); }
@keyframes msg-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.message.user-message { justify-content: flex-end; }
.message-wrapper { display: flex; flex-direction: column; min-width: 0; }
.assistant-message .message-wrapper { width: min(100%, 760px); }
.user-message .message-wrapper { max-width: min(80%, 620px); align-items: flex-end; }
.meta { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.meta img { width: 27px; height: 27px; border-radius: 8px; object-fit: cover; display: block; }
.meta-name { color: var(--gold-2); font-size: 10px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; }
.bubble-user {
  width: fit-content; max-width: 100%; padding: 12px 16px;
  border: 1px solid rgba(213,185,113,.14); border-radius: 19px 19px 5px 19px;
  background: linear-gradient(145deg, rgba(48,53,60,.95), rgba(28,34,41,.98));
  color: #f3f0eb; font-size: 15px; line-height: 1.52; white-space: pre-wrap; word-break: break-word;
}
.msg-status { min-height: 20px; margin-top: 6px; color: #62676a; font-size: 11.5px; align-self: flex-end; }
.prose { color: #ece9e3; font-size: clamp(15px, 1.2vw, 16.5px); line-height: 1.72; letter-spacing: -.008em; }
.prose p { margin: 0 0 14px; }
.prose h2 { font-family: var(--display); font-weight: 500; font-size: 21px; letter-spacing: -.02em; color: #f8f5ef; margin: 24px 0 10px; }
.prose ul, .prose ol { margin: 0 0 14px; padding-left: 20px; }
.prose li { margin-bottom: 7px; }
.prose li::marker { color: rgba(213,185,113,.8); }
.prose strong { color: #f6f2e9; }
.prose code { padding: .16em .44em; border: 1px solid var(--line); border-radius: 7px; background: rgba(255,255,255,.04); color: #e5d6b6; font-family: var(--mono); font-size: .88em; }
.prose pre { margin: 14px 0 16px; padding: 16px 18px; overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: #090d12; font-family: var(--mono); font-size: 13px; line-height: 1.62; color: #e8e2d4; }
.prose pre .k { color: #d5b971; } .prose pre .s { color: #9ec49a; } .prose pre .c { color: #5f6a75; }
.prose .tbl { overflow-x: auto; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 14px; background: rgba(255,255,255,.018); }
.prose table { width: 100%; border-collapse: collapse; font-size: .92em; line-height: 1.5; }
.prose th, .prose td { padding: 10px 13px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.prose th { background: rgba(213,185,113,.075); color: #f4ead2; font-size: .83em; letter-spacing: .055em; text-transform: uppercase; }
.prose tr:last-child td { border-bottom: 0; }
.prose blockquote { margin: 0 0 16px; padding: 12px 16px; border-left: 2px solid #d9bf84; border-radius: 0 12px 12px 0; background: rgba(213,185,113,.055); color: #e9e3d7; }
/* thinking state: mascot + calm gold dots, ~1.2s, then full message at once */
.presence .message-wrapper { flex-direction: row; align-items: center; gap: 11px; }
.presence img { width: 30px; height: 30px; border-radius: 9px; object-fit: cover; display: block; }
.dots { display: inline-flex; align-items: center; gap: 5px; height: 18px; padding: 0 2px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--gold); opacity: .35; animation: dot-pulse 1.3s ease-in-out infinite; }
.dots i:nth-child(2) { animation-delay: .16s; } .dots i:nth-child(3) { animation-delay: .32s; }
@keyframes dot-pulse { 0%,60%,100% { transform: translateY(0) scale(1); opacity: .35; } 30% { transform: translateY(-2px) scale(1.08); opacity: .95; } }
.presence-label { color: var(--muted); font-size: 13px; letter-spacing: .015em; white-space: nowrap; opacity: 0; transition: opacity .35s ease; }
.presence-label.show { opacity: 1; }
/* message actions */
.msg-actions { display: flex; gap: 2px; margin-top: 10px; opacity: 0; transition: opacity .18s; }
.assistant-message:hover .msg-actions, .msg-actions:focus-within { opacity: 1; }
.mact { border: 0; background: none; color: var(--faint); font-size: 11.5px; font-weight: 600; padding: 6px 9px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.mact svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.mact:hover { color: var(--gold-pale); background: rgba(213,185,113,.07); }
.mact.liked { color: var(--gold); }
/* artifact card */
.artifact {
  margin-top: 14px; border: 1px solid var(--line); border-radius: 16px;
  background: linear-gradient(180deg, rgba(255,255,255,.025), rgba(255,255,255,.012));
  padding: 15px 17px; display: grid; grid-template-columns: 44px minmax(0,1fr) auto; gap: 14px; align-items: center;
  transition: border-color .15s;
}
.artifact:hover { border-color: rgba(213,185,113,.18); }
.artifact-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; border: 1px solid rgba(213,185,113,.2); background: rgba(213,185,113,.06); color: #d9bf84; font-family: var(--display); font-size: 19px; }
.artifact strong { display: block; font-size: 14px; color: var(--ink); font-weight: 640; }
.artifact small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 3px; }
.artifact-actions { display: flex; gap: 8px; }
/* outcome feedback */
.outcome { margin-top: 14px; border: 1px solid rgba(213,185,113,.22); border-radius: 14px; background: rgba(213,185,113,.04); padding: 13px 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.outcome-copy { flex: 1 1 200px; min-width: 0; }
.outcome-copy strong { display: block; font-size: 13px; color: var(--ink); font-weight: 640; }
.outcome-copy small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 3px; }
.outcome-btns { display: flex; gap: 7px; flex-wrap: wrap; }
/* composer */
.composer-zone { flex: 0 0 auto; padding: 10px 26px calc(18px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, transparent, rgba(10,13,18,.94) 32%); }
.attach-tray { width: min(100%, 800px); margin: 0 auto 8px; display: flex; gap: 8px; flex-wrap: wrap; }
.attach-chip { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line-gold); background: rgba(213,185,113,.07); border-radius: 11px; padding: 7px 10px 7px 7px; font-size: 12px; color: var(--ink-2); }
.attach-chip img { width: 28px; height: 28px; border-radius: 7px; object-fit: cover; }
.attach-chip button { border: 0; background: none; color: var(--faint); cursor: pointer; font-size: 14px; line-height: 1; padding: 2px; }
.composer { width: min(100%, 800px); margin: 0 auto; display: flex; align-items: flex-end; gap: 6px; padding: 7px; border: 1px solid rgba(255,255,255,.105); border-radius: 26px; background: linear-gradient(180deg, rgba(255,255,255,.026), rgba(255,255,255,.01)), rgba(19,24,31,.94); box-shadow: 0 24px 66px rgba(0,0,0,.4), inset 0 1px rgba(255,255,255,.04); transition: border-color .16s; position: relative; }
.composer:focus-within { border-color: rgba(213,185,113,.24); }
.composer textarea { flex: 1; min-height: 46px; max-height: 160px; padding: 12px 6px 10px; border: 0; background: transparent; color: #f2efea; font: inherit; font-size: 16px; line-height: 1.42; resize: none; outline: none; }
.composer textarea::placeholder { color: #666c71; }
.round-btn { display: grid; place-items: center; width: 46px; height: 46px; flex: 0 0 auto; border: 0; border-radius: 50%; cursor: pointer; background: transparent; color: #91979a; transition: background .15s, color .15s, transform .1s; }
.round-btn:active { transform: scale(.94); }
.round-btn svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.round-btn:hover { background: rgba(255,255,255,.05); color: var(--ink); }
.round-btn.send { background: rgba(255,255,255,.055); color: #737a7f; }
.round-btn.send.armed { background: linear-gradient(180deg, #dfca96, #ba9e60); color: #080b0e; }
.round-btn.listening { background: rgba(213,185,113,.16); color: var(--gold); animation: listen-pulse 1.2s ease-in-out infinite; }
@keyframes listen-pulse { 50% { box-shadow: 0 0 0 6px rgba(213,185,113,.08); } }
.attach-menu { position: absolute; left: 8px; bottom: 62px; background: #131920; border: 1px solid var(--line-gold); border-radius: 15px; padding: 6px; min-width: 210px; z-index: 40; box-shadow: 0 24px 60px rgba(0,0,0,.5); display: none; }
.attach-menu.show { display: block; }
.attach-menu button { display: flex; align-items: center; gap: 11px; width: 100%; border: 0; background: none; color: var(--ink-2); font-size: 13px; font-weight: 550; padding: 11px 12px; border-radius: 10px; cursor: pointer; text-align: left; }
.attach-menu button:hover { background: rgba(213,185,113,.08); color: var(--ink); }
.attach-menu svg { width: 17px; height: 17px; stroke: var(--gold-2); fill: none; stroke-width: 1.7; }
.composer-hint { text-align: center; color: var(--faint); font-size: 10.5px; margin-top: 9px; letter-spacing: .02em; }
/* new-chat empty thread */
.thread-empty { flex: 1 1 auto; overflow-y: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 30px 24px; }
.thread-empty img { width: 76px; height: 76px; border-radius: 20px; object-fit: cover; margin-bottom: 20px; border: 1px solid rgba(213,185,113,.22); }
.thread-empty h2.serif { font-size: clamp(28px, 3.4vw, 40px); margin-bottom: 10px; }
.thread-empty p { color: var(--muted); font-size: 13.5px; max-width: 440px; margin: 0 0 20px; line-height: 1.65; }

/* ================= projects ================= */
.cards { display: grid; gap: 10px; }
.proj-card { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 12px; align-items: center; border: 1px solid var(--line); border-radius: 18px; padding: 18px 20px; background: linear-gradient(180deg, rgba(255,255,255,.022), rgba(255,255,255,.01)); cursor: pointer; text-align: left; width: 100%; transition: border-color .15s, transform .15s; }
.proj-card:hover { border-color: rgba(213,185,113,.2); transform: translateY(-1px); }
.proj-card strong { display: block; font-size: 15px; font-weight: 640; color: var(--ink); }
.proj-card small { display: block; color: var(--muted); font-size: 12px; margin-top: 5px; }
.proj-card .go { color: var(--faint); font-size: 18px; }
.detail-head { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.back { border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; padding: 9px 14px; border-radius: 999px; cursor: pointer; }
.back:hover { color: var(--ink); border-color: var(--line-gold); }
.pin-card { border: 1px solid var(--line-gold); border-radius: 16px; background: rgba(213,185,113,.045); padding: 18px 20px; margin-bottom: 8px; }
.pin-card p { margin: 0; color: #d9d4c9; line-height: 1.65; font-style: italic; font-family: var(--display); font-size: 15.5px; }
.work-row { display: grid; grid-template-columns: 42px minmax(0,1fr) auto; gap: 12px; align-items: center; padding: 13px 4px; border-bottom: 1px solid var(--line-soft); }
.work-row .wi { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; border: 1px solid rgba(213,185,113,.16); background: rgba(213,185,113,.05); color: #cfb97f; font-family: var(--display); font-size: 17px; }
.work-row strong { display: block; font-size: 13.5px; font-weight: 600; }
.work-row small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 2px; }

/* ================= library ================= */
.lib-tabs { display: flex; gap: 6px; margin-bottom: 22px; flex-wrap: wrap; }
.lib-tab { border: 1px solid var(--line); background: transparent; color: var(--muted); font-size: 12.5px; font-weight: 600; padding: 9px 16px; border-radius: 999px; cursor: pointer; transition: all .15s; }
.lib-tab.on { border-color: rgba(213,185,113,.55); background: rgba(213,185,113,.09); color: var(--gold-pale); }
.lib-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(225px, 1fr)); gap: 10px; }
.lib-card { border: 1px solid var(--line); border-radius: 18px; padding: 18px; background: linear-gradient(180deg, rgba(255,255,255,.022), rgba(255,255,255,.01)); display: flex; flex-direction: column; gap: 8px; min-height: 200px; transition: border-color .15s, transform .15s; }
.lib-card:hover { border-color: rgba(213,185,113,.2); transform: translateY(-2px); }
.lib-card .lt { color: var(--gold-2); font-size: 9.5px; font-weight: 750; letter-spacing: .14em; text-transform: uppercase; display: flex; align-items: center; justify-content: space-between; }
.lib-card strong { font-family: var(--display); font-weight: 500; font-size: 18px; letter-spacing: -.01em; color: #f2eee6; }
.lib-card small { color: var(--muted); font-size: 11.5px; }
.lib-card .grow { flex: 1; }
.lib-card .row { display: flex; gap: 8px; margin-top: 6px; }
.lib-thumb { height: 118px; border-radius: 12px; overflow: hidden; border: 1px solid var(--line-soft); margin-bottom: 4px; background: #0b0f14; }
.lib-thumb img, .lib-thumb canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.lib-thumb .vplay { position: relative; }
.lib-search { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; margin-bottom: 18px; background: rgba(255,255,255,.02); max-width: 420px; }
.lib-search svg { width: 15px; height: 15px; stroke: var(--faint); fill: none; stroke-width: 2; }
.lib-search input { border: 0; background: none; outline: none; color: var(--ink); font: inherit; font-size: 13px; width: 100%; }
.lib-search input::placeholder { color: var(--faint); }

/* ================= studios ================= */
.studio-bar { display: flex; gap: 8px; margin: 24px 0 8px; }
.promptbar { flex: 1; display: flex; align-items: center; gap: 8px; border: 1px solid rgba(255,255,255,.11); border-radius: 18px; background: rgba(19,24,31,.9); padding: 7px 7px 7px 18px; transition: border-color .15s; }
.promptbar:focus-within { border-color: rgba(213,185,113,.35); }
.promptbar input { flex: 1; border: 0; background: none; outline: none; color: var(--ink); font: inherit; font-size: 15px; }
.promptbar input::placeholder { color: #666c71; }
.style-chips { display: flex; gap: 8px; flex-wrap: wrap; margin: 14px 0 26px; }
.gen-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.gen-card { border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--surface); transition: border-color .15s, transform .15s; }
.gen-card:hover { border-color: rgba(213,185,113,.22); transform: translateY(-2px); }
.gen-card .gimg { aspect-ratio: 1/1; background: #0b0f14; position: relative; overflow: hidden; }
.gen-card .gimg img, .gen-card .gimg canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.gen-card .gmeta { padding: 14px 16px; }
.gen-card .gmeta strong { display: block; font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gen-card .gmeta small { display: block; color: var(--muted); font-size: 11px; margin-top: 3px; }
.gen-card .grow2 { display: flex; gap: 8px; padding: 0 16px 16px; }
.gen-card .grow2 .btn-ghost, .gen-card .grow2 .btn-gold { flex: 1; padding: 8px; font-size: 12px; }
.gen-pending .gimg { display: grid; place-items: center; }
.shimmer { position: absolute; inset: 0; background: linear-gradient(100deg, transparent 30%, rgba(213,185,113,.07) 50%, transparent 70%); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.gen-pending .pwrap { display: flex; flex-direction: column; align-items: center; gap: 12px; z-index: 1; }
.gen-pending .pwrap img { width: 44px; height: 44px; border-radius: 12px; object-fit: cover; }
.gen-pending small { color: var(--muted); font-size: 11.5px; letter-spacing: .06em; }
.vid-card .gimg { aspect-ratio: 16/9; }
.vid-dur { position: absolute; right: 10px; bottom: 10px; background: rgba(4,6,10,.78); border: 1px solid var(--line); color: var(--ink-2); font-size: 11px; font-weight: 600; padding: 4px 9px; border-radius: 8px; }
.vid-play { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(4,6,10,.18); }
.vid-play span { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; background: rgba(7,10,14,.72); border: 1px solid rgba(213,185,113,.5); color: var(--gold-pale); }
.vid-play svg { width: 20px; height: 20px; fill: currentColor; stroke: none; margin-left: 2px; }
/* video player modal */
.player { width: min(720px, 100%); background: #0a0d12; border: 1px solid var(--line-gold); border-radius: 20px; overflow: hidden; }
.player .pstage { aspect-ratio: 16/9; position: relative; overflow: hidden; background: #05070a; }
.player .pstage canvas { width: 100%; height: 100%; object-fit: cover; display: block; }
.player .pbar { padding: 14px 18px 18px; }
.player .track { height: 4px; border-radius: 999px; background: rgba(255,255,255,.1); margin-bottom: 12px; cursor: pointer; }
.player .fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--gold-3), var(--gold)); width: 0%; }
.player .prow { display: flex; align-items: center; gap: 12px; }
.player .ptoggle { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(213,185,113,.5); background: rgba(213,185,113,.1); color: var(--gold-pale); cursor: pointer; display: grid; place-items: center; }
.player .ptoggle svg { width: 16px; height: 16px; fill: currentColor; }
.player .ptime { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.player .ptitle { font-size: 13px; font-weight: 600; }

/* ================= canvas ================= */
.canvas-wrap { flex: 1 1 auto; display: flex; flex-direction: column; min-height: 0; }
.canvas-toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; padding: 14px 26px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.tool { border: 1px solid transparent; background: none; color: var(--ink-2); font-size: 12.5px; font-weight: 650; padding: 8px 12px; border-radius: 9px; cursor: pointer; min-width: 38px; }
.tool:hover { background: rgba(255,255,255,.045); color: var(--ink); }
.tool.on { border-color: rgba(213,185,113,.4); color: var(--gold-pale); background: rgba(213,185,113,.08); }
.tool svg { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.8; display: block; }
.canvas-doc { flex: 1 1 auto; overflow-y: auto; padding: 40px 26px 60px; }
.doc { width: min(760px, 100%); margin: 0 auto; background: #0d1117; border: 1px solid var(--line-soft); border-radius: 20px; padding: 52px 56px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
.doc:focus { outline: none; }
.doc h1 { font-family: var(--display); font-weight: 400; font-size: 34px; letter-spacing: -.025em; margin: 0 0 6px; color: #f4f0e8; }
.doc .doc-sub { color: var(--faint); font-size: 12px; margin-bottom: 26px; }
.doc h2 { font-family: var(--display); font-weight: 500; font-size: 22px; margin: 28px 0 10px; color: #f2eee6; }
.doc p, .doc li { font-size: 15.5px; line-height: 1.75; color: #e6e2da; }
.doc ul { padding-left: 22px; }
.doc li { margin-bottom: 8px; }
.doc li::marker { color: var(--gold-2); }
.doc blockquote { border-left: 2px solid #d9bf84; margin: 18px 0; padding: 10px 16px; background: rgba(213,185,113,.05); border-radius: 0 12px 12px 0; color: #e9e3d7; }
.canvas-foot { flex: 0 0 auto; display: flex; align-items: center; gap: 10px; padding: 14px 26px; border-top: 1px solid var(--line-soft); }
.canvas-foot .wc { color: var(--faint); font-size: 12px; margin-right: auto; }

/* ================= settings ================= */
.set-group { border: 1px solid var(--line-soft); border-radius: 18px; background: rgba(255,255,255,.012); margin-bottom: 12px; overflow: hidden; }
.set-row { display: flex; align-items: center; gap: 14px; padding: 16px 20px; width: 100%; border: 0; background: none; text-align: left; cursor: pointer; }
.set-row + .set-row { border-top: 1px solid var(--line-soft); }
.set-row.static { cursor: default; }
.set-row .si2 { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; border: 1px solid rgba(213,185,113,.16); background: rgba(213,185,113,.05); color: #cfb97f; flex: 0 0 auto; }
.set-row .si2 svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; }
.set-row strong { display: block; font-size: 13.5px; font-weight: 600; }
.set-row small { display: block; color: var(--muted); font-size: 11.5px; margin-top: 3px; }
.set-row .grow3 { flex: 1; min-width: 0; }
.set-row .chev { color: var(--faint); font-size: 16px; }
.set-row.danger strong { color: #d7837f; }

/* ================= paywall ================= */
.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 26px; }
.tier { border: 1px solid var(--line); border-radius: 22px; padding: 28px 24px; background: linear-gradient(180deg, rgba(255,255,255,.022), rgba(255,255,255,.008)); display: flex; flex-direction: column; position: relative; transition: border-color .15s, transform .15s; }
.tier:hover { transform: translateY(-2px); }
.tier.hl { border-color: rgba(213,185,113,.45); background: linear-gradient(160deg, rgba(213,185,113,.09), rgba(255,255,255,.015)); }
.tier .pop { position: absolute; top: -11px; left: 50%; transform: translateX(-50%); font-size: 9.5px; font-weight: 800; letter-spacing: .14em; color: #0a0d12; background: linear-gradient(180deg,#e6d09c,#c2a468); padding: 4px 12px; border-radius: 999px; white-space: nowrap; }
.tier .tname { font-size: 11px; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; color: var(--gold-2); }
.tier .tprice { font-family: var(--display); font-size: 40px; margin: 12px 0 2px; color: #f4f0e8; }
.tier .tprice span { font-family: var(--body); font-size: 13px; color: var(--muted); font-weight: 500; }
.tier .tdesc { font-size: 12.5px; color: var(--muted); line-height: 1.55; margin-bottom: 18px; }
.tier ul { list-style: none; margin: 0 0 24px; padding: 0; flex: 1; }
.tier li { font-size: 13px; color: var(--ink-2); padding: 7px 0 7px 26px; position: relative; line-height: 1.45; }
.tier li::before { content: "✓"; position: absolute; left: 2px; color: var(--gold); font-size: 12px; font-weight: 700; }
.tier .cur { text-align: center; font-size: 12px; font-weight: 700; color: var(--gold); padding: 12px; }

/* ================= responsive / phone tweaks ================= */
@media (max-width: 900px) {
  .stage:not(.phone) .sidebar { width: 210px; }
  .tiers { grid-template-columns: 1fr; max-width: 460px; }
  .value-cards { grid-template-columns: 1fr; }
}
.stage.phone .page { padding: 26px 18px 60px; }
.stage.phone .convo-list { position: absolute; inset: 0; width: 100%; z-index: 70; background: #0a0d12; transform: translateX(-102%); transition: transform .28s var(--ease); border-right: 0; }
.stage.phone .convo-list.open { transform: none; }
.stage.phone .chat-top .back-chats { display: grid; }
.stage.phone .convo-list .cl-close { display: inline-block; }
.convo-list .cl-close { display: none; }
.stage.phone .thread { padding: 20px 16px 14px; }
.stage.phone .composer-zone { padding: 8px 14px calc(14px + env(safe-area-inset-bottom)); }
.stage.phone .user-message .message-wrapper { max-width: 88%; }
.stage.phone .artifact { grid-template-columns: 40px minmax(0,1fr); }
.stage.phone .artifact-actions { grid-column: 1 / -1; }
.stage.phone .tiers { grid-template-columns: 1fr; }
.stage.phone .doc { padding: 32px 24px; }
.stage.phone .ob-back { left: 16px; } .stage.phone .ob-skip { right: 16px; }
.stage.phone .msg-actions { opacity: 1; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}
</style>

/* ---------- utils ---------- */
function $(id) { return document.getElementById(id); }
function el(tag, cls, html) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (html != null) e.innerHTML = html;
  return e;
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function on(parent, sel, evt, fn) {
  parent.addEventListener(evt, function (e) {
    var t = e.target.closest(sel);
    if (t && parent.contains(t)) fn(e, t);
  });
}

/* ---------- toast ---------- */
var toastEl = $('toast'), toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { toastEl.classList.remove('show'); }, 2300);
}

/* ---------- modal ---------- */
var scrim = $('scrim'), scrimBody = $('scrimBody');
function openModal(html) {
  scrimBody.innerHTML = '';
  var m = el('div', 'modal', html);
  scrimBody.appendChild(m);
  scrim.classList.add('show');
  return m;
}
function closeModal() {
  scrim.classList.remove('show');
  try { if (typeof playerRAF !== 'undefined' && playerRAF) { cancelAnimationFrame(playerRAF); playerRAF = null; } } catch (e) {}
  scrimBody.innerHTML = '';
}
scrim.addEventListener('click', function (e) {
  if (e.target === scrim) {
    if (typeof playerRAF !== 'undefined' && playerRAF) { cancelAnimationFrame(playerRAF); playerRAF = null; }
    closeModal();
  }
});

/* ---------- navigation ---------- */
var stage = $('stage');
function isPhone() { return stage.classList.contains('phone'); }
function go(view, param) {
  document.querySelectorAll('.view').forEach(function (v) {
    v.classList.toggle('active', v.id === 'view-' + view);
  });
  document.querySelectorAll('[data-go]').forEach(function (b) {
    b.classList.toggle('active', b.getAttribute('data-go') === view || (view === 'project' && b.getAttribute('data-go') === 'projects'));
  });
  if (view === 'project' && param) renderProjectDetail(param);
  if (view === 'projects') renderProjectsHome();
  if (view === 'library') renderLibrary();
  if (view === 'settings') renderSettings();
  if (view === 'paywall') renderPaywall();
  if (view === 'home') renderHome();
  if (view === 'image') renderImageStudio();
  if (view === 'video') renderVideoStudio();
  if (view === 'code') renderCodeStudio(param);
  if (view === 'canvas') renderCanvas(param);
  if (view === 'chat') { renderConvoList(); if (param) openConvo(param); }
  if (isPhone()) $('convoList').classList.remove('open');
  var vp = document.querySelector('#view-' + view + ' .page');
  if (vp) vp.scrollTop = 0;
}
on(document, '[data-go]', 'click', function (e, t) { go(t.getAttribute('data-go')); });

/* ---------- demo bar ---------- */

deviceToggle.addEventListener('click', function () {
  var phone = stage.classList.toggle('phone');
  deviceToggle.classList.toggle('on', phone);
  deviceToggle.textContent = phone ? 'Desktop' : 'Phone';
  toast(phone ? 'Phone frame — bottom tabs, full app' : 'Desktop — sidebar navigation');
});

$('resetDemo').addEventListener('click', function () {

});

/* ---------- clock ---------- */
function tickClock() {
  var d = new Date(), h = d.getHours() % 12 || 12;
  $('clock').textContent = h + ':' + String(d.getMinutes()).padStart(2, '0');
}
tickClock(); setInterval(tickClock, 30000);

function greeting() {
  var h = new Date().getHours();
  return h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
}

    s.innerHTML =

      '<h1 class="serif" style="font-size:clamp(32px,4.4vw,46px)">What should<br>we call you?</h1>' +

function replyFor(text, regen) {
  var t = text.toLowerCase();
  if (regen) return Math.random() < 0.5 ? R.regenA : R.regenB;
  if (/(launch|release|ship)/.test(t)) return R.launch1;
  if (/(quantum|qubit)/.test(t)) return R.quantum1;
  if (/(resign|quit.*job|leave.*job)/.test(t)) return R.resign1;
  if (/research/.test(t)) return R.research;
  if (/(week|plan my|schedule)/.test(t)) return R.week;
  if (/(price|pricing|cost|pro\b|enterprise|subscription)/.test(t)) return R.pricing;
  if (/(image|picture|draw|logo|photo)/.test(t)) return R.imageHint;
  if (/(video|film|clip|reel)/.test(t)) return R.videoHint;
  if (/^(hi|hey|hello|yo|good (morning|afternoon|evening))\b/.test(t)) return R.hello;
  return Math.random() < 0.5 ? R.defA : R.defB;
}

function msgActions(rowEl, getHtml) {
  var bar = el('div', 'msg-actions');

    ['like', 'Like', '<svg viewBox="0 0 24 24"><path d="M7 11v9H4v-9h3zm1 9h9l3-8-6-1 1-5 2 1-1 4"/></svg>'],
    ['share', 'Share', '<svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="m8.2 10.8 7.6-3.6M8.2 13.2l7.6 3.6"/></svg>']
  ];

function scrollThread() { thread.scrollTop = thread.scrollHeight; }

var lastUserText = '';
/* Thinking state: mascot + calm gold dots ~1.2s, then the COMPLETE message renders at once. No typewriter, ever. */
function runThinking(done, anchorRow) {
  var row = el('div', 'message assistant-message presence');
  row.setAttribute('aria-hidden', 'true');
  var wrap = el('div', 'message-wrapper');
  var img = document.createElement('img'); img.src = MASCOT; img.alt = '';
  var dots = el('span', 'dots', '<i></i><i></i><i></i>');
  var label = el('span', 'presence-label');
  wrap.appendChild(img); wrap.appendChild(dots); wrap.appendChild(label);
  row.appendChild(wrap);
  if (anchorRow && anchorRow.parentNode) anchorRow.parentNode.insertBefore(row, anchorRow.nextSibling);
  else thread.appendChild(row);
  scrollThread();
  var verb = VERBS[verbCount++ % VERBS.length];
  setTimeout(function () { label.textContent = verb; label.classList.add('show'); }, 450);
  setTimeout(function () { row.remove(); done(); scrollThread(); }, 1250);
}

function enterThread() {
  threadEmpty.style.display = 'none';
  threadEmpty.hidden = true;
  thread.hidden = false;
}

function sendPrompt(text, status) {
  text = (text || '').trim();
  if (!text) return;
  lastUserText = text;
  enterThread();
  thread.appendChild(userRow(text, status || 'Delivered'));
  scrollThread();
  var html = replyFor(text, false);
  var opts = {};
  if (/launch|release|ship/.test(text.toLowerCase()) && !/export|pdf/i.test(text)) {
    opts.artifact = { kind: 'Document', title: 'Launch checklist', meta: '12 items · editable', doc: 'launch' };
    opts.outcome = { q: 'Did this move things forward?', d: 'Your answer helps me do better next time.' };
  }
  runThinking(function () {
    thread.appendChild(crumpRow(html, opts));
    scrollThread();
  });
}

function openConvo(id) {
  var c = CONVOS.find(function (x) { return x.id === id; });
  if (!c) return;
  state.activeConvo = id;
  enterThread();
  thread.innerHTML = '';
  c.turns.forEach(function (t) {
    if (t.role === 'user') thread.appendChild(userRow(t.text, t.status));
    else thread.appendChild(crumpRow(t.html, { artifact: t.artifact, outcome: t.outcome }));
  });
  $('chatTitle').textContent = c.title;
  $('chatSub').textContent = c.turns.length + ' messages · ' + c.updated;
  thread.scrollTop = 0;
  renderConvoList();
  if (isPhone()) $('convoList').classList.remove('open');
}

  composerInput.style.height = 'auto';
  composerInput.style.height = Math.min(composerInput.scrollHeight, 160) + 'px';
});
composerInput.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
});
sendBtn.addEventListener('click', doSend);
function doSend() {
  var text = composerInput.value.trim();
  if (!text && !attachments.length) return;
  composerInput.value = '';
  composerInput.style.height = 'auto';
  sendBtn.classList.remove('armed');
  if (attachments.length) {
    text = (text ? text + ' ' : '') + attachments.map(function (a) { return '[attached: ' + a.name + ']'; }).join(' ');
    clearAttachments();
  }
  sendPrompt(text);
}

/* attach */
var attachments = [];
var attachMenu = $('attachMenu'), filePicker = $('filePicker');
$('plusBtn').addEventListener('click', function (e) { e.stopPropagation(); attachMenu.classList.toggle('show'); });
document.addEventListener('click', function (e) { if (!attachMenu.contains(e.target)) attachMenu.classList.remove('show'); });
on(attachMenu, '[data-att]', 'click', function (e, t) {
  attachMenu.classList.remove('show');
  var kind = t.getAttribute('data-att');
  if (kind === 'code') { go('code'); return; }
  if (kind === 'camera') { toast('Camera isn\u2019t available in this demo'); return; }
  filePicker.setAttribute('accept', kind === 'photo' ? 'image/*' : '*/*');
  filePicker.onchange = function () {
    var f = filePicker.files[0];
    if (!f) return;
    var att = { name: f.name, url: null };
    if (f.type.indexOf('image/') === 0) {
      var r = new FileReader();
      r.onload = function () { att.url = r.result; renderAttachments(); };
      r.readAsDataURL(f);
    }
    attachments.push(att);
    renderAttachments();
    filePicker.value = '';
  };
  filePicker.click();
});
function renderAttachments() {
  var tray = $('attachTray');
  tray.innerHTML = '';
  attachments.forEach(function (a, i) {
    var chip = el('span', 'attach-chip');
    if (a.url) { var im = document.createElement('img'); im.src = a.url; chip.appendChild(im); }
    chip.appendChild(el('span', null, esc(a.name)));
    var x = el('button', null, '✕');
    x.addEventListener('click', function () { attachments.splice(i, 1); renderAttachments(); });
    chip.appendChild(x);
    tray.appendChild(chip);
  });
}
function clearAttachments() { attachments = []; renderAttachments(); }

/* ================= generative art (deterministic, on-brand) ================= */
var artCache = {};
function hashStr(s) { var h = 2166136261; for (var i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng32(a) { return function () { a |= 0; a = (a + 0x6D2B79F5) | 0; var t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function art(seedStr, w, h) {
  var key = seedStr + '|' + w + 'x' + h;
  if (artCache[key]) return artCache[key];
  var r = rng32(hashStr(seedStr));
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var x = c.getContext('2d');
  x.fillStyle = '#0b0e13'; x.fillRect(0, 0, w, h);
  var g = x.createRadialGradient(w * (0.3 + r() * 0.4), h * (0.25 + r() * 0.3), 10, w / 2, h / 2, Math.max(w, h) * 0.75);
  g.addColorStop(0, 'rgba(213,185,113,0.10)'); g.addColorStop(1, 'rgba(213,185,113,0)');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  for (var i = 0; i < 6; i++) {
    x.beginPath();
    x.strokeStyle = 'rgba(213,185,113,' + (0.08 + r() * 0.16).toFixed(2) + ')';
    x.lineWidth = 1 + r() * 2.5;
    var a0 = r() * 6.28;
    x.arc(w * r(), h * r(), Math.min(w, h) * (0.12 + r() * 0.6), a0, a0 + 1 + r() * 3.5);
    x.stroke();
  }
  x.strokeStyle = 'rgba(213,185,113,0.30)'; x.lineWidth = 1;
  x.beginPath(); x.moveTo(w * (0.15 + r() * 0.2), h * (0.78 + r() * 0.08)); x.lineTo(w * (0.65 + r() * 0.2), h * (0.78 + r() * 0.08)); x.stroke();
  var letters = 'ACJRMQSV';
  x.fillStyle = 'rgba(213,185,113,0.85)';
  x.font = '400 ' + Math.floor(Math.min(w, h) * 0.4) + 'px Georgia,serif';
  x.textAlign = 'center'; x.textBaseline = 'middle';
  x.fillText(letters[Math.floor(r() * letters.length)], w / 2, h / 2 + Math.min(w, h) * 0.02);
  var v = x.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,0.5)');
  x.fillStyle = v; x.fillRect(0, 0, w, h);
  artCache[key] = c.toDataURL('image/png');
  return artCache[key];
}

/* simulated video player: Ken Burns drift over the poster */
var playerRAF = null;
function openPlayer(title, seed, durLabel) {
  if (playerRAF) cancelAnimationFrame(playerRAF);
  var url = art(seed, 1280, 720);
  var wrap = el('div', 'player');
  var stageEl = el('div', 'pstage');
  var cv = document.createElement('canvas');
  cv.width = 1280; cv.height = 720;
  stageEl.appendChild(cv);
  wrap.appendChild(stageEl);
  var pbar = el('div', 'pbar');
  pbar.innerHTML = '<div class="track"><div class="fill"></div></div>' +
    '<div class="prow"><button class="ptoggle" aria-label="Play or pause"><svg viewBox="0 0 24 24" class="ic-pause"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button>' +
    '<span class="ptime">0:00 / ' + esc(durLabel) + '</span>' +
    '<span class="ptitle">' + esc(title) + '</span>' +
    '<button class="btn-quiet" style="margin-left:auto" id="pClose">Close</button></div>';
  wrap.appendChild(pbar);
  scrimBody.innerHTML = '';
  scrimBody.appendChild(wrap);
  scrim.classList.add('show');
  var fill = pbar.querySelector('.fill'), ptime = pbar.querySelector('.ptime'), toggle = pbar.querySelector('.ptoggle');
  var img = new Image();
  var playing = true, t0 = performance.now(), elapsed = 0;
  var DUR = 12000;
  function draw(p) {
    var ctx = cv.getContext('2d');
    var sc = 1 + 0.14 * p;
    var dw = 1280 * sc, dh = 720 * sc;
    var dx = -(dw - 1280) * (0.5 + 0.3 * Math.sin(p * 3.14));
    var dy = -(dh - 720) * p * 0.6;
    ctx.drawImage(img, dx, dy, dw, dh);
    ctx.fillStyle = 'rgba(4,6,10,0.12)'; ctx.fillRect(0, 0, 1280, 720);
  }
  function frame(now) {
    if (!playing) return;
    elapsed = now - t0;
    var p = Math.min(elapsed / DUR, 1);
    draw(p);
    fill.style.width = (p * 100).toFixed(1) + '%';
    var secs = Math.floor(p * 12);
    ptime.textContent = '0:' + String(secs).padStart(2, '0') + ' / ' + durLabel;
    if (p < 1) playerRAF = requestAnimationFrame(frame);
    else { playing = false; toggle.innerHTML = '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>'; }
  }
  img.onload = function () { draw(0); playerRAF = requestAnimationFrame(frame); };
  img.src = url;
  toggle.addEventListener('click', function () {
    playing = !playing;
    toggle.innerHTML = playing
      ? '<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>'
      : '<svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>';
    if (playing) { t0 = performance.now() - elapsed; playerRAF = requestAnimationFrame(frame); }
    else if (playerRAF) cancelAnimationFrame(playerRAF);
  });
  pbar.querySelector('.track').addEventListener('click', function (e) {
    var rct = e.currentTarget.getBoundingClientRect();
    var p = Math.min(Math.max((e.clientX - rct.left) / rct.width, 0), 1);
    elapsed = p * DUR; t0 = performance.now() - elapsed;
    draw(p); fill.style.width = (p * 100) + '%';
  });
  pbar.querySelector('#pClose').addEventListener('click', function () {
    if (playerRAF) cancelAnimationFrame(playerRAF);
    closeModal();
  });
}

  var lab = el('div', 'section-label', 'Checkpoints');
  lab.style.marginTop = '22px';
  pane.appendChild(lab);
  codeState.checkpoints.forEach(function (c, i) {
    var ck = el('div', 'ckpt' + (i === codeState.curCkpt ? ' cur' : ''));
    ck.innerHTML = '<span class="cdot"></span><span class="cn"><strong>' + esc(c.name) + '</strong><small>' + esc(c.time) + '</small></span>';
    var rb = el('button', 'btn-quiet', 'Restore');
    rb.addEventListener('click', function () { codeRestore(i); });
    ck.appendChild(rb);
    pane.appendChild(ck);
  });
  return pane;
}

function codePaneCode() {
  var pane = el('div', 'code-pane'); pane.id = 'paneCode';
  var f = CODE_FILES.find(function (x) { return x.name === codeState.activeFile; }) || CODE_FILES[0];
  var h = el('div', 'code-pane-h');
  h.appendChild(el('strong', null, esc(f.name)));
  h.appendChild(el('small', null, 'read-only preview'));
  pane.appendChild(h);
  var shell = el('div', 'code-shell');
  shell.appendChild(el('pre', 'codeview', f.lines.join('\n')));
  pane.appendChild(shell);
  pane.appendChild(el('div', 'sug-label', 'Edit with Crump'));
  var pb = el('div', 'promptbar');
  var inp = document.createElement('input');
  inp.id = 'codeAsk'; inp.placeholder = 'Tell Crump what to change\u2026';
  var btn = el('button', 'btn-gold', 'Ask');
  btn.addEventListener('click', codeAskSubmit);
  inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') codeAskSubmit(); });
  pb.appendChild(inp); pb.appendChild(btn);
  pane.appendChild(pb);
  pane.appendChild(el('p', 'code-note', 'Nothing breaks here. Every change can be undone.'));
  return pane;
}

function codeAskSubmit() {
  var inp = $('codeAsk');
  if (!inp) return;
  var text = inp.value.trim();
  if (!text) { toast('Tell Crump what you\u2019d like to change'); return; }
  var t = text.toLowerCase(), key = null;
  if (/bigger|headline|hero|size/.test(t)) key = 'bigger';
  else if (/dark/.test(t)) key = 'dark';
  else if (/typo|spell/.test(t)) key = 'typo';
  inp.value = '';
  if (key) codeSuggest(key);
  else toast('Nice idea \u2014 try one of the suggestions under Preview to see how it feels');
}

function codePanePreview() {
  var pane = el('div', 'code-pane'); pane.id = 'panePreview';
  var h = el('div', 'code-pane-h');
  h.appendChild(el('strong', null, 'Preview'));
  h.appendChild(el('small', null, 'updates as you approve'));
  pane.appendChild(h);
  var fr = el('div', 'preview-frame');
  var ifr = document.createElement('iframe');
  ifr.id = 'codePreviewFrame';
  ifr.setAttribute('sandbox', 'allow-scripts');
  ifr.setAttribute('title', 'Site preview');
  fr.appendChild(ifr);
  pane.appendChild(fr);
  pane.appendChild(el('div', 'sug-label', 'Try asking Crump'));
  var chips = el('div', 'sug-grid');
  CODE_DIFFS.forEach(function (d) {
    var done = !!codeState.doneChips[d.key];
    var c = el('button', 'chip', (done ? '\u2713 ' : '') + d.chip);
    if (done) { c.style.opacity = '.45'; c.disabled = true; }
    else c.addEventListener('click', function () { codeSuggest(d.key); });
    chips.appendChild(c);
  });
  pane.appendChild(chips);
  pane.appendChild(el('div', null, '')).id = 'codeDiffZone';
  return pane;
}

function codeSuggest(key) {
  var d = CODE_DIFFS.find(function (x) { return x.key === key; });
  if (!d) return;
  codeState.phonePane = 'preview';
  renderCodeStudio();
  var zone = $('codeDiffZone');
  if (!zone) return;
  zone.innerHTML = '';
  var th = el('div', 'think-inline');
  var img = document.createElement('img'); img.src = MASCOT; img.alt = '';
  th.appendChild(img);
  th.appendChild(el('span', 'dots', '<i></i><i></i><i></i>'));
  th.appendChild(el('small', null, 'Crump is making the change\u2026'));
  zone.appendChild(th);
  var token = ++codeState.diffToken;
  setTimeout(function () {
    if (token !== codeState.diffToken) return;
    codeShowDiff(d);
  }, 1200);
}

function codeShowDiff(d) {
  var zone = $('codeDiffZone');
  if (!zone) return;
  zone.innerHTML = '';
  var box = el('div', 'diff');
  var head = el('div', 'diff-head');
  head.innerHTML = '<div class="df">' + esc(d.file) + '</div><p>' + esc(d.summary) + '</p>';
  box.appendChild(head);
  var body = el('div');
  d.lines.forEach(function (ln) {
    var cls = ln.t === 'del' ? 'dl dl-del' : ln.t === 'add' ? 'dl dl-add' : 'dl dl-ctx';
    var mark = ln.t === 'del' ? '\u2212 ' : ln.t === 'add' ? '+ ' : '  ';
    body.appendChild(el('div', cls, esc(mark + ln.s)));
  });
  box.appendChild(body);
  var acts = el('div', 'diff-actions');
  var acc = el('button', 'btn-solid', 'Accept');
  acc.addEventListener('click', function () { codeAccept(d); });
  var dis = el('button', 'btn-ghost', 'Discard');
  dis.addEventListener('click', function () { renderCodeStudio(); });
  acts.appendChild(acc); acts.appendChild(dis);
  box.appendChild(acts);
  zone.appendChild(box);
}

function codeAccept(d) {
  codeState.flags[d.flag] = true;
  codeState.doneChips[d.key] = true;
  codeState.ckptCount++;
  codeState.checkpoints.push({ name: 'Checkpoint ' + codeState.ckptCount + ' \u2014 ' + d.short, time: 'just now', flags: codeCopyFlags() });
  codeState.curCkpt = codeState.checkpoints.length - 1;
  renderCodeStudio();
  toast('Done \u2014 and you can undo anytime.');
}

function codeRestore(i) {
  var c = codeState.checkpoints[i];
  if (!c) return;
  codeState.flags = { bigHero: c.flags.bigHero, darkMode: c.flags.darkMode, typoFixed: c.flags.typoFixed };
  codeState.doneChips = { bigger: c.flags.bigHero, dark: c.flags.darkMode, typo: c.flags.typoFixed };
  codeState.curCkpt = i;
  renderCodeStudio();
  toast('Back to \u201c' + c.name + '\u201d \u2014 nothing lost.');
}

/* ================= CANVAS ================= */
var DOCS = {
  launch: { title: 'Launch checklist', sub: 'Document · in \u201cSavannah launch plan\u201d',
    html: '<h1>Launch checklist</h1><div class="doc-sub">Ask Crump\u2019s first public release · editable</div>' +
    '<h2>This week</h2><ul><li><strong>Freeze the build.</strong> One candidate, one version number, no last-minute features.</li>' +
    '<li><strong>Prove the money path.</strong> A real card, a real charge, a real receipt \u2014 before anyone else pays.</li>' +
    '<li><strong>Write the words once.</strong> Pricing, terms, and support copy in one place, reused everywhere.</li></ul>' +
    '<h2>Launch day</h2><ul><li><strong>09:00</strong> \u2014 Flip the public switch.</li><li><strong>10:00</strong> \u2014 First announcement post.</li>' +
    '<li><strong>14:00</strong> \u2014 Watch the first ten signups live.</li></ul>' +
    '<blockquote>The first dollar of ads should buy learning, not customers. Budget line: $250, slotted after launch day.</blockquote>' },
  resign: { title: 'Resignation letter', sub: 'Document · draft',
    html: '<h1>Resignation letter</h1><div class="doc-sub">Draft · leaving on good terms</div>' +
    '<p>Dear [Manager\u2019s Name],</p><p>Please accept this letter as formal notice of my resignation, effective October 30.</p>' +
    '<p>Three years ago you took a chance on me, and I have been learning from you ever since \u2014 how to run a room, how to disagree kindly, how to finish things. I would not be the professional I am without your mentorship, and I mean that plainly.</p>' +
    '<p>Thank you. I will make the handover seamless.</p><p>With real gratitude,<br>[Your Name]</p>' }
};

function renderCanvas(docId) {
  if (docId && DOCS[docId]) state.canvasDoc = docId;
  if (!state.canvasDoc) state.canvasDoc = 'launch';
  var d = DOCS[state.canvasDoc] || { title: 'Untitled document', sub: 'Document · new', html: '<h1>Untitled document</h1><div class="doc-sub">Start writing — Crump can help you shape it.</div><p></p>' };
  var host = $('canvasWrap');
  host.innerHTML = '';
  var tb = el('div', 'canvas-toolbar');
  tb.innerHTML = '<button class="tool" data-cmd="h1" title="Heading">H1</button>' +
    '<button class="tool" data-cmd="h2" title="Subheading">H2</button>' +
    '<button class="tool" data-cmd="bold" title="Bold"><b>B</b></button>' +
    '<button class="tool" data-cmd="italic" title="Italic"><i>I</i></button>' +
    '<button class="tool" data-cmd="list" title="Bullet list"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="5" cy="6" r="1.2"/><circle cx="5" cy="12" r="1.2"/><circle cx="5" cy="18" r="1.2"/></svg></button>' +
    '<button class="tool" data-cmd="quote" title="Quote"><svg viewBox="0 0 24 24"><path d="M6 15c-1 0-2-1-2-2V7h6v6H6zm10 0c-1 0-2-1-2-2V7h6v6h-4z"/></svg></button>' +
    '<span style="flex:1"></span><span class="wc" id="cvTitle" style="color:var(--muted);font-size:12.5px;font-weight:600">' + esc(d.title) + '</span>';
  host.appendChild(tb);
  var docWrap = el('div', 'canvas-doc');
  var doc = el('div', 'doc');
  doc.contentEditable = 'true';
  doc.spellcheck = false;
  doc.innerHTML = d.html;
  docWrap.appendChild(doc);
  host.appendChild(docWrap);
  var foot = el('div', 'canvas-foot');
  foot.innerHTML = '<span class="wc" id="wordCount"></span>';
  var ask = el('button', 'btn-ghost', 'Ask Crump for help');
  ask.addEventListener('click', function () { go('chat'); newChat(); sendPrompt('Improve my document \u201c' + d.title + '\u201d: tighten the language and sharpen the structure.'); });
  var exp = el('button', 'btn-ghost', 'Export');
  exp.addEventListener('click', function () {
    var blob = new Blob(['<!DOCTYPE html><html><head><meta charset="utf-8"><title>' + d.title + '</title></head><body>' + doc.innerHTML + '</body></html>'], { type: 'text/html' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = d.title.replace(/\s+/g, '-').toLowerCase() + '.html';
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    toast('Exported (demo)');
  });
  var save = el('button', 'btn-solid', 'Save to Library');
  save.addEventListener('click', function () {
    addToLibrary({ kind: 'Document', title: d.title, meta: 'Edited just now', doc: state.canvasDoc });
    toast('\u201c' + d.title + '\u201d saved to your Library');
  });
  foot.appendChild(ask); foot.appendChild(exp); foot.appendChild(save);
  host.appendChild(foot);

  function wc() {
    var words = ((doc.innerText || doc.textContent) || '').trim().split(/\s+/).filter(Boolean).length;
    $('wordCount').textContent = words + ' words';
  }
  doc.addEventListener('input', wc); wc();
  on(tb, '[data-cmd]', 'click', function (e, t) {
    doc.focus();
    var cmd = t.getAttribute('data-cmd');
    if (cmd === 'h1') document.execCommand('formatBlock', false, 'h1');
    else if (cmd === 'h2') document.execCommand('formatBlock', false, 'h2');
    else if (cmd === 'bold') document.execCommand('bold');
    else if (cmd === 'italic') document.execCommand('italic');
    else if (cmd === 'list') document.execCommand('insertUnorderedList');
    else if (cmd === 'quote') document.execCommand('formatBlock', false, 'blockquote');
    wc();
  });
}

/* ================= SETTINGS ================= */
function setRow(icon, title, sub, right, action, danger) {
  var b = el('button', 'set-row' + (danger ? ' danger' : ''));
  b.innerHTML = '<span class="si2"><svg viewBox="0 0 24 24">' + icon + '</svg></span><span class="grow3"><strong>' + esc(title) + '</strong>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</span>';
  var r = el('span');
  if (right === 'chev') r.innerHTML = '<span class="chev">\u203a</span>';
  else if (right) r.appendChild(right);
  b.appendChild(r);
  if (action) b.addEventListener('click', action);
  else b.classList.add('static');
  return b;
}
function tgl(key, initial) {
  var lab = el('label', 'switch');
  var inp = document.createElement('input');
  inp.type = 'checkbox'; inp.checked = initial;
  inp.addEventListener('change', function () { state.settings[key] = inp.checked; toast((inp.checked ? 'On' : 'Off') + ' (demo)'); });
  lab.appendChild(inp);
  lab.appendChild(el('span', 'tk'));
  return lab;
}

  host.appendChild(el('div', 'section-label', 'Notifications'));

  g5.appendChild(setRow('<path d="M4 7h16M9 7V5h6v2m-8 0 1 13h8l1-13"/>', 'Clear chats', 'Delete chats from this device.', 'chev', confirmClear));
  host.appendChild(g5);

  g6.appendChild(setRow('<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8v.1"/>', 'About', 'Ask Crump · Built in Savannah', 'chev', function () { toast('Ask Crump — built in Savannah'); }));
  g6.appendChild(setRow('<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>', 'Sign out', 'Back to the welcome screen.', null, function () { startOnboarding(); }, true));

function editProfileModal() {
  var m = openModal(
    '<h2 class="serif">Profile</h2><p class="msub">How Crump greets you across the app.</p>' +
    '<div class="field"><label>First name</label><input id="pfName" value="' + esc(state.user.name) + '"></div>' +
    '<div class="field"><label>Email</label><input id="pfEmail" value="' + esc(state.user.email) + '" placeholder="you@example.com"></div>' +
    '<div class="modal-actions"><button class="btn-ghost" id="pfCancel">Cancel</button><button class="btn-solid" id="pfSave">Save</button></div>'
  );

function downloadData() {
  var data = { user: state.user, plan: state.plan, projects: PROJECTS.map(function (p) { return p.name; }), library: LIBRARY.map(function (l) { return l.title; }), exported: new Date().toISOString() };
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
  a.download = 'ask-crump-data.json';
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  toast('Your data is downloading');
}

function confirmClear() {
  var m = openModal(
    '<h2 class="serif">Delete your chats?</h2><p class="msub">This deletes your chats on this device. Your projects and library stay right where they are.</p>' +
    '<div class="modal-actions"><button class="btn-ghost" id="ccCancel">Keep them</button><button class="btn-solid" id="ccYes">Clear</button></div>'
  );
  m.querySelector('#ccCancel').addEventListener('click', closeModal);

    { id: 'pro', name: 'Pro', price: '$20', per: '/month', desc: 'For bigger plans and everyday use.', feats: ['Unlimited messages', 'Unlimited projects', 'Image + Video Studio', 'Canvas documents', 'Priority responses'], hl: true, pop: 'Most popular' },
