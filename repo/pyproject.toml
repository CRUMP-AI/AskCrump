[project]
name = "ask-crump"
version = "4.4.0"
description = "Cross-platform conversational assistant with synchronized chat and persistent sessions."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.116.1",
  "pydantic[email]==2.13.4",
  "httpx[http2]==0.28.1",
  "bcrypt==4.3.0",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.35.0",
  "google-auth==2.40.3",
  "PyJWT[crypto]==2.10.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "node_modules", "ios", "android"]

[tool.ruff.lint]
select = ["E9", "F"]
