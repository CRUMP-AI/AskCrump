        // ==========================================
        // ANTI-DUPLICATE SYSTEM
        // ==========================================
        class MessageDeduplicator {
            constructor(windowMs = 2000) {
                this.recentMessages = new Map();
                this.windowMs = windowMs;
            }
            
            isDuplicate(message) {
                const normalized = message.trim().toLowerCase();
                const now = Date.now();
                
                if (this.recentMessages.has(normalized)) {
                    const lastTime = this.recentMessages.get(normalized);
                    if (now - lastTime < this.windowMs) {
                        console.log('🚫 Duplicate blocked:', normalized.substring(0, 30));
                        return true;
                    }
                }
                
                this.recentMessages.set(normalized, now);
                this.cleanup();
                return false;
            }
            
            cleanup() {
                const now = Date.now();
                for (const [msg, time] of this.recentMessages.entries()) {
                    if (now - time > this.windowMs) {
                        this.recentMessages.delete(msg);
                    }
                }
            }
        }

        const messageDeduper = new MessageDeduplicator(2000);

        // ==========================================
        // AUTONOMOUS ENGINES
        // ==========================================
        class SuggestionEngine {
            constructor() {
                this.patterns = {
                    question: /\?$/,
                    command: /^(create|make|build|generate|show|tell|explain)/i,
                    incomplete: /\.\.\.|and$/i,
                    technical: /(code|function|api|debug|error|fix)/i
                };
                this.sessionPatterns = [];
            }
            
            analyze(message) {
                const analysis = {
                    type: this.detectType(message),
                    confidence: 0,
                    suggestions: []
                };
                
                this.sessionPatterns.push(analysis.type);
                return analysis;
            }
            
            detectType(message) {
                if (this.patterns.question.test(message)) return 'question';
                if (this.patterns.command.test(message)) return 'command';
                if (this.patterns.technical.test(message)) return 'technical';
                return 'statement';
            }
            
            getSessionInsights() {
                const types = this.sessionPatterns.reduce((acc, type) => {
                    acc[type] = (acc[type] || 0) + 1;
                    return acc;
                }, {});
                return types;
            }
        }

        class ContextTracker {
            constructor() {
                this.sessionStart = Date.now();
                this.messageCount = 0;
                this.topics = new Set();
                this.lastActivity = Date.now();
            }
            
            track(message) {
                this.messageCount++;
                this.lastActivity = Date.now();
                
                const words = message.toLowerCase().split(/\s+/);
                const importantWords = words.filter(w => w.length > 4);
                importantWords.forEach(word => this.topics.add(word));
            }
            
            getSessionDuration() {
                return Math.floor((Date.now() - this.sessionStart) / 1000 / 60);
            }
            
            getIdleTime() {
                return Math.floor((Date.now() - this.lastActivity) / 1000);
            }
            
            getSummary() {
                return {
                    duration: this.getSessionDuration(),
                    messages: this.messageCount,
                    topics: Array.from(this.topics).slice(0, 5),
                    idle: this.getIdleTime()
                };
            }
        }

        const contextTracker = new ContextTracker();

        // CHAT MANAGEMENT - FIXED
        // ==========================================
        function loadChats() {
            const saved = localStorage.getItem(STORAGE_KEYS.CHATS);
            if (saved) {
                try {
                    chats = JSON.parse(saved);
                } catch (e) {
                    console.error('Error loading chats:', e);

        }

            if (!confirm('Delete this chat? This cannot be undone.')) return;
            
            delete chats[chatId];
            
            if (currentChatId === chatId) {
                const remainingIds = Object.keys(chats);
                if (remainingIds.length > 0) {
                    loadChat(remainingIds[0]);
                } else {
                    createNewChat();
                }

            saveChats();
            renderChatList();
        }

// MESSAGE RENDERING & HANDLING
function renderMessages(messages) {
    const container = document.getElementById('chatContainer');
    if (!container) return;
    
    container.innerHTML = messages.map((msg, index) => {
        const isUser = msg.role === 'user';
        const avatar = isUser ? 'G' : currentAssistantName[0].toUpperCase();
        
        let actionsHtml = '';
        if (!isUser) {
            actionsHtml = `
                <div class="message-actions">
                    <button class="message-action-btn" onclick="copyMessage(${index})">📋 Copy</button>
                    <button class="message-action-btn" onclick="regenerateResponse(${index})">🔄 Regenerate</button>
                </div>
            `;
        }
        
        let content = `<div class="message-content">${formatMessageContent(msg.content)}</div>`;
        
        if (msg.fileData) {
            const images = Array.isArray(msg.fileData) ? msg.fileData : [msg.fileData];
            content += `
                <div class="message-images">
                    ${images.map(file => `<img src="${file.data}" class="message-image" alt="${file.name}">`).join('')}
                </div>
            `;
        }
        
        if (msg.imageUrl) {
            content += `<img src="${msg.imageUrl}" class="message-image single" alt="Generated">`;
        }
        
        return `
            <div class="message ${isUser ? 'user' : ''}">
                <div class="avatar ${isUser ? 'user' : 'assistant'}">${avatar}</div>
                <div class="message-wrapper">${content}${actionsHtml}</div>
            </div>
        `;
    }).join('');
    
    container.scrollTop = container.scrollHeight;
}

function formatMessageContent(content) {
    return content
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');
}

function addMessage(role, content, fileData = null, imageUrl = null) {
    const message = { role, content, timestamp: Date.now() };
    if (fileData) message.fileData = fileData;
    if (imageUrl) message.imageUrl = imageUrl;
    
    currentChat.messages.push(message);
    currentChat.updated = Date.now();
    
    if (role === 'user' && currentChat.messages.filter(m => m.role === 'user').length === 1) {
        currentChat.title = content.substring(0, 50) + (content.length > 50 ? '...' : '');
    }
    
    saveChats();
    renderMessages(currentChat.messages);
    renderChatList();
}

function showThinking() {
    const container = document.getElementById('chatContainer');
    const thinking = document.createElement('div');
    thinking.id = 'thinkingIndicator';
    thinking.className = 'message';
    thinking.innerHTML = `
        <div class="avatar assistant">${currentAssistantName[0].toUpperCase()}</div>
        <div class="message-wrapper">
            <div class="message-content"><div class="thinking-dots"><span></span><span></span><span></span></div></div>
        </div>
    `;
    container.appendChild(thinking);
    container.scrollTop = container.scrollHeight;
}

function hideThinking() {
    const el = document.getElementById('thinkingIndicator');
    if (el) el.remove();
}

// ✅ SEND MESSAGE - COMPLETE
async function sendMessage() {
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const message = input.value.trim();
    
    if (isSending || (!message && currentFiles.length === 0)) return;
    if (message && messageDeduper.isDuplicate(message)) {
        showNotification('Please wait before sending', 'info');
        return;
    }
    
    isSending = true;
    input.disabled = true;
    sendBtn.disabled = true;
    sendBtn.classList.add('loading');
    
    try {
        if (message) {
            contextTracker.track(message);
            suggestionEngine.analyze(message);
        }
        
        if (message && (checkLocalCommands(message) || checkMemoryCommands(message))) {
            input.value = '';
            clearFiles();
            return;
        }
        
        if (message && detectNovaActivation(message)) {
            activateNovaProtocol();
            input.value = '';
            return;
        }
        
        const filesToSend = currentFiles.length > 0 ? [...currentFiles] : null;
        addMessage('user', message || '[Sent images]', filesToSend);
        input.value = '';
        clearFiles();
        autoResize(input);
        showThinking();
        
        if (message && shouldGenerateImage(message)) {
            await handleImageGeneration(message);
            hideThinking();
            return;
        }
        
        const payload = {
            message: message || '[User sent images]',
            history: currentChat.messages.slice(-CONFIG.MAX_HISTORY_MESSAGES).map(m => ({
                role: m.role,
                content: m.content
            })),
            fileData: filesToSend,
            needsSearch: false,
            novaActive: novaSecureActive,
            novaProtocol: novaSecureActive ? {
                activations: novaActivationCount,
                gregoryContext: { name: "Gregory D. Crump Jr.", role: "Creator" }
            } : null,
            universalMemory: {
                crossSessionContext: crossSessionContext.map(content => ({ content, timestamp: Date.now() })),
                userProfile: { assistantName: currentAssistantName },
                conversationHistory: {
                    totalMessages: Object.values(chats).reduce((sum, c) => sum + c.messages.length, 0),
                    totalChats: Object.keys(chats).length
                }
            }
        };
        
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        
        const data = await response.json();
        hideThinking();
        
        if (data.response) {
            addMessage('assistant', data.response);
            if (message) await autoCommitToMemory(message, data.response);
            if (voiceOutputEnabled) speak(data.response);
        }
        
    } catch (error) {
        console.error('Send error:', error);
        hideThinking();
        showNotification(`Error: ${error.message}`, 'error');
        addMessage('assistant', `Error: ${error.message}`);
    } finally {
        isSending = false;
        input.disabled = false;
        sendBtn.disabled = false;
        sendBtn.classList.remove('loading');
        input.focus();
    }
}

// MEMORY & COMMANDS
async function autoCommitToMemory(userMsg, aiMsg) {
    const triggers = [/remember (?:that )?(.+)/i, /don't forget (.+)/i];
    for (const pattern of triggers) {
        const match = userMsg.match(pattern);
        if (match) {
            addCrossSessionContext(match[1]);
            showNotification('Memory stored', 'success');
            return;
        }
    }
}

function checkLocalCommands(msg) {
    const lower = msg.toLowerCase().trim();
    if (lower === 'help') { showHelp(); return true; }
    if (lower === 'clear') {
        if (confirm('Clear chat?')) {
            currentChat.messages = [];
            saveChats();
            renderMessages([]);
            addMessage('assistant', getSystemWelcome());
        }
        return true;
    }
    if (lower === 'stats') { showStats(); return true; }
    if (lower === 'export') { exportChat(); return true; }
    return false;
}

function checkMemoryCommands(msg) {
    const lower = msg.toLowerCase().trim();
    if (lower.startsWith('remember ')) {
        const content = msg.substring(9).trim();
        if (content) {
            addCrossSessionContext(content);
            addMessage('assistant', `Remembered: "${content}"`);
        }
        return true;
    }
    if (lower === 'memory') { showMemoryDump(); return true; }
    return false;
}

function showHelp() {
    addMessage('assistant', `**Commands:** help, clear, stats, export, memory\n**Memory:** "remember [text]"\n**Images:** Click 📎 or say "generate [desc]"\n**Nova:** "Activate Nova-Secure"`);
}

function showStats() {
    const s = contextTracker.getSummary();
    addMessage('assistant', `**Stats**\n⏱️ ${s.duration}min\n💬 ${s.messages} msgs\n🔤 Topics: ${s.topics.join(', ')}`);
}

function showMemoryDump() {
    const mem = crossSessionContext;
    if (mem.length === 0) {
        addMessage('assistant', 'No memories stored. Use "remember [text]"');
    } else {
        addMessage('assistant', `**Memory (${mem.length} items)**\n${mem.slice(-10).map((m, i) => `${i+1}. ${m}`).join('\n')}`);
    }
}

function exportChat() {
    const data = { title: currentChat.title, messages: currentChat.messages };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `chat-${Date.now()}.json`;
    a.click();
    showNotification('Exported', 'success');
}

// FILE HANDLING
function attachFiles() { document.getElementById('fileInput').click(); }

function handleFileSelect(e) {
    Array.from(e.target.files).forEach(file => {
        if (!file.type.startsWith('image/')) return;
        if (file.size > CONFIG.FILE_SIZE_LIMIT_MB * 1024 * 1024) {
            showNotification(`${file.name} too large`, 'error');
            return;
        }
        const reader = new FileReader();
        reader.onload = ev => {
            currentFiles.push({ name: file.name, size: file.size, type: file.type, data: ev.target.result });
            updateFilesPreview();
        };
        reader.readAsDataURL(file);
    });
    e.target.value = '';
}

function updateFilesPreview() {
    const c = document.getElementById('filesPreview');
    if (currentFiles.length === 0) {
        c.classList.remove('active');
        c.innerHTML = '';
    } else {
        c.classList.add('active');
        c.innerHTML = `<div class="file-upload-count">📎 ${currentFiles.length} image(s)</div>` +
            currentFiles.map((f, i) => `<div class="file-upload-item"><img src="${f.data}"><button class="file-remove-btn" onclick="removeFileAtIndex(${i})">×</button></div>`).join('');
    }
}

function removeFileAtIndex(i) { currentFiles.splice(i, 1); updateFilesPreview(); }
function clearFiles() { currentFiles = []; updateFilesPreview(); document.getElementById('fileInput').value = ''; }

// IMAGE GENERATION
function shouldGenerateImage(msg) {
    return /^(generate|create|make|draw)\s+/i.test(msg);
}

async function handleImageGeneration(prompt) {
    const clean = prompt.replace(/^(generate|create|make|draw)\s+(an?\s+)?(image\s+of\s+)?/i, '').trim();
    if (!clean) {
        addMessage('assistant', 'What should I generate?');
        return;
    }
    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(clean)}?width=1024&height=1024&nologo=true`;
    await new Promise(r => setTimeout(r, 2000));
    addMessage('assistant', 'Generated:', null, url);
}

// NOVA PROTOCOL
function detectNovaActivation(msg) {
    return /activate nova-secure|nala niobi protocol/i.test(msg);
}

function activateNovaProtocol() {
    novaSecureActive = true;
    novaActivationCount++;
    localStorage.setItem(STORAGE_KEYS.NOVA_SECURE, 'true');
    localStorage.setItem(STORAGE_KEYS.NOVA_COUNT, novaActivationCount);
    addMessage('assistant', `🔐 **NOVA-SECURE ACTIVATED**\n\nHey Greg! 😏 N² Engine online. Activation #${novaActivationCount}. What's the plan? 🚀`);
}

// VOICE SYSTEM
function setupVoiceRecognition() {
    if (!('webkitSpeechRecognition' in window)) return;
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SR();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.onresult = e => {
        document.getElementById('userInput').value = e.results[0][0].transcript;
        autoResize(document.getElementById('userInput'));
        stopVoiceInput();
    };
    recognition.onerror = () => stopVoiceInput();
    recognition.onend = () => {
        isListening = false;
        const btn = document.getElementById('voiceBtn');
        if (btn) { btn.classList.remove('listening'); btn.textContent = '🎤'; }
    };
}

function toggleVoiceInput() {
    if (isListening) stopVoiceInput();
    else startVoiceInput();
}

function startVoiceInput() {
    if (!recognition) { showNotification('Voice not supported', 'error'); return; }
    try {
        recognition.start();
        isListening = true;
        const btn = document.getElementById('voiceBtn');
        if (btn) { btn.classList.add('listening'); btn.textContent = '🔴'; }
    } catch (e) { showNotification('Voice error', 'error'); }
}

function stopVoiceInput() {
    if (recognition && isListening) {
        recognition.stop();
        isListening = false;
        const btn = document.getElementById('voiceBtn');
        if (btn) { btn.classList.remove('listening'); btn.textContent = '🎤'; }
    }
}

function speak(text) {
    if (!voiceOutputEnabled || !text) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    speechSynthesis.speak(u);
}

// SETTINGS
function loadSettings() {
    voiceEnabled = localStorage.getItem(STORAGE_KEYS.VOICE_ENABLED) === 'true';
    voiceOutputEnabled = localStorage.getItem(STORAGE_KEYS.VOICE_OUTPUT) === 'true';
    currentAssistantName = localStorage.getItem(STORAGE_KEYS.ASSISTANT_NAME) || 'Crump';
    novaSecureActive = localStorage.getItem(STORAGE_KEYS.NOVA_SECURE) === 'true';
    novaActivationCount = parseInt(localStorage.getItem(STORAGE_KEYS.NOVA_COUNT) || '0');
}

function setAssistantName(name) {
    currentAssistantName = name;
    localStorage.setItem(STORAGE_KEYS.ASSISTANT_NAME, name);
}

function saveAssistantName() {
    const input = document.getElementById('assistantNameInput');
    const name = input.value.trim();
    if (name) {
        setAssistantName(name);
        showNotification(`Name changed to ${name}`, 'success');
        input.value = '';
    }
}

function toggleSettings() {
    document.getElementById('settingsPanel').classList.toggle('active');
}

// MEMORY SYSTEM
function initUniversalMemory() {
    const saved = localStorage.getItem(STORAGE_KEYS.UNIVERSAL_MEMORY);
    if (saved) {
        try {
            const data = JSON.parse(saved);
            crossSessionContext = data.crossSessionContext || [];
        } catch (e) {
            crossSessionContext = [];
        }
    }
}

function addCrossSessionContext(content) {
    if (!content || !content.trim()) return;
    crossSessionContext.push(content.trim());
    if (crossSessionContext.length > 50) {
        crossSessionContext = crossSessionContext.slice(-50);
    }
    localStorage.setItem(STORAGE_KEYS.UNIVERSAL_MEMORY, JSON.stringify({
        crossSessionContext,
        updated: Date.now()
    }));
}

// MESSAGE ACTIONS
function copyMessage(index) {
    const msg = currentChat.messages[index];
    if (!msg) return;
    navigator.clipboard.writeText(msg.content).then(
        () => showNotification('Copied', 'success'),
        () => showNotification('Copy failed', 'error')
    );
}

async function regenerateResponse(index) {
    let userIdx = index - 1;
    while (userIdx >= 0 && currentChat.messages[userIdx].role !== 'user') userIdx--;
    if (userIdx < 0) return;
    
    currentChat.messages = currentChat.messages.slice(0, userIdx + 1);
    saveChats();
    renderMessages(currentChat.messages);
    
    await sendMessage();
}

// UTILITIES
function autoResize(el) {
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
}

function showNotification(msg, type = 'info') {
    const n = document.createElement('div');
    n.className = `notification ${type}`;
    n.textContent = msg;
    document.body.appendChild(n);
    setTimeout(() => n.classList.add('show'), 10);
    setTimeout(() => {
        n.classList.remove('show');
        setTimeout(() => n.remove(), 300);
    }, 3000);
}

function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

// IMPORT/EXPORT
function exportAllData() {
    const data = {
        version: '2.11.0',
        exported: new Date().toISOString(),
        chats,
        crossSessionContext
    };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `crump-backup-${Date.now()}.json`;
    a.click();
    showNotification('Backup exported', 'success');
}

function importData() {
    document.getElementById('importInput').click();
}

function handleImport(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        try {
            const data = JSON.parse(ev.target.result);
            if (confirm('Replace all data?')) {
                if (data.chats) { chats = data.chats; saveChats(); }
                if (data.crossSessionContext) {
                    crossSessionContext = data.crossSessionContext;
                    localStorage.setItem(STORAGE_KEYS.UNIVERSAL_MEMORY, JSON.stringify({ crossSessionContext }));
                }
                showNotification('Imported', 'success');
                location.reload();
            }
        } catch (err) {
            showNotification('Import failed', 'error');
        }
    };
    reader.readAsText(file);
    e.target.value = '';
}
