<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRUMP AI - Royal Edition</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#d4af37">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Crump AI">
    <link rel="apple-touch-icon" href="/assets/icon-192.png">
    <style>
        :root {
            --bg-primary: #0a1628;
            --bg-secondary: #0f1e33;
            --bg-tertiary: #15263d;
            --accent-primary: #d4af37;
            --accent-secondary: #b8941f;
            --text-primary: #f5f5dc;
            --text-secondary: #c5b798;
            --text-tertiary: #8b7d6b;
            --border-color: rgba(212, 175, 55, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100dvh;
            overflow: hidden;
            transition: font-family 0.3s ease;
        }

        body.classic-font {
            font-family: 'Times New Roman', Times, Georgia, serif;
        }

        body.elegant-font {
            font-family: Garamond, 'Palatino Linotype', Palatino, serif;
        }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeOut 0.5s ease 2s forwards;
        }

        #splash-screen img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        .app-container {
            display: flex;
            height: 100dvh;
        }

        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    z-index: 999;
    opacity: 0;
    transition: opacity 0.3s ease;
}

.sidebar-overlay.active {
    display: block;
    opacity: 1;
}

.sidebar-close-btn {
    display: none;
}

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 8px;
            color: var(--bg-primary);
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
        }

        .search-box {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .search-box::placeholder {
            color: var(--text-tertiary);
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .chat-section {
            margin-bottom: 20px;
        }

        .chat-section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-item {
            padding: 12px;
            margin-bottom: 8px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            position: relative;
        }

        .chat-item:hover {
            background: var(--bg-secondary);
            border-color: var(--accent-primary);
        }

        .chat-item:hover .chat-actions {
            opacity: 1;
        }

        .chat-item.active {
            background: var(--bg-secondary);
            border-color: var(--accent-primary);
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .chat-tag {
            padding: 2px 8px;
            background: var(--accent-primary);
            color: var(--bg-primary);
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .chat-title {
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-preview {
            font-size: 12px;
            color: var(--text-tertiary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .chat-action-btn {
            width: 24px;
            height: 24px;
            border: none;
            background: var(--bg-primary);
            color: var(--text-secondary);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .chat-action-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .hamburger-btn {
            display: none;
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .hamburger-btn:hover {
            background: var(--bg-tertiary);
            color: var(--accent-primary);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 52px;
            height: 56px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .settings-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: slideIn 0.3s ease;
            position: relative;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .avatar.user {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
        }

        .avatar.assistant {
            background: var(--bg-tertiary);
            color: var(--accent-primary);
            border: 2px solid var(--accent-primary);
        }

        .message-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message-content {
            background: var(--bg-secondary);
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-primary);
            white-space: pre-wrap;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
        }

        .message-image {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 8px;
            border: 2px solid var(--accent-primary);
            cursor: pointer;
        }

        .file-preview {
            max-width: 300px;
            margin-top: 8px;
            border: 2px solid var(--accent-primary);
            border-radius: 12px;
            overflow: hidden;
        }

        .file-preview img {
            width: 100%;
            height: auto;
            display: block;
        }

        .file-info {
            padding: 8px 12px;
            background: var(--bg-tertiary);
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .message-action-btn {
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .message-action-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
            border-color: var(--accent-primary);
        }

        .copy-notification {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--accent-primary);
            color: var(--bg-primary);
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            animation: slideInUp 0.3s ease, fadeOut 0.3s ease 2s forwards;
            z-index: 1001;
        }

        @keyframes slideInUp {
            from {
                transform: translateY(20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .thinking-indicator {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px 0;
        }

        .thinking-dots {
            display: flex;
            gap: 6px;
        }

        .thinking-dots span {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-container {
            padding: 20px 24px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        .file-upload-preview {
            margin-bottom: 12px;
            padding: 12px;
            background: var(--bg-tertiary);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            display: none;
            align-items: center;
            gap: 12px;
        }

        .file-upload-preview.active {
            display: flex;
        }

        .file-upload-preview img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 8px;
        }

        .file-upload-info {
            flex: 1;
        }

        .file-upload-name {
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .file-upload-size {
            font-size: 12px;
            color: var(--text-tertiary);
        }

        .file-upload-remove {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .file-upload-remove:hover {
            background: var(--bg-secondary);
            color: #ff4444;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 8px 12px;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
        }

        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            line-height: 1.5;
            padding: 4px 8px;
        }

        .input-field:focus {
            outline: none;
        }

        .input-field::placeholder {
            color: var(--text-tertiary);
        }

        .input-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: var(--bg-secondary);
            color: var(--accent-primary);
        }

        .icon-btn.primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
        }

        .icon-btn.primary:hover {
            transform: scale(1.05);
        }

        .icon-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .settings-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100dvh;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            padding: 24px;
            overflow-y: auto;
            transition: right 0.3s ease;
            z-index: 1000;
        }

        .settings-panel.active {
            right: 0;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .settings-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--accent-primary);
        }

        .close-settings-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .close-settings-btn:hover {
            background: var(--bg-tertiary);
            color: var(--accent-primary);
        }

        .setting-group {
            margin-bottom: 24px;
        }

        .setting-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-tertiary);
            transition: 0.3s;
            border-radius: 26px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: var(--text-secondary);
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        }

        input:checked + .toggle-slider:before {
            transform: translateX(24px);
            background-color: var(--bg-primary);
        }

        .font-options, .color-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .font-btn, .color-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .font-btn:hover, .color-btn:hover {
            border-color: var(--accent-primary);
            background: var(--bg-secondary);
        }

        .font-btn.active, .color-btn.active {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
            border-color: var(--accent-primary);
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .color-picker {
            width: 44px;
            height: 44px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }

        .color-picker:hover {
            border-color: var(--accent-primary);
            transform: scale(1.1);
        }

        .danger-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px solid #ff4444;
            color: #ff4444;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            margin-bottom: 12px;
        }

        .danger-btn:hover {
            background: #ff4444;
            color: white;
        }

        .version-info {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }

        .version-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-primary);
            margin-bottom: 8px;
        }

        .version-detail {
            font-size: 13px;
            color: var(--text-tertiary);
            margin-bottom: 4px;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 13px;
            color: var(--accent-primary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100dvh;
                transform: translateX(-100%);
                z-index: 1000;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .hamburger-btn {
                display: flex;
            }

            .header {
                padding: 12px 16px;
            }

            .logo-text {
                font-size: 20px;
            }

            .chat-container {
                padding: 16px;
            }

            .message {
                max-width: 90%;
            }

            .input-container {
                padding: 12px 16px;
            }

            .settings-panel {
                width: 100%;
                right: -100%;
            }

            .sidebar-close-btn {
        display: block !important;
    }
}
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-secondary);
        }

       /* Tutorial Styles */
.tutorial-overlay {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(10, 22, 40, 0.95);
    z-index: 10001;
    backdrop-filter: blur(10px);
}

.tutorial-overlay.active {
    display: flex;
    align-items: center;
    justify-content: center;
    animation: fadeIn 0.3s ease;
}

.tutorial-content {
    background: var(--bg-secondary);
    border: 2px solid var(--accent-primary);
    border-radius: 16px;
    max-width: 500px;
    width: 90%;
    padding: 32px;
    box-shadow: 0 10px 40px rgba(212, 175, 55, 0.3);
}

.tutorial-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border-color);
}

.tutorial-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--accent-primary);
}

.tutorial-step {
    font-size: 14px;
    color: var(--text-tertiary);
}

.tutorial-body {
    text-align: center;
    margin-bottom: 32px;
}

.tutorial-icon {
    font-size: 64px;
    margin-bottom: 16px;
}

.tutorial-body h2 {
    font-size: 24px;
    color: var(--text-primary);
    margin-bottom: 12px;
}

.tutorial-body p {
    font-size: 16px;
    color: var(--text-secondary);
    line-height: 1.6;
}

.tutorial-body ul {
    list-style: none;
    text-align: left;
    margin-top: 16px;
}

.tutorial-body li {
    padding: 8px 0;
    color: var(--text-secondary);
    display: flex;
    align-items: center;

    <script>
        let currentChatId = null;

        let userMemory = {

        document.addEventListener('DOMContentLoaded', () => {

}

let currentTutorialStep = 1;

const tutorialSteps = [
    {
        icon: "👋",
        title: "Welcome, Gregory",
        text: "I'm Crump, your personal AI assistant powered by the N² Engine. Let me show you around."
    },
    {
        icon: "💬",
        title: "Powerful Conversations",
        text: "I can help with technical work, creative projects, analysis, and more. Just type your question and hit send."
    },
    {
        icon: "🎤",

    },
    {
        icon: "🧠",
        title: "Smart Memory",
        text: "Tell me to 'Remember that...' and I'll store important information. I learn from every conversation to serve you better."
    }
];

function showTutorial() {
    currentTutorialStep = 1;
    updateTutorialContent();
    document.getElementById('tutorial-overlay').classList.add('active');
}

function updateTutorialContent() {
    const step = tutorialSteps[currentTutorialStep - 1];
    const body = document.getElementById('tutorialBody');
    const stepIndicator = document.getElementById('tutorialStep');
    
    stepIndicator.textContent = `Step ${currentTutorialStep} of ${tutorialSteps.length}`;
    
    body.innerHTML = `
        <div class="tutorial-icon">${step.icon}</div>
        <h2>${step.title}</h2>
        <p>${step.text}</p>
    `;
}

function nextTutorialStep() {
    if (currentTutorialStep < tutorialSteps.length) {
        currentTutorialStep++;
        updateTutorialContent();
    } else {
        completeTutorial();
    }
}

function skipTutorial() {
    completeTutorial();
}

function completeTutorial() {
    sessionStorage.setItem('crump_tutorial_completed', 'true');
    document.getElementById('tutorial-overlay').classList.remove('active');
}
            loadSettings();
            loadChats();
            loadMemory();
            setupVoiceRecognition();
            
            if (chats.length === 0) {
                createNewChat();
            } else {
                loadChat(chats[0].id);
            }
        });

        function toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    
    sidebar.classList.toggle('active');
    overlay.classList.toggle('active');
}
            
            function closeSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('sidebar-overlay');
    
    sidebar.classList.remove('active');
    overlay.classList.remove('active');
}

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('active');
        }

        function loadSettings() {
            const voiceOutput = localStorage.getItem('voiceOutput') === 'true';
            const autoVoice = localStorage.getItem('autoVoice') === 'true';
            const fontStyle = localStorage.getItem('fontStyle') || 'modern';
            const bgColor = localStorage.getItem('bgColor') || '#0a1628';

            document.getElementById('voiceToggle').checked = voiceOutput;
            document.getElementById('autoVoiceToggle').checked = autoVoice;
            isVoiceEnabled = voiceOutput;
            isAutoVoiceEnabled = autoVoice;
            changeFont(fontStyle);
            changeBgColor(bgColor);
        }

        function toggleVoiceOutput() {
            isVoiceEnabled = document.getElementById('voiceToggle').checked;
            localStorage.setItem('voiceOutput', isVoiceEnabled);
        }

        function toggleAutoVoice() {
            isAutoVoiceEnabled = document.getElementById('autoVoiceToggle').checked;
            localStorage.setItem('autoVoice', isAutoVoiceEnabled);
        }

        function changeFont(style) {
            document.body.className = style === 'modern' ? '' : `${style}-font`;
            localStorage.setItem('fontStyle', style);
            
            document.querySelectorAll('.font-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase() === style) {
                    btn.classList.add('active');
                }
            });
        }

        function changeBgColor(color) {
            document.documentElement.style.setProperty('--bg-primary', color);
            document.getElementById('bgColorPicker').value = color;
            localStorage.setItem('bgColor', color);
        }

        function resetBgColor() {
            changeBgColor('#0a1628');
        }

        function loadMemory() {
            const savedMemory = localStorage.getItem('crump_user_memory');
            if (savedMemory) {
                userMemory = JSON.parse(savedMemory);
            }
        }

        function saveMemory() {
            localStorage.setItem('crump_user_memory', JSON.stringify(userMemory));
        }

        function checkMemoryCommands(message) {
            const lower = message.toLowerCase();
            
            if (lower.startsWith('remember that') || lower.startsWith('remember:')) {
                const content = message.substring(message.indexOf('that') + 4).trim() || 
                               message.substring(message.indexOf(':') + 1).trim();
                userMemory.notes.push({
                    content: content,
                    timestamp: new Date().toISOString()
                });
                saveMemory();
                return `Got it. I'll remember: "${content}"`;
            }
            
            if (lower.includes('what do you remember') || lower.includes('what do you know about me')) {
                if (userMemory.notes.length === 0 && Object.keys(userMemory.preferences).length === 0 && Object.keys(userMemory.contexts).length === 0) {
                    return "I don't have any stored memories about you yet. You can tell me to remember things by saying 'Remember that...'";
                }
                
                let response = "Here's what I remember:\n\n";
                
                if (userMemory.notes.length > 0) {
                    response += "📝 Notes:\n";
                    userMemory.notes.forEach((note, i) => {
                        response += `${i + 1}. ${note.content}\n`;
                    });
                }
                
                if (Object.keys(userMemory.preferences).length > 0) {
                    response += "\n⚙️ Preferences:\n";
                    Object.entries(userMemory.preferences).forEach(([key, value]) => {
                        response += `• ${key}: ${value}\n`;
                    });
                }
                
                if (Object.keys(userMemory.contexts).length > 0) {
                    response += "\n🎯 Context:\n";
                    Object.entries(userMemory.contexts).forEach(([key, value]) => {
                        response += `• ${key}: ${value}\n`;
                    });
                }
                
                return response;
            }
            
            if (lower.startsWith('forget that') || lower.startsWith('forget:')) {
                const content = message.substring(message.indexOf('that') + 4).trim() || 
                               message.substring(message.indexOf(':') + 1).trim();
                
                const originalLength = userMemory.notes.length;
                userMemory.notes = userMemory.notes.filter(note => 
                    !note.content.toLowerCase().includes(content.toLowerCase())
                );
                
                if (userMemory.notes.length < originalLength) {
                    saveMemory();
                    return `I've forgotten that information.`;
                } else {
                    return `I couldn't find that in my memory.`;
                }
            }
            
            if (lower === 'clear memory' || lower === 'forget everything') {
                if (confirm('Clear all stored memories? This cannot be undone.')) {
                    userMemory = {
                        preferences: {},
                        contexts: {},
                        notes: []
                    };
                    saveMemory();
                    return "All memories cleared.";
                }
                return "Memory clear cancelled.";
            }
            
            return null;
        }

        function getMemoryContext() {
            if (userMemory.notes.length === 0 && Object.keys(userMemory.preferences).length === 0 && Object.keys(userMemory.contexts).length === 0) {
                return '';
            }
            
            let context = '\n\n[Context about user: ';
            
            if (userMemory.notes.length > 0) {
                context += userMemory.notes.map(n => n.content).join('; ');
            }
            
            if (Object.keys(userMemory.preferences).length > 0) {
                context += '. Preferences: ' + Object.entries(userMemory.preferences).map(([k,v]) => `${k}=${v}`).join(', ');
            }
            
            if (Object.keys(userMemory.contexts).length > 0) {
                context += '. ' + Object.entries(userMemory.contexts).map(([k,v]) => `${k}: ${v}`).join(', ');
            }
            
            context += ']';
            return context;
        }

        function attachFile() {
            document.getElementById('fileInput').click();
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                alert('Currently only images are supported. PDF support coming soon!');
                return;
            }

            if (file.size > 5 * 1024 * 1024) {
                alert('File size must be under 5MB');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                currentFile = {
                    name: file.name,
                    size: file.size,
                    type: file.type,
                    data: e.target.result
                };

                document.getElementById('filePreviewImage').src = e.target.result;
                document.getElementById('fileName').textContent = file.name;
                document.getElementById('fileSize').textContent = formatFileSize(file.size);
                document.getElementById('filePreview').classList.add('active');
            };
            reader.readAsDataURL(file);
        }

        function removeFile() {
            currentFile = null;
            document.getElementById('filePreview').classList.remove('active');
            document.getElementById('fileInput').value = '';
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }

        function loadChats() {
            const savedChats = localStorage.getItem('crump_chats');
            chats = savedChats ? JSON.parse(savedChats) : [];
            // Ensure all chats have new properties
            chats = chats.map(chat => ({
                ...chat,
                pinned: chat.pinned || false,
                archived: chat.archived || false,
                tag: chat.tag || null
            }));
            renderChatsList();
        }

        function saveChats() {
            localStorage.setItem('crump_chats', JSON.stringify(chats));
        }

        function createNewChat() {
            const newChat = {
                id: Date.now().toString(),
                title: 'New Chat',
                messages: [],
                createdAt: new Date().toISOString(),
                pinned: false,
                archived: false,
                tag: null
            };
            
            chats.unshift(newChat);
            saveChats();
            loadChat(newChat.id);
            renderChatsList();

            if (window.innerWidth <= 768) {
                toggleSidebar();
            }

            const welcomeMsg = welcomeMessages[Math.floor(Math.random() * welcomeMessages.length)];
            addMessage('assistant', welcomeMsg);
        }

        function loadChat(chatId) {
            currentChatId = chatId;
            localStorage.setItem('crump_current_chat', chatId);
            
            const chat = chats.find(c => c.id === chatId);
            if (chat) {
                renderMessages(chat.messages);
            }
            
            renderChatsList();

            if (window.innerWidth <= 768) {
                const sidebar = document.getElementById('sidebar');
                if (sidebar.classList.contains('active')) {
                    toggleSidebar();
                }
            }
        }

        function renderChatsList(searchQuery = '') {
            const chatsList = document.getElementById('chatsList');
            
            let filteredChats = chats;
            if (searchQuery) {
                const query = searchQuery.toLowerCase();
                filteredChats = chats.filter(chat => 
                    chat.title.toLowerCase().includes(query) ||
                    chat.messages.some(m => m.content.toLowerCase().includes(query))
                );
            }
            
            const pinnedChats = filteredChats.filter(c => c.pinned && !c.archived);
            const regularChats = filteredChats.filter(c => !c.pinned && !c.archived);
            const archivedChats = filteredChats.filter(c => c.archived);
            
            let html = '';
            
            if (pinnedChats.length > 0) {
                html += '<div class="chat-section">';
                html += '<div class="chat-section-title">⭐ PINNED</div>';
                html += pinnedChats.map(chat => renderChatItem(chat)).join('');
                html += '</div>';
            }
            
            if (regularChats.length > 0) {
                html += '<div class="chat-section">';
                html += '<div class="chat-section-title">💬 CHATS</div>';
                html += regularChats.map(chat => renderChatItem(chat)).join('');
                html += '</div>';
            }
            
            if (archivedChats.length > 0) {
                html += '<div class="chat-section">';
                html += '<div class="chat-section-title">📦 ARCHIVED</div>';
                html += archivedChats.map(chat => renderChatItem(chat)).join('');
                html += '</div>';
            }
            
            if (filteredChats.length === 0) {
                html = '<div style="padding: 20px; text-align: center; color: var(--text-tertiary);">No chats found</div>';
            }
            
            chatsList.innerHTML = html;
        }
        
        function renderChatItem(chat) {
            const isActive = chat.id === currentChatId;
            const preview = chat.messages.length > 0 
                ? chat.messages[chat.messages.length - 1].content.substring(0, 50) 
                : 'No messages yet';
            
            const pinIcon = chat.pinned ? '⭐' : '📌';
            const archiveIcon = chat.archived ? '📤' : '📦';
            const tagHtml = chat.tag ? `<span class="chat-tag">${chat.tag}</span>` : '';
            
            return `
                <div class="chat-item ${isActive ? 'active' : ''}" onclick="loadChat('${chat.id}')">
                    <div class="chat-actions" onclick="event.stopPropagation()">
                        <button class="chat-action-btn" onclick="togglePin('${chat.id}')" title="${chat.pinned ? 'Unpin' : 'Pin'}">${pinIcon}</button>
                        <button class="chat-action-btn" onclick="toggleArchive('${chat.id}')" title="${chat.archived ? 'Unarchive' : 'Archive'}">${archiveIcon}</button>
                        <button class="chat-action-btn" onclick="deleteChat('${chat.id}')" title="Delete">🗑️</button>
                    </div>
                    <div class="chat-header">
                        ${tagHtml}
                    </div>
                    <div class="chat-title">${chat.title}</div>
                    <div class="chat-preview">${preview}${preview.length >= 50 ? '...' : ''}</div>
                </div>
            `;
        }
        
        function filterChats(query) {
            renderChatsList(query);
        }
        
        function togglePin(chatId) {
            const chat = chats.find(c => c.id === chatId);
            if (chat) {
                chat.pinned = !chat.pinned;
                saveChats();
                renderChatsList();
            }
        }
        
        function toggleArchive(chatId) {
            const chat = chats.find(c => c.id === chatId);
            if (chat) {
                chat.archived = !chat.archived;
                saveChats();
                renderChatsList();
            }
        }
        
        function deleteChat(chatId) {
            if (!confirm('Delete this chat? This cannot be undone.')) return;
            
            chats = chats.filter(c => c.id !== chatId);
            saveChats();
            
            if (chatId === currentChatId) {
                if (chats.length > 0) {
                    loadChat(chats[0].id);
                } else {
                    createNewChat();
                }
            }
            
            renderChatsList();
        }

        function renderMessages(messages) {
            const container = document.getElementById('chatContainer');
            container.innerHTML = messages.map((msg, index) => {
                const isUser = msg.role === 'user';
                const avatar = isUser ? 'G' : 'C';
                const avatarClass = isUser ? 'user' : 'assistant';
                
                let actionsHtml = '';
                if (!isUser) {
                    actionsHtml = `
                        <div class="message-actions">
                            <button class="message-action-btn" onclick="copyMessage(${index})">
                                📋 Copy
                            </button>
                            <button class="message-action-btn" onclick="regenerateResponse(${index})">
                                🔄 Regenerate
                            </button>
                        </div>
                    `;
                }
                
                let content = `<div class="message-content">${msg.content}</div>`;
                
                if (msg.fileData && msg.fileData.type.startsWith('image/')) {
                    content += `
                        <div class="file-preview">
                            <img src="${msg.fileData.data}" alt="Uploaded image">
                            <div class="file-info">
                                📎 ${msg.fileData.name}
                            </div>
                        </div>
                    `;
                }
                
                if (msg.imageUrl) {
                    content += `<img src="${msg.imageUrl}" class="message-image" alt="Generated image">`;
                }
                
                return `
                    <div class="message ${isUser ? 'user' : ''}">
                        <div class="avatar ${avatarClass}">${avatar}</div>
                        <div class="message-wrapper">
                            ${content}
                            ${actionsHtml}
                        </div>
                    </div>
                `;
            }).join('');
            
            container.scrollTop = container.scrollHeight;
        }

        function copyMessage(index) {
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat || !chat.messages[index]) return;
            
            const text = chat.messages[index].content;
            
            navigator.clipboard.writeText(text).then(() => {
                showCopyNotification();
            }).catch(err => {
                console.error('Copy failed:', err);
            });
        }

        function showCopyNotification() {
            const notification = document.createElement('div');
            notification.className = 'copy-notification';
            notification.textContent = '✓ Copied to clipboard';
            document.body.appendChild(notification);
            
            setTimeout(() => {
                notification.remove();
            }, 2500);
        }

        async function regenerateResponse(index) {
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat || index === 0) return;
            
            chat.messages = chat.messages.slice(0, index);
            saveChats();
            renderMessages(chat.messages);
            
            const lastUserMessage = chat.messages[chat.messages.length - 1];
            if (!lastUserMessage || lastUserMessage.role !== 'user') return;
            
            const message = lastUserMessage.content;
            const fileData = lastUserMessage.fileData;
            
            const memoryResponse = checkMemoryCommands(message);
            if (memoryResponse && !fileData) {
                showThinking();
                setTimeout(() => {
                    hideThinking();
                    addMessage('assistant', memoryResponse);
                }, 500);
                return;
            }
            
            const localResponse = getLocalResponse(message);
            if (localResponse && !fileData) {
                showThinking();
                setTimeout(() => {
                    hideThinking();
                    addMessage('assistant', localResponse);
                }, 800);
                return;
            }

            // Check if query needs web search
const needsSearch = shouldSearchWeb(message);

            if (shouldGenerateImage(message) && !fileData) {
                await handleImageGeneration(message);
                return;
            }
            
            showThinking();
            
            try {
                const memoryContext = getMemoryContext();
                const messageWithContext = message + memoryContext;
                
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
    message: messageWithContext,
    history: chat.messages.slice(-10).filter(m => m.content && m.content.trim() !== ''),
    fileData: fileDataToSend,
    needsSearch: needsSearch
})
                });
                
                if (!response.ok) throw new Error('API request failed');
                
                const data = await response.json();
                hideThinking();
                addMessage('assistant', data.response);
                
            } catch (error) {
                hideThinking();
                addMessage('assistant', 'I apologize, but I encountered an error. Please try again.');
                console.error('Error:', error);
            }
        }

        function addMessage(role, content, imageUrl = null, fileData = null) {
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;
            
            const message = { role, content };
            if (imageUrl) message.imageUrl = imageUrl;
            if (fileData) message.fileData = fileData;
            
            chat.messages.push(message);
            
            if (role === 'user' && chat.messages.filter(m => m.role === 'user').length === 1) {
                chat.title = content.substring(0, 30) + (content.length > 30 ? '...' : '');
            }
            
            saveChats();
            renderMessages(chat.messages);
            renderChatsList();

            if (role === 'assistant' && isAutoVoiceEnabled) {
                speak(content);
            }
        }

        function showThinking() {
            const container = document.getElementById('chatContainer');
            const thinkingHtml = `
                <div class="thinking-indicator" id="thinkingIndicator">
                    <div class="avatar assistant">C</div>
                    <div class="message-content">
                        Crump is thinking
                        <div class="thinking-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', thinkingHtml);
            container.scrollTop = container.scrollHeight;
        }

        function hideThinking() {
            const indicator = document.getElementById('thinkingIndicator');
            if (indicator) indicator.remove();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage('user', message, null, currentFile);
            input.value = '';
            autoResize(input);
            
            const hasFile = currentFile !== null;
            const fileDataToSend = currentFile;
            removeFile();
            
            const memoryResponse = checkMemoryCommands(message);
            if (memoryResponse && !hasFile) {
                showThinking();
                setTimeout(() => {
                    hideThinking();
                    addMessage('assistant', memoryResponse);
                }, 500);
                return;
            }
            
            if (!hasFile) {
                const localResponse = getLocalResponse(message);
                if (localResponse) {
                    showThinking();
                    setTimeout(() => {
                        hideThinking();
                        addMessage('assistant', localResponse);
                    }, 800);
                    return;
                }

                if (shouldGenerateImage(message)) {
                    await handleImageGeneration(message);
                    return;
                }
            }
            
            showThinking();
            
            try {
                const chat = chats.find(c => c.id === currentChatId);
                const memoryContext = getMemoryContext();
                const messageWithContext = message + memoryContext;
                
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: messageWithContext,
                        history: chat.messages.slice(-10).filter(m => m.content && m.content.trim() !== ''),
                        fileData: fileDataToSend
                    })
                });
                
                if (!response.ok) throw new Error('API request failed');
                
                const data = await response.json();
                hideThinking();
                addMessage('assistant', data.response);
                
            } catch (error) {
                hideThinking();
                addMessage('assistant', 'I apologize, but I encountered an error. Please try again.');
                console.error('Error:', error);
            }
        }

        function getLocalResponse(message) {
            const lower = message.toLowerCase();
            
            if (lower.includes('who are you') || lower.includes('what are you')) {
                return "I'm Crump, your personal AI assistant powered by the N² Engine. I handle everything from technical work to creative projects with precision and intelligence. I was built by Gregory D. Crump Jr. to be helpful, direct, and professional.";
            }
            
            if (lower.includes('who am i') || lower.includes('who is gregory')) {
                return "You're the architect behind this system. The one who built Crump AI from scratch.";
            }
            
            if (lower.includes('what is crump') || lower.includes('what is the n')) {
                return "Crump AI is a premium, royal-branded personal AI assistant powered by the N² Engine, which enables me to handle technical, creative, and analytical tasks seamlessly.";
            }
            
            if (lower.includes('who built you') || lower.includes('who created you')) {
                return "I was built by Gregory D. Crump Jr., an artist and innovator who created me to be a powerful yet personal AI assistant.";
            }
            
            if (lower.includes('what can you do') || lower.includes('your capabilities')) {
                return "I can help you with:\n\n• Technical problems (debugging, code, algorithms)\n• Creative writing (stories, content, ideas)\n• Analysis and research\n• Voice conversations (speak to me!)\n• Image generation (just ask me to create an image)\n• Image analysis (upload any image and ask questions!)\n• Memory - I can remember important information about you\n• Multi-threaded conversations\n\nTry saying 'Remember that...' to store information I should know about you!";
            }
            
            return null;
        }

        function shouldGenerateImage(message) {
            const lower = message.toLowerCase();
            const imageKeywords = ['generate', 'create', 'make', 'draw', 'design', 'show me'];
            const imageNouns = ['image', 'picture', 'photo', 'illustration', 'artwork', 'drawing'];
            
            const hasKeyword = imageKeywords.some(keyword => lower.includes(keyword));
            const hasNoun = imageNouns.some(noun => lower.includes(noun));
            
            return hasKeyword && hasNoun;
        }

        function extractImagePrompt(message) {
            let prompt = message;
            const prefixes = [
                'generate an image of',
                'create an image of',
                'make an image of',
                'draw an image of',
                'show me an image of',
                'generate a picture of',
                'create a picture of',
                'make a picture of',
                'draw a picture of',
                'show me a picture of',
                'generate',
                'create',
                'make',
                'draw',
                'show me'
            ];
            
            for (const prefix of prefixes) {
                if (prompt.toLowerCase().startsWith(prefix)) {
                    prompt = prompt.substring(prefix.length).trim();
                    break;
                }
            }
            
            return prompt;
        }

        async function handleImageGeneration(message) {
            const prompt = extractImagePrompt(message);
            showThinking();
            
            setTimeout(() => {
                hideThinking();
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=800&height=800&nologo=true`;
                addMessage('assistant', `Here's your image:`, imageUrl);
            }, 800);
        }

        function setupVoiceRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                
                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById('userInput').value = transcript;
                    isListening = false;
                    updateVoiceButton();
                };
                
                recognition.onerror = () => {
                    isListening = false;
                    updateVoiceButton();
                };
                
                recognition.onend = () => {
                    isListening = false;
                    updateVoiceButton();
                };
            }
        }

        function toggleVoiceInput() {
            if (!recognition) {
                alert('Voice recognition is not supported in your browser.');
                return;
            }
            
            if (isListening) {
                recognition.stop();
                isListening = false;
            } else {
                recognition.start();
                isListening = true;
            }
            
            updateVoiceButton();
        }

        function updateVoiceButton() {
            const btn = document.getElementById('voiceBtn');
            btn.textContent = isListening ? '⏹️' : '🎤';
            btn.style.background = isListening ? 'linear-gradient(135deg, var(--accent-primary), var(--accent-secondary))' : 'transparent';
            btn.style.color = isListening ? 'var(--bg-primary)' : 'var(--text-secondary)';
        }

        function speak(text) {
            if (!isVoiceEnabled) return;
            
            if (currentUtterance) {
                speechSynthesis.cancel();
            }
            
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.rate = 1.1;
            currentUtterance.pitch = 1.0;
            speechSynthesis.speak(currentUtterance);
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function clearCurrentChat() {
            if (!confirm('Clear all messages in this chat?')) return;
            
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                chat.messages = [];
                saveChats();
                renderMessages([]);
                renderChatsList();
            }
        }

        function deleteAllChats() {
            if (!confirm('Delete ALL chats? This cannot be undone.')) return;
            
            chats = [];
            saveChats();
            createNewChat();
        }

        function clearMemoryPrompt() {
            if (!confirm('Clear all stored memories? This cannot be undone.')) return;

            userMemory = {
                preferences: {},
                contexts: {},
                notes: []
            };
            saveMemory();
            alert('All memories cleared.');
        }

        function shouldSearchWeb(message) {
    const lower = message.toLowerCase();
    
    // Time-sensitive queries
    const timeKeywords = ['today', 'now', 'current', 'latest', 'recent', 'this week', 'this month', 'yesterday'];
    if (timeKeywords.some(keyword => lower.includes(keyword))) {
        return true;
    }
    
    // News/events
    const newsKeywords = ['news', 'happened', 'event', 'score', 'result', 'winner', 'election'];
    if (newsKeywords.some(keyword => lower.includes(keyword))) {
        return true;
    }
    
    // Real-time data
    const dataKeywords = ['weather', 'temperature', 'stock', 'price', 'forecast'];
    if (dataKeywords.some(keyword => lower.includes(keyword))) {
        return true;
    }
    
    // Explicit search requests
    if (lower.includes('search') || lower.includes('look up') || lower.includes('find out')) {
        return true;
    }
    
    return false;
}

         function replayTutorial() {
    sessionStorage.removeItem('crump_splash_seen');
    sessionStorage.removeItem('crump_tutorial_completed');
    location.reload();
}
    </script>
