<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRUMP AI - Royal Edition</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#d4af37">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Crump AI">
    <link rel="apple-touch-icon" href="/assets/icon-192.png">
    
    <style>
        :root {
            --bg-primary: #0a1628;
            --bg-secondary: #0f1e33;
            --bg-tertiary: #15263d;
            --accent-primary: #d4af37;
            --accent-secondary: #b8941f;
            --text-primary: #f5f5dc;
            --text-secondary: #c5b798;
            --text-tertiary: #8b7d6b;
            --border-color: rgba(212, 175, 55, 0.2);
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100dvh;
            overflow: hidden;
            transition: font-family 0.3s ease;
        }

        body.classic-font {
            font-family: 'Times New Roman', Times, Georgia, serif;
        }

        body.elegant-font {
            font-family: Garamond, 'Palatino Linotype', Palatino, serif;
        }

        /* Splash Screen */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeOut 0.5s ease 2s forwards;
        }

        #splash-screen img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        /* Main Layout */
        .app-container {
            display: flex;
            height: 100dvh;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
            z-index: 100;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 99;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .sidebar-overlay.active {
            display: block;
            opacity: 1;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 8px;
            color: var(--bg-primary);
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
            font-size: 14px;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
        }

        .new-chat-btn:active {
            transform: translateY(0);
        }

        .search-box {
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 14px;
            font-family: inherit;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--accent-primary);
        }

        .search-box::placeholder {
            color: var(--text-tertiary);
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .chat-section {
            margin-bottom: 20px;
        }

        .chat-section-title {
            font-size: 11px;
            font-weight: 700;
            color: var(--text-tertiary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .chat-item {
            padding: 12px;
            margin-bottom: 8px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
            position: relative;
        }

        .chat-item:hover {
            background: var(--bg-secondary);
            border-color: var(--accent-primary);
        }

        .chat-item:hover .chat-actions {
            opacity: 1;
        }

        .chat-item.active {
            background: var(--bg-secondary);
            border-color: var(--accent-primary);
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px;
        }

        .chat-tag {
            padding: 2px 8px;
            background: var(--accent-primary);
            color: var(--bg-primary);
            border-radius: 4px;
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .chat-title {
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-preview {
            font-size: 12px;
            color: var(--text-tertiary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-actions {
            position: absolute;
            top: 8px;
            right: 8px;
            display: flex;
            gap: 4px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .chat-action-btn {
            width: 24px;
            height: 24px;
            border: none;
            background: var(--bg-primary);
            color: var(--text-secondary);
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .chat-action-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
        }

        /* Main Content */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header */
        .header {
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .hamburger-btn {
            display: none;
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .hamburger-btn:hover {
            background: var(--bg-tertiary);
            color: var(--accent-primary);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 52px;
            height: 56px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .settings-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* Messages */
        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: slideIn 0.3s ease;
            position: relative;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .avatar.user {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
        }

        .avatar.assistant {
            background: var(--bg-tertiary);
            color: var(--accent-primary);
            border: 2px solid var(--accent-primary);
        }

        .message-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .message-content {
            background: var(--bg-secondary);
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-primary);
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
        }

        /* Image handling */
        .message-images {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }

        .message-image {
            width: 100%;
            border-radius: 12px;
            border: 2px solid var(--accent-primary);
            cursor: pointer;
            transition: transform 0.2s;
        }

        .message-image:hover {
            transform: scale(1.02);
        }

        .message-image.single {
            max-width: 400px;
        }

        .file-preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            margin-top: 8px;
        }

        .file-preview-item {
            position: relative;
            border: 2px solid var(--accent-primary);
            border-radius: 12px;
            overflow: hidden;
            background: var(--bg-tertiary);
        }

        .file-preview-item img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            display: block;
        }

        .file-preview-info {
            padding: 8px;
            font-size: 11px;
            color: var(--text-secondary);
            text-overflow: ellipsis;
            overflow: hidden;
            white-space: nowrap;
        }

        .message-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .message-action-btn {
            padding: 4px 10px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .message-action-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
            border-color: var(--accent-primary);
        }

        /* Thinking indicator */
        .thinking-indicator {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px 0;
        }

        .thinking-dots {
            display: flex;
            gap: 6px;
        }

        .thinking-dots span {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Input Container */
        .input-container {
            padding: 20px 24px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        /* NEW: Multi-file upload preview */
        .files-upload-preview {
            margin-bottom: 12px;
            display: none;
            gap: 12px;
            flex-wrap: wrap;
        }

        .files-upload-preview.active {
            display: flex;
        }

        .file-upload-item {
            position: relative;
            width: 80px;
            height: 80px;
            border-radius: 8px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            background: var(--bg-tertiary);
        }

        .file-upload-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .file-upload-item .file-remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            border: none;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .file-upload-item .file-remove-btn:hover {
            background: var(--error-color);
        }

        .file-upload-count {
            padding: 6px 12px;
            background: var(--bg-tertiary);
            border-radius: 6px;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 8px 12px;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
        }

        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            line-height: 1.5;
            padding: 4px 8px;
        }

        .input-field:focus {
            outline: none;
        }

        .input-field::placeholder {
            color: var(--text-tertiary);
        }

        .input-field:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .input-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .icon-btn:hover:not(:disabled) {
            background: var(--bg-secondary);
            color: var(--accent-primary);
        }

        .icon-btn.primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
        }

        .icon-btn.primary:hover:not(:disabled) {
            transform: scale(1.05);
        }

        .icon-btn.primary:active:not(:disabled) {
            transform: scale(0.95);
        }

        .icon-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Loading state */
        .icon-btn.loading {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Settings Panel - Will continue in Part 2 */
        .settings-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100dvh;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            padding: 24px;
            overflow-y: auto;
            transition: right 0.3s ease;
            z-index: 1000;
        }

        .settings-panel.active {
            right: 0;
        }

        /* Tutorial */
        .tutorial-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 22, 40, 0.95);
            z-index: 10001;
            backdrop-filter: blur(10px);
        }

        .tutorial-overlay.active {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.3s ease;
        }

        .tutorial-content {
            background: var(--bg-secondary);
            border: 2px solid var(--accent-primary);
            border-radius: 16px;
            max-width: 500px;
            width: 90%;
            padding: 32px;
            box-shadow: 0 10px 40px rgba(212, 175, 55, 0.3);
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100dvh;
                transform: translateX(-100%);
                z-index: 1000;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .hamburger-btn {
                display: flex;
            }

            .header {
                padding: 12px 16px;
            }

            .logo-text {
                font-size: 20px;
            }

            .chat-container {
                padding: 16px;
            }

            .message {
                max-width: 90%;
            }

            .input-container {
                padding: 12px 16px;
            }

            .settings-panel {
                width: 100%;
                right: -100%;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-secondary);
        }

        /* Notification styles */
        @keyframes slideInNotification {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @keyframes slideOutNotification {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(400px);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splash-screen">
        <img src="assets/splash-screen.png" alt="Crump AI">
    </div>

    <!-- Tutorial Overlay -->
    <div id="tutorial-overlay" class="tutorial-overlay">
        <div class="tutorial-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; padding-bottom: 16px; border-bottom: 1px solid var(--border-color);">
                <div style="font-size: 20px; font-weight: 700; color: var(--accent-primary);">Welcome to Crump AI</div>
                <div id="tutorialStep" style="font-size: 14px; color: var(--text-tertiary);">Step 1 of 4</div>
            </div>
            
            <div id="tutorialBody" style="text-align: center; margin-bottom: 32px;">
                <div style="font-size: 64px; margin-bottom: 16px;">👋</div>
                <h2 style="font-size: 24px; color: var(--text-primary); margin-bottom: 12px;">Welcome, Gregory</h2>
                <p style="font-size: 16px; color: var(--text-secondary); line-height: 1.6;">I'm Crump, your personal AI assistant powered by the N² Engine. Let me show you around.</p>
            </div>
            
            <div style="display: flex; gap: 12px; justify-content: flex-end;">
                <button onclick="skipTutorial()" style="padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; border: 1px solid var(--border-color); background: transparent; color: var(--text-secondary);">Skip</button>
                <button onclick="nextTutorialStep()" style="padding: 12px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; border: none; background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary)); color: var(--bg-primary);">Next</button>
            </div>
        </div>
    </div>

    <!-- Hidden file input for multiple images -->
    <input type="file" id="fileInput" accept="image/*" multiple style="display: none;">

    <!-- Sidebar overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay" onclick="closeSidebar()"></div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="createNewChat()">✨ New Chat</button>
                <input type="text" class="search-box" id="searchBox" placeholder="Search chats..." oninput="filterChats(this.value)">
            </div>
            <div class="chats-list" id="chatsList"></div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
                    <div class="logo-container">
                        <img src="assets/crump-crest.png" alt="Crump Crest" class="logo-img">
                        <div class="logo-text">CRUMP AI</div>
                    </div>
                </div>
                <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
            </header>

            <div class="chat-container" id="chatContainer"></div>

            <div class="input-container">
                <!-- NEW: Multi-file preview -->
                <div class="files-upload-preview" id="filesPreview"></div>

                <div class="input-wrapper">
                    <textarea 
                        id="userInput" 
                        class="input-field" 
                        placeholder="Message Crump AI..."
                        rows="1"
                        oninput="autoResize(this)"
                    ></textarea>
                    <div class="input-actions">
                        <button class="icon-btn" onclick="attachFiles()" title="Attach images">📎</button>
                        <button class="icon-btn" onclick="toggleVoiceInput()" id="voiceBtn" title="Voice input">🎤</button>
                        <button class="icon-btn primary" id="sendBtn" onclick="sendMessage()" title="Send message">➤</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Settings Panel - Simplified for now -->
        <div class="settings-panel" id="settingsPanel">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <div style="font-size: 20px; font-weight: 600; color: var(--accent-primary);">Settings</div>

// ANTI-DUPLICATE SYSTEM
// ==========================================
class MessageDeduplicator {
    constructor(windowMs = 2000) {
        this.recentMessages = new Map();
        this.windowMs = windowMs;
    }
    
    isDuplicate(message) {
        const normalized = message.trim().toLowerCase();
        const now = Date.now();
        
        if (this.recentMessages.has(normalized)) {
            const lastTime = this.recentMessages.get(normalized);
            if (now - lastTime < this.windowMs) {
                console.log('🚫 Duplicate blocked:', normalized.substring(0, 30));
                return true;
            }
        }
        
        this.recentMessages.set(normalized, now);
        this.cleanup();
        return false;
    }
    
    cleanup() {
        const now = Date.now();
        for (const [msg, time] of this.recentMessages.entries()) {
            if (now - time > this.windowMs) {
                this.recentMessages.delete(msg);
            }
        }
    }
}

const messageDeduper = new MessageDeduplicator(2000);

// ==========================================
// AUTONOMOUS ENGINES
// ==========================================
class SuggestionEngine {
    constructor() {
        this.patterns = {
            question: /\?$/,
            command: /^(create|make|build|generate|show|tell|explain)/i,
            incomplete: /\.\.\.|and$/i,
            technical: /(code|function|api|debug|error|fix)/i
        };
        this.sessionPatterns = [];
    }
    
    analyze(message) {
        const analysis = {
            type: this.detectType(message),
            confidence: 0,
            suggestions: []
        };
        
        this.sessionPatterns.push(analysis.type);
        return analysis;
    }
    
    detectType(message) {
        if (this.patterns.question.test(message)) return 'question';
        if (this.patterns.command.test(message)) return 'command';
        if (this.patterns.technical.test(message)) return 'technical';
        return 'statement';
    }
    
    getSessionInsights() {
        const types = this.sessionPatterns.reduce((acc, type) => {
            acc[type] = (acc[type] || 0) + 1;
            return acc;
        }, {});
        return types;
    }
}

class ContextTracker {
    constructor() {
        this.sessionStart = Date.now();
        this.messageCount = 0;
        this.topics = new Set();
        this.lastActivity = Date.now();
    }
    
    track(message) {
        this.messageCount++;
        this.lastActivity = Date.now();
        
        const words = message.toLowerCase().split(/\s+/);
        const importantWords = words.filter(w => w.length > 4);
        importantWords.forEach(word => this.topics.add(word));
    }
    
    getSessionDuration() {
        return Math.floor((Date.now() - this.sessionStart) / 1000 / 60);
    }
    
    getIdleTime() {
        return Math.floor((Date.now() - this.lastActivity) / 1000);
    }
    
    getSummary() {
        return {
            duration: this.getSessionDuration(),
            messages: this.messageCount,
            topics: Array.from(this.topics).slice(0, 5),
            idle: this.getIdleTime()
        };
    }
}

        let content = `<div class="message-content">${formatMessageContent(msg.content)}</div>`;

        if (msg.fileData) {
            const images = Array.isArray(msg.fileData) ? msg.fileData : [msg.fileData];
            const imageClass = images.length === 1 ? 'single' : '';
            
            content += `

        return `
            <div class="message ${isUser ? 'user' : ''}">

                <div class="message-wrapper">
                    ${content}

function formatMessageContent(content) {
    // Convert markdown-style formatting
    return content
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/`(.*?)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');
}

// SEND MESSAGE (ENHANCED WITH MULTI-IMAGE + AUTO-COMMIT)
// ==========================================
async function sendMessage() {
    const input = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const message = input.value.trim();
    
    // STRICT validation with logging
    if (isSending) {
        console.log('🔒 BLOCKED: Already sending');
        return;
    }
    
    if (!message && currentFiles.length === 0) {
        console.log('⚠️ BLOCKED: No content');
        return;
    }
    
    if (message && messageDeduper.isDuplicate(message)) {
        console.log('🚫 BLOCKED: Duplicate detected');
        showNotification('Please wait before sending another message', 'info');
        return;
    }
    
    // LOCK immediately
    isSending = true;
    input.disabled = true;
    sendBtn.disabled = true;
    sendBtn.classList.add('loading');
    console.log('🔒 LOCKED at', Date.now());
    
    try {
        // Track context
        if (message) {
            contextTracker.track(message);
            suggestionEngine.analyze(message);
        }
        
        // Check for local commands
        if (message && checkLocalCommands(message)) {
            input.value = '';
            return;
        }
        
        // Check for memory commands
        if (message && checkMemoryCommands(message)) {
            input.value = '';
            clearFiles();
            return;
        }
        
        // Prepare files to send
        const filesToSend = currentFiles.length > 0 ? [...currentFiles] : null;
        
        // Add user message
        addMessage('user', message || '[Sent images]', filesToSend);
        
        // Clear input and files
        input.value = '';
        clearFiles();
        autoResize({ target: input });
        
        // Show thinking
        showThinking();
        
        // Check if image generation needed
        if (message && shouldGenerateImage(message)) {
            await handleImageGeneration(message);
            hideThinking();
            return;
        }
        
        // Prepare API call
        const payload = {
            message: message || '[User sent images]',
            history: currentChat.messages.slice(-CONFIG.MAX_HISTORY_MESSAGES).map(m => ({
                role: m.role,
                content: m.content
            })),
            memory: getMemoryContext(),
            fileData: filesToSend,
            searchQuery: null,
            assistantName: currentAssistantName
        };
        
        // Call API
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload)
        });
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        }
        
        const data = await response.json();
        
        hideThinking();
        
        if (data.response) {
            addMessage('assistant', data.response);
            
            // NEW: Auto-commit memory
            if (message) {
                await autoCommitToMemory(message, data.response);
            }
            
            // Voice output if enabled
            if (voiceOutputEnabled && data.response) {
                speak(data.response);
            }
        } else {
            throw new Error('No response from API');
        }
        
    } catch (error) {
        console.error('❌ Send error:', error);
        hideThinking();
        showNotification(`Error: ${error.message}`, 'error');
        addMessage('assistant', `I apologize, but I encountered an error: ${error.message}. Please try again.`);
    } finally {
        // ALWAYS unlock
        isSending = false;
        input.disabled = false;
        sendBtn.disabled = false;
        sendBtn.classList.remove('loading');
        console.log('🔓 UNLOCKED at', Date.now());
        input.focus();
    }
}

// AUTO-COMMIT MEMORY (NEW)
// ==========================================
async function autoCommitToMemory(userMessage, aiResponse) {
    // Patterns in user messages that indicate memory storage
    const userTriggers = [
        /remember (?:that )?(.+)/i,
        /don't forget (.+)/i,
        /keep in mind (.+)/i,
        /note (?:that )?(.+)/i,
        /store (?:that )?(.+)/i
    ];
    
    // Patterns in AI responses that confirm storage
    const aiTriggers = [
        /I(?:'ll| will) remember/i,
        /got it/i,
        /noted/i,
        /I'll keep that in mind/i,
        /stored/i,
        /I've made a note/i,
        /memory updated/i
    ];
    
    // Check user message for memory triggers
    for (const pattern of userTriggers) {
        const match = userMessage.match(pattern);
        if (match) {
            const content = match[1] || match[0];
            addCrossSessionContext(`User preference: ${content}`);
            console.log('🧠 AUTO-COMMIT: User memory stored -', content.substring(0, 50));
            showNotification('Memory stored', 'success');
            return;
        }
    }
    
    // Check AI response for confirmation
    if (aiTriggers.some(pattern => pattern.test(aiResponse))) {
        // Extract the key content from user message
        const content = userMessage.replace(/^(remember|note|keep in mind|don't forget|store)\s+(that\s+)?/i, '');
        if (content.length > 5) {
            addCrossSessionContext(content);
            console.log('🧠 AUTO-COMMIT: AI confirmed memory -', content.substring(0, 50));
        }
    }
}

function handleFileSelect(event) {
    const files = Array.from(event.target.files);
    
    // Validation
    if (currentFiles.length + files.length > CONFIG.MAX_IMAGES_PER_MESSAGE) {
        showNotification(`Maximum ${CONFIG.MAX_IMAGES_PER_MESSAGE} images allowed per message`, 'error');
        return;
    }
    
    files.forEach(file => {
        // Type check
        if (!file.type.startsWith('image/')) {
            showNotification(`${file.name} is not an image`, 'error');
            return;
        }
        
        // Size check
        if (file.size > CONFIG.FILE_SIZE_LIMIT_MB * 1024 * 1024) {
            showNotification(`${file.name} exceeds ${CONFIG.FILE_SIZE_LIMIT_MB}MB limit`, 'error');
            return;
        }
        
        // Read file
        const reader = new FileReader();
        reader.onload = (e) => {
            currentFiles.push({
                name: file.name,
                size: file.size,
                type: file.type,
                data: e.target.result
            });
            updateFilesPreview();
        };
        reader.onerror = () => {
            showNotification(`Error reading ${file.name}`, 'error');
        };
        reader.readAsDataURL(file);
    });
    
    // Clear input for re-selection
    event.target.value = '';
}

    const container = document.getElementById('filesPreview');
    
    if (currentFiles.length === 0) {

function checkLocalCommands(message) {
    const lower = message.toLowerCase().trim();
    
    if (lower === 'help' || lower === '/help') {
        showHelp();
        return true;
    }
    
    if (lower === 'clear' || lower === '/clear') {
        if (confirm('Clear all messages in this chat?')) {
            currentChat.messages = [];
            saveChats();
            renderMessages([]);
            addMessage('assistant', getSystemWelcome());
        }
        return true;
    }
    
    if (lower === 'export' || lower === '/export') {
        exportChat();
        return true;
    }
    
    if (lower === 'stats' || lower === '/stats') {
        showStats();
        return true;
    }
    
    if (lower === 'memory' || lower === '/memory') {
        showMemoryDump();
        return true;
    }
    
    if (lower.startsWith('name ') || lower.startsWith('/name ')) {
        const newName = message.substring(message.indexOf(' ') + 1).trim();
        if (newName) {
            setAssistantName(newName);
            addMessage('assistant', `Great! You can call me ${newName} from now on.`);
        }
        return true;
    }
    
    return false;
}

function checkMemoryCommands(message) {
    const lower = message.toLowerCase().trim();
    
    if (lower.startsWith('remember ')) {
        const content = message.substring(9).trim();
        if (content) {
            currentChat.memory.push({
                content,
                timestamp: Date.now()
            });
            saveChats();
            addMessage('assistant', `Got it! I've remembered: "${content}"`);
        }
        return true;
    }
    
    if (lower.startsWith('forget ')) {
        const content = message.substring(7).trim().toLowerCase();
        const initialLength = currentChat.memory.length;
        currentChat.memory = currentChat.memory.filter(m => 
            !m.content.toLowerCase().includes(content)
        );
        const removed = initialLength - currentChat.memory.length;
        saveChats();
        
        if (removed > 0) {
            addMessage('assistant', `I've forgotten ${removed} memory item${removed > 1 ? 's' : ''} containing "${content}"`);
        } else {
            addMessage('assistant', `I don't have any memories containing "${content}"`);
        }
        return true;
    }
    
    if (lower === 'reset memory') {
        if (confirm('Clear all memories for this chat?')) {
            currentChat.memory = [];
            saveChats();
            addMessage('assistant', 'All memories have been cleared for this chat.');
        }
        return true;
    }
    
    return false;
}

function getMemoryContext() {
    const chatMemory = currentChat.memory.map(m => m.content);
    const universalMemory = getCrossSessionContext();
    return [...chatMemory, ...universalMemory];
}

function showMemoryDump() {
    const chatMemory = currentChat.memory;
    const universalMemory = getCrossSessionContext();
    
    let memoryText = '**Memory Dump** 🧠\n\n';
    
    if (chatMemory.length > 0) {
        memoryText += '**Chat-Specific Memories:**\n';
        chatMemory.forEach((m, i) => {
            memoryText += `${i + 1}. ${m.content}\n`;
        });
        memoryText += '\n';
    }
    
    if (universalMemory.length > 0) {
        memoryText += '**Cross-Session Memories:**\n';
        universalMemory.forEach((m, i) => {
            memoryText += `${i + 1}. ${m}\n`;
        });
    }
    
    if (chatMemory.length === 0 && universalMemory.length === 0) {
        memoryText += 'No memories stored yet. Use "remember [text]" to store information.';
    }
    
    addMessage('assistant', memoryText.trim());
}

function initUniversalMemory() {

        try {
            crossSessionContext = JSON.parse(saved);

function addCrossSessionContext(content) {
    if (!content || content.trim().length === 0) return;
    
    crossSessionContext.push(content.trim());
    
    // Keep only last 50 items
    if (crossSessionContext.length > 50) {
        crossSessionContext = crossSessionContext.slice(-50);
    }
    
    localStorage.setItem(STORAGE_KEYS.CROSS_SESSION_CONTEXT, JSON.stringify(crossSessionContext));
    console.log('✅ Cross-session memory updated');
}

function getCrossSessionContext() {
    return crossSessionContext;
}

function clearCrossSessionContext() {
    if (confirm('Clear ALL cross-session memories? This affects all chats.')) {
        crossSessionContext = [];
        localStorage.setItem(STORAGE_KEYS.CROSS_SESSION_CONTEXT, JSON.stringify(crossSessionContext));
        showNotification('Cross-session memory cleared', 'success');

function shouldGenerateImage(message) {
    const triggers = [
        /^generate /i,
        /^create (?:an? )?image/i,
        /^make (?:an? )?image/i,
        /^draw /i,
        /^show me (?:an? )?image/i
    ];
    
    return triggers.some(pattern => pattern.test(message));
}

async function handleImageGeneration(prompt) {
    try {
        // Extract actual prompt
        const cleanPrompt = prompt
            .replace(/^(generate|create|make|draw|show me)\s+(an?\s+)?(image\s+of\s+)?/i, '')
            .trim();
        
        if (!cleanPrompt) {
            addMessage('assistant', 'Please describe what image you want me to generate!');
            return;
        }
        
        addMessage('assistant', `Generating image: "${cleanPrompt}"...`);
        
        // Use Pollinations.ai
        const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(cleanPrompt)}?width=1024&height=1024&nologo=true`;
        
        // Wait a moment for generation
        await new Promise(resolve => setTimeout(resolve, 2000));
        
        addMessage('assistant', 'Here\'s your generated image:', null, imageUrl);
        
    } catch (error) {
        console.error('Image generation error:', error);
        addMessage('assistant', 'Sorry, I encountered an error generating that image. Please try again.');
    }
}

// VOICE SYSTEM
// ==========================================
function setupVoiceRecognition() {
    if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
        console.log('Voice recognition not supported');
        return;
    }
    
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.lang = 'en-US';
    
    recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        document.getElementById('userInput').value = transcript;
        autoResize({ target: document.getElementById('userInput') });
        stopVoiceInput();
    };
    
    recognition.onerror = (event) => {
        console.error('Voice recognition error:', event.error);
        stopVoiceInput();
        showNotification('Voice recognition error', 'error');
    };
    
    recognition.onend = () => {
        isListening = false;
        const voiceBtn = document.getElementById('voiceBtn');
        if (voiceBtn) {
            voiceBtn.classList.remove('listening');
            voiceBtn.textContent = '🎤';
        }
    };
}

function toggleVoiceInput() {
    if (!voiceEnabled) {
        showNotification('Voice input is disabled in settings', 'info');
        return;
    }
    
    if (!recognition) {
        showNotification('Voice recognition not available', 'error');
        return;
    }
    
    if (isListening) {
        stopVoiceInput();
    } else {
        startVoiceInput();
    }
}

function startVoiceInput() {
    try {
        recognition.start();
        isListening = true;
        const voiceBtn = document.getElementById('voiceBtn');
        if (voiceBtn) {
            voiceBtn.classList.add('listening');
            voiceBtn.textContent = '🔴';
        }
        showNotification('Listening...', 'info');
    } catch (error) {
        console.error('Error starting voice input:', error);
        showNotification('Could not start voice input', 'error');
    }
}

function stopVoiceInput() {
    if (recognition && isListening) {
        recognition.stop();
        isListening = false;
        const voiceBtn = document.getElementById('voiceBtn');
        if (voiceBtn) {
            voiceBtn.classList.remove('listening');
            voiceBtn.textContent = '🎤';
        }
    }
}

function speak(text) {
    if (!voiceOutputEnabled || !text) return;
    
    // Cancel any ongoing speech
    speechSynthesis.cancel();
    
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.rate = 1.0;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;
    
    speechSynthesis.speak(utterance);
}

function loadSettings() {
    const savedVoice = localStorage.getItem(STORAGE_KEYS.VOICE_ENABLED);

    }
    
    const savedOutput = localStorage.getItem(STORAGE_KEYS.VOICE_OUTPUT);
    if (savedOutput !== null) {
        voiceOutputEnabled = savedOutput === 'true';
    }
    
    const savedTheme = localStorage.getItem(STORAGE_KEYS.THEME);
    if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
    }
    
    const savedFont = localStorage.getItem(STORAGE_KEYS.FONT_SIZE);
    if (savedFont) {
        document.documentElement.style.fontSize = savedFont;
    }
    
    const savedName = localStorage.getItem(STORAGE_KEYS.ASSISTANT_NAME);
    if (savedName) {
        currentAssistantName = savedName;
    }
    
    const savedNova = localStorage.getItem(STORAGE_KEYS.NOVA_SECURE);
    if (savedNova === 'true') {
        novaSecureActive = true;
    }
    
    const savedNovaCount = localStorage.getItem(STORAGE_KEYS.NOVA_COUNT);
    if (savedNovaCount) {
        novaActivationCount = parseInt(savedNovaCount, 10);
    }
    
    updateSettingsUI();
}

function updateSettingsUI() {
    const voiceToggle = document.getElementById('voiceToggle');
    const outputToggle = document.getElementById('voiceOutputToggle');
    const themeToggle = document.getElementById('themeToggle');
    
    if (voiceToggle) voiceToggle.checked = voiceEnabled;
    if (outputToggle) outputToggle.checked = voiceOutputEnabled;
    if (themeToggle) themeToggle.value = document.documentElement.getAttribute('data-theme') || 'dark';
}

function toggleVoiceInput() {
    voiceEnabled = !voiceEnabled;
    localStorage.setItem(STORAGE_KEYS.VOICE_ENABLED, voiceEnabled.toString());
    
    if (voiceEnabled && !recognition) {

    }
    
    showNotification(`Voice input ${voiceEnabled ? 'enabled' : 'disabled'}`, 'success');

function toggleVoiceOutput() {

    localStorage.setItem(STORAGE_KEYS.VOICE_OUTPUT, voiceOutputEnabled.toString());
    showNotification(`Voice output ${voiceOutputEnabled ? 'enabled' : 'disabled'}`, 'success');
}

function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'dark';
    const next = current === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem(STORAGE_KEYS.THEME, next);

function handleImport(event) {
    const file = event.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const data = JSON.parse(e.target.result);
            
            if (confirm('This will replace ALL current data. Continue?')) {
                if (data.chats) {
                    chats = data.chats;
                    saveChats();
                }
                
                if (data.crossSessionContext) {
                    crossSessionContext = data.crossSessionContext;
                    localStorage.setItem(STORAGE_KEYS.CROSS_SESSION_CONTEXT, JSON.stringify(crossSessionContext));
                }
                
                if (data.settings) {
                    if (data.settings.assistantName) {
                        setAssistantName(data.settings.assistantName);
                    }
                }
                
                showNotification('Data imported successfully', 'success');
                location.reload();
            }
        } catch (error) {
            console.error('Import error:', error);
            showNotification('Error importing data', 'error');
        }
    };
    reader.readAsText(file);
    
    event.target.value = '';
}

// ==========================================
function copyMessage(index) {
    const message = currentChat.messages[index];
    if (!message) return;
    
    navigator.clipboard.writeText(message.content).then(() => {
        showNotification('Message copied', 'success');
    }).catch(err => {
        console.error('Copy failed:', err);
        showNotification('Copy failed', 'error');
    });
}

async function regenerateResponse(index) {
    const message = currentChat.messages[index];
    if (!message || message.role !== 'assistant') return;
    
    // Find the previous user message
    let userMessageIndex = index - 1;
    while (userMessageIndex >= 0 && currentChat.messages[userMessageIndex].role !== 'user') {
        userMessageIndex--;
    }
    
    if (userMessageIndex < 0) {
        showNotification('No user message found to regenerate from', 'error');
        return;
    }
    
    // Remove messages from this point forward
    currentChat.messages = currentChat.messages.slice(0, userMessageIndex + 1);
    saveChats();
    renderMessages(currentChat.messages);
    
    // Resend the user message
    const userMessage = currentChat.messages[userMessageIndex].content;
    showThinking();
    
    try {
        const payload = {
            message: userMessage,
            history: currentChat.messages.slice(-CONFIG.MAX_HISTORY_MESSAGES).map(m => ({
                role: m.role,
                content: m.content
            })),
            memory: getMemoryContext(),
            fileData: null,
            searchQuery: null,
            assistantName: currentAssistantName
        };
        
        const response = await fetch('/api/chat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify(payload)
        });
        
        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }
        
        const data = await response.json();
        
        hideThinking();
        
        if (data.response) {
            addMessage('assistant', data.response);
        }
        
    } catch (error) {
        console.error('Regenerate error:', error);
        hideThinking();
        showNotification('Error regenerating response', 'error');
    }
}

// ==========================================
// UTILITIES
// ==========================================
function autoResize(e) {
    e.target.style.height = 'auto';
    e.target.style.height = e.target.scrollHeight + 'px';
}

function showNotification(message, type = 'info') {
    const notification = document.createElement('div');
    notification.className = `notification ${type}`;
    notification.textContent = message;
    
    document.body.appendChild(notification);
    
    setTimeout(() => {
        notification.classList.add('show');
    }, 10);
    
    setTimeout(() => {
        notification.classList.remove('show');
        setTimeout(() => {
            notification.remove();
        }, 300);
    }, 3000);
}

function formatFileSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}
