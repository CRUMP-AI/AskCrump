<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRUMP AI - Royal Edition</title>
    <style>
        :root {
            --bg-primary: #0a1628;
            --bg-secondary: #0f1e33;
            --bg-tertiary: #15263d;
            --accent-primary: #d4af37;
            --accent-secondary: #b8941f;
            --text-primary: #f5f5dc;
            --text-secondary: #c5b798;
            --text-tertiary: #8b7d6b;
            --border-color: rgba(212, 175, 55, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100dvh;
            overflow: hidden;
            transition: font-family 0.3s ease;
        }

        body.classic-font {
            font-family: 'Times New Roman', Times, Georgia, serif;
        }

        body.elegant-font {
            font-family: Garamond, 'Palatino Linotype', Palatino, serif;
        }

        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10000;
            animation: fadeOut 0.5s ease 2s forwards;
        }

        #splash-screen img {
            max-width: 80%;
            max-height: 80%;
            object-fit: contain;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        .app-container {
            display: flex;
            height: 100dvh;
        }

        .sidebar {
            width: 280px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .new-chat-btn {
            width: 100%;
            padding: 12px 16px;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            border: none;
            border-radius: 8px;
            color: var(--bg-primary);
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
        }

        .chats-list {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .chat-item {
            padding: 12px;
            margin-bottom: 8px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid transparent;
        }

        .chat-item:hover {
            background: var(--bg-secondary);
            border-color: var(--accent-primary);
        }

        .chat-item.active {
            background: var(--bg-secondary);
            border-color: var(--accent-primary);
        }

        .chat-title {
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .chat-preview {
            font-size: 12px;
            color: var(--text-tertiary);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 16px 24px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .hamburger-btn {
            display: none;
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .hamburger-btn:hover {
            background: var(--bg-tertiary);
            color: var(--accent-primary);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-img {
            width: 52px;
            height: 56px;
            object-fit: contain;
        }

        .logo-text {
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .settings-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .settings-btn:hover {
            background: var(--accent-primary);
            color: var(--bg-primary);
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            display: flex;
            gap: 12px;
            max-width: 85%;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
            flex-shrink: 0;
        }

        .avatar.user {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
        }

        .avatar.assistant {
            background: var(--bg-tertiary);
            color: var(--accent-primary);
            border: 2px solid var(--accent-primary);
        }

        .message-content {
            background: var(--bg-secondary);
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-primary);
        }

        .message.user .message-content {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
        }

        .message-image {
            max-width: 100%;
            border-radius: 12px;
            margin-top: 8px;
            border: 2px solid var(--accent-primary);
        }

        .thinking-indicator {
            display: flex;
            gap: 12px;
            align-items: center;
            padding: 12px 0;
        }

        .thinking-dots {
            display: flex;
            gap: 6px;
        }

        .thinking-dots span {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .thinking-dots span:nth-child(1) { animation-delay: -0.32s; }
        .thinking-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .input-container {
            padding: 20px 24px;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 8px 12px;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
        }

        .input-field {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 15px;
            font-family: inherit;
            resize: none;
            max-height: 120px;
            line-height: 1.5;
            padding: 4px 8px;
        }

        .input-field:focus {
            outline: none;
        }

        .input-field::placeholder {
            color: var(--text-tertiary);
        }

        .input-actions {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .icon-btn:hover {
            background: var(--bg-secondary);
            color: var(--accent-primary);
        }

        .icon-btn.primary {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
        }

        .icon-btn.primary:hover {
            transform: scale(1.05);
        }

        .icon-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .settings-panel {
            position: fixed;
            top: 0;
            right: -400px;
            width: 400px;
            height: 100dvh;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border-color);
            padding: 24px;
            overflow-y: auto;
            transition: right 0.3s ease;
            z-index: 1000;
        }

        .settings-panel.active {
            right: 0;
        }

        .settings-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .settings-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--accent-primary);
        }

        .close-settings-btn {
            width: 32px;
            height: 32px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            font-size: 24px;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .close-settings-btn:hover {
            background: var(--bg-tertiary);
            color: var(--accent-primary);
        }

        .setting-group {
            margin-bottom: 24px;
        }

        .setting-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }

        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 26px;
        }

        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .toggle-slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: var(--bg-tertiary);
            transition: 0.3s;
            border-radius: 26px;
        }

        .toggle-slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 4px;
            bottom: 4px;
            background-color: var(--text-secondary);
            transition: 0.3s;
            border-radius: 50%;
        }

        input:checked + .toggle-slider {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
        }

        input:checked + .toggle-slider:before {
            transform: translateX(24px);
            background-color: var(--bg-primary);
        }

        .font-options, .color-options {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .font-btn, .color-btn {
            padding: 8px 16px;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }

        .font-btn:hover, .color-btn:hover {
            border-color: var(--accent-primary);
            background: var(--bg-secondary);
        }

        .font-btn.active, .color-btn.active {
            background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
            color: var(--bg-primary);
            border-color: var(--accent-primary);
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .color-picker {
            width: 44px;
            height: 44px;
            border: 2px solid var(--border-color);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s;
        }

        .color-picker:hover {
            border-color: var(--accent-primary);
            transform: scale(1.1);
        }

        .danger-btn {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 2px solid #ff4444;
            color: #ff4444;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
            margin-bottom: 12px;
        }

        .danger-btn:hover {
            background: #ff4444;
            color: white;
        }

        .version-info {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }

        .version-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--accent-primary);
            margin-bottom: 8px;
        }

        .version-detail {
            font-size: 13px;
            color: var(--text-tertiary);
            margin-bottom: 4px;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font-size: 13px;
            color: var(--accent-primary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100dvh;
                transform: translateX(-100%);
                z-index: 1000;
            }

            .sidebar.active {
                transform: translateX(0);
            }

            .hamburger-btn {
                display: flex;
            }

            .header {
                padding: 12px 16px;
            }

            .logo-text {
                font-size: 20px;
            }

            .chat-container {
                padding: 16px;
            }

            .message {
                max-width: 90%;
            }

            .input-container {
                padding: 12px 16px;
            }

            .settings-panel {
                width: 100%;
                right: -100%;
            }
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--accent-primary);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--accent-secondary);
        }
    </style>
</head>
<body>
    <div id="splash-screen">
        <img src="assets/splash-screen.png" alt="Crump AI">
    </div>

    <div class="app-container">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="createNewChat()">+ New Chat</button>
            </div>
            <div class="chats-list" id="chatsList"></div>
        </aside>

        <main class="main-content">
            <header class="header">
                <div class="header-left">
                    <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
                    <div class="logo-container">
                        <img src="assets/crump-crest.png" alt="Crump Crest" class="logo-img">
                        <div class="logo-text">CRUMP AI</div>
                    </div>
                </div>
                <button class="settings-btn" onclick="toggleSettings()">⚙️</button>
            </header>

            <div class="chat-container" id="chatContainer"></div>

            <div class="input-container">
                <div class="input-wrapper">
                    <textarea 
                        id="userInput" 
                        class="input-field" 
                        placeholder="Message Crump AI..."
                        rows="1"
                        onkeydown="handleKeyPress(event)"
                        oninput="autoResize(this)"
                    ></textarea>
                    <div class="input-actions">
                        <button class="icon-btn" onclick="attachFile()" title="Attach file">📎</button>
                        <button class="icon-btn" onclick="toggleVoiceInput()" id="voiceBtn" title="Voice input">🎤</button>
                        <button class="icon-btn primary" onclick="sendMessage()" title="Send message">➤</button>
                    </div>
                </div>
            </div>
        </main>

        <div class="settings-panel" id="settingsPanel">
            <div class="settings-header">
                <div class="settings-title">Settings</div>
                <button class="close-settings-btn" onclick="toggleSettings()">×</button>
            </div>

            <div class="setting-group">
                <label class="setting-label">Voice Output</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="voiceToggle" onchange="toggleVoiceOutput()">
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="setting-group">
                <label class="setting-label">Auto-Voice Responses</label>
                <label class="toggle-switch">
                    <input type="checkbox" id="autoVoiceToggle" onchange="toggleAutoVoice()">
                    <span class="toggle-slider"></span>
                </label>
            </div>

            <div class="setting-group">
                <label class="setting-label">Font Style</label>
                <div class="font-options">
                    <button class="font-btn active" onclick="changeFont('modern')">Modern</button>
                    <button class="font-btn" onclick="changeFont('classic')">Classic</button>
                    <button class="font-btn" onclick="changeFont('elegant')">Elegant</button>
                </div>
            </div>

            <div class="setting-group">
                <label class="setting-label">Background Color</label>
                <div class="color-picker-wrapper">
                    <input type="color" id="bgColorPicker" class="color-picker" value="#0a1628" onchange="changeBgColor(this.value)">
                    <button class="font-btn" onclick="resetBgColor()">Reset</button>
                </div>
            </div>

            <div class="setting-group">
                <button class="danger-btn" onclick="clearCurrentChat()">Clear Current Chat</button>
                <button class="danger-btn" onclick="deleteAllChats()">Delete All Chats</button>
            </div>

            <div class="version-info">
                <div class="version-title">Crump AI v2.7 Royal Edition</div>
                <div class="version-detail">Powered by N² Engine</div>
                <div class="version-detail">Built by Gregory D. Crump Jr.</div>
                <div class="status-indicator">
                    <span class="status-dot"></span>
                    Operational
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentChatId = null;
        let chats = [];
        let isVoiceEnabled = false;
        let isAutoVoiceEnabled = false;
        let isListening = false;
        let recognition = null;
        let currentUtterance = null;

        const welcomeMessages = [
            "Good to see you, Gregory. Ready when you are.",
            "What's on your mind today?",
            "Let's build something legendary.",
            "Another day, another empire move. What's first?",
            "Back at it. What do you need?",
            "Ready to make things happen. What's the play?",
            "Let's get to work. What are we tackling?",
            "What's the mission today?",
            "Time to turn ideas into reality. What's up?",
            "Let's do this. What's on the agenda?"
        ];

        document.addEventListener('DOMContentLoaded', () => {
            initializeSplashScreen();
            loadSettings();
            loadChats();
            setupVoiceRecognition();
            
            if (chats.length === 0) {
                createNewChat();
            } else {
                loadChat(chats[0].id);
            }
        });

        function initializeSplashScreen() {
            const splashSeen = sessionStorage.getItem('crump_splash_seen');
            const splashScreen = document.getElementById('splash-screen');
            
            if (splashSeen) {
                splashScreen.style.display = 'none';
            } else {
                sessionStorage.setItem('crump_splash_seen', 'true');
            }
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('active');
        }

        function toggleSettings() {
            document.getElementById('settingsPanel').classList.toggle('active');
        }

        function loadSettings() {
            const voiceOutput = localStorage.getItem('voiceOutput') === 'true';
            const autoVoice = localStorage.getItem('autoVoice') === 'true';
            const fontStyle = localStorage.getItem('fontStyle') || 'modern';
            const bgColor = localStorage.getItem('bgColor') || '#0a1628';

            document.getElementById('voiceToggle').checked = voiceOutput;
            document.getElementById('autoVoiceToggle').checked = autoVoice;
            isVoiceEnabled = voiceOutput;
            isAutoVoiceEnabled = autoVoice;
            changeFont(fontStyle);
            changeBgColor(bgColor);
        }

        function toggleVoiceOutput() {
            isVoiceEnabled = document.getElementById('voiceToggle').checked;
            localStorage.setItem('voiceOutput', isVoiceEnabled);
        }

        function toggleAutoVoice() {
            isAutoVoiceEnabled = document.getElementById('autoVoiceToggle').checked;
            localStorage.setItem('autoVoice', isAutoVoiceEnabled);
        }

        function changeFont(style) {
            document.body.className = style === 'modern' ? '' : `${style}-font`;
            localStorage.setItem('fontStyle', style);
            
            document.querySelectorAll('.font-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent.toLowerCase() === style) {
                    btn.classList.add('active');
                }
            });
        }

        function changeBgColor(color) {
            document.documentElement.style.setProperty('--bg-primary', color);
            document.getElementById('bgColorPicker').value = color;
            localStorage.setItem('bgColor', color);
        }

        function resetBgColor() {
            changeBgColor('#0a1628');
        }

        function loadChats() {
            const savedChats = localStorage.getItem('crump_chats');
            chats = savedChats ? JSON.parse(savedChats) : [];
            renderChatsList();
        }

        function saveChats() {
            localStorage.setItem('crump_chats', JSON.stringify(chats));
        }

        function createNewChat() {
            const newChat = {
                id: Date.now().toString(),
                title: 'New Chat',
                messages: [],
                createdAt: new Date().toISOString()
            };
            
            chats.unshift(newChat);
            saveChats();
            loadChat(newChat.id);
            renderChatsList();

            if (window.innerWidth <= 768) {
                toggleSidebar();
            }

            const welcomeMsg = welcomeMessages[Math.floor(Math.random() * welcomeMessages.length)];
            addMessage('assistant', welcomeMsg);
        }

        function loadChat(chatId) {
            currentChatId = chatId;
            localStorage.setItem('crump_current_chat', chatId);
            
            const chat = chats.find(c => c.id === chatId);
            if (chat) {
                renderMessages(chat.messages);
            }
            
            renderChatsList();

            if (window.innerWidth <= 768) {
                const sidebar = document.getElementById('sidebar');
                if (sidebar.classList.contains('active')) {
                    toggleSidebar();
                }
            }
        }

        function renderChatsList() {
            const chatsList = document.getElementById('chatsList');
            chatsList.innerHTML = chats.map(chat => {
                const isActive = chat.id === currentChatId;
                const preview = chat.messages.length > 0 
                    ? chat.messages[chat.messages.length - 1].content.substring(0, 50) 
                    : 'No messages yet';
                
                return `
                    <div class="chat-item ${isActive ? 'active' : ''}" onclick="loadChat('${chat.id}')">
                        <div class="chat-title">${chat.title}</div>
                        <div class="chat-preview">${preview}${preview.length >= 50 ? '...' : ''}</div>
                    </div>
                `;
            }).join('');
        }

        function renderMessages(messages) {
            const container = document.getElementById('chatContainer');
            container.innerHTML = messages.map(msg => {
                const isUser = msg.role === 'user';
                const avatar = isUser ? 'G' : 'C';
                const avatarClass = isUser ? 'user' : 'assistant';
                
                let content = `<div class="message-content">${msg.content}</div>`;
                
                if (msg.imageUrl) {
                    content += `<img src="${msg.imageUrl}" class="message-image" alt="Generated image">`;
                }
                
                return `
                    <div class="message ${isUser ? 'user' : ''}">
                        <div class="avatar ${avatarClass}">${avatar}</div>
                        ${content}
                    </div>
                `;
            }).join('');
            
            container.scrollTop = container.scrollHeight;
        }

        function addMessage(role, content, imageUrl = null) {
            const chat = chats.find(c => c.id === currentChatId);
            if (!chat) return;
            
            const message = { role, content };
            if (imageUrl) message.imageUrl = imageUrl;
            
            chat.messages.push(message);
            
            if (role === 'user' && chat.messages.filter(m => m.role === 'user').length === 1) {
                chat.title = content.substring(0, 30) + (content.length > 30 ? '...' : '');
            }
            
            saveChats();
            renderMessages(chat.messages);
            renderChatsList();

            if (role === 'assistant' && isAutoVoiceEnabled) {
                speak(content);
            }
        }

        function showThinking() {
            const container = document.getElementById('chatContainer');
            const thinkingHtml = `
                <div class="thinking-indicator" id="thinkingIndicator">
                    <div class="avatar assistant">C</div>
                    <div class="message-content">
                        Crump is thinking
                        <div class="thinking-dots">
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>
                    </div>
                </div>
            `;
            container.insertAdjacentHTML('beforeend', thinkingHtml);
            container.scrollTop = container.scrollHeight;
        }

        function hideThinking() {
            const indicator = document.getElementById('thinkingIndicator');
            if (indicator) indicator.remove();
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            
            if (!message) return;
            
            addMessage('user', message);
            input.value = '';
            autoResize(input);
            
            const localResponse = getLocalResponse(message);
            if (localResponse) {
                showThinking();
                setTimeout(() => {
                    hideThinking();
                    addMessage('assistant', localResponse);
                }, 800);
                return;
            }

            if (shouldGenerateImage(message)) {
                await handleImageGeneration(message);
                return;
            }
            
            showThinking();
            
            try {
                const chat = chats.find(c => c.id === currentChatId);
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message,
                        history: chat.messages.slice(-10).filter(m => m.content && m.content.trim() !== '')
                    })
                });
                
                if (!response.ok) throw new Error('API request failed');
                
                const data = await response.json();
                hideThinking();
                addMessage('assistant', data.response);
                
            } catch (error) {
                hideThinking();
                addMessage('assistant', 'I apologize, but I encountered an error. Please try again.');
                console.error('Error:', error);
            }
        }

        function getLocalResponse(message) {
            const lower = message.toLowerCase();
            
            if (lower.includes('who are you') || lower.includes('what are you')) {
                return "I'm Crump AI, powered by the N² Engine - a hybrid intelligence system that combines Claude's analytical precision with OpenAI's creative capabilities. I route your questions to whichever AI handles them best, giving you the optimal response every time.";
            }
            
            if (lower.includes('who am i') || lower.includes('who is gregory')) {
                return "You're the architect behind this system. The one who built Crump AI from scratch.";
            }
            
            if (lower.includes('what is crump') || lower.includes('what is the n')) {
                return "Crump AI is a hybrid intelligence system powered by the N² Engine. It intelligently routes your queries to either Claude (for technical/analytical tasks) or OpenAI (for creative tasks), ensuring you get the best response possible. The N² represents the dual-engine architecture.";
            }
            
            if (lower.includes('who built you') || lower.includes('who created you')) {
                return "I was built by Gregory D. Crump Jr. - created from scratch in a single day during work meetings. He designed the architecture, branding, and every feature you see.";
            }
            
            if (lower.includes('what can you do') || lower.includes('your capabilities')) {
                return "I can help you with:\n\n• Technical problems (debugging, code, algorithms)\n• Creative writing (stories, content, ideas)\n• Analysis and research\n• Voice conversations (speak to me!)\n• Image generation (just ask me to create an image)\n• Multi-threaded conversations\n• And much more - just ask!";
            }
            
            return null;
        }

        function shouldGenerateImage(message) {
            const lower = message.toLowerCase();
            const imageKeywords = ['generate', 'create', 'make', 'draw', 'design', 'show me'];
            const imageNouns = ['image', 'picture', 'photo', 'illustration', 'artwork', 'drawing'];
            
            const hasKeyword = imageKeywords.some(keyword => lower.includes(keyword));
            const hasNoun = imageNouns.some(noun => lower.includes(noun));
            
            return hasKeyword && hasNoun;
        }

        function extractImagePrompt(message) {
            let prompt = message;
            const prefixes = [
                'generate an image of',
                'create an image of',
                'make an image of',
                'draw an image of',
                'show me an image of',
                'generate a picture of',
                'create a picture of',
                'make a picture of',
                'draw a picture of',
                'show me a picture of',
                'generate',
                'create',
                'make',
                'draw',
                'show me'
            ];
            
            for (const prefix of prefixes) {
                if (prompt.toLowerCase().startsWith(prefix)) {
                    prompt = prompt.substring(prefix.length).trim();
                    break;
                }
            }
            
            return prompt;
        }

        async function handleImageGeneration(message) {
            const prompt = extractImagePrompt(message);
            showThinking();
            
            setTimeout(() => {
                hideThinking();
                const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=800&height=800&nologo=true`;
                addMessage('assistant', `Here's your image:`, imageUrl);
            }, 800);
        }

        function setupVoiceRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                
                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById('userInput').value = transcript;
                    isListening = false;
                    updateVoiceButton();
                };
                
                recognition.onerror = () => {
                    isListening = false;
                    updateVoiceButton();
                };
                
                recognition.onend = () => {
                    isListening = false;
                    updateVoiceButton();
                };
            }
        }

        function toggleVoiceInput() {
            if (!recognition) {
                alert('Voice recognition is not supported in your browser.');
                return;
            }
            
            if (isListening) {
                recognition.stop();
                isListening = false;
            } else {
                recognition.start();
                isListening = true;
            }
            
            updateVoiceButton();
        }

        function updateVoiceButton() {
            const btn = document.getElementById('voiceBtn');
            btn.textContent = isListening ? '⏹️' : '🎤';
            btn.style.background = isListening ? 'linear-gradient(135deg, var(--accent-primary), var(--accent-secondary))' : 'transparent';
            btn.style.color = isListening ? 'var(--bg-primary)' : 'var(--text-secondary)';
        }

        function speak(text) {
            if (!isVoiceEnabled) return;
            
            if (currentUtterance) {
                speechSynthesis.cancel();
            }
            
            currentUtterance = new SpeechSynthesisUtterance(text);
            currentUtterance.rate = 1.1;
            currentUtterance.pitch = 1.0;
            speechSynthesis.speak(currentUtterance);
        }

        function autoResize(textarea) {
            textarea.style.height = 'auto';
            textarea.style.height = Math.min(textarea.scrollHeight, 120) + 'px';
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }

        function attachFile() {
            alert('File upload feature coming in Phase 2!');
        }

        function clearCurrentChat() {
            if (!confirm('Clear all messages in this chat?')) return;
            
            const chat = chats.find(c => c.id === currentChatId);
            if (chat) {
                chat.messages = [];
                saveChats();
                renderMessages([]);
                renderChatsList();
            }
        }

        function deleteAllChats() {
            if (!confirm('Delete ALL chats? This cannot be undone.')) return;
            
            chats = [];
            saveChats();
            createNewChat();
        }
    </script>
</body>
</html>
