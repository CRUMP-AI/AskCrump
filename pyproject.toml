[project]
name = "ask-crump"
version = "5.1.0"
description = "Cross-platform multimodal AI assistant with synchronized chat, private files, generated artifacts, memory, intelligence orchestration, subscriptions, and durable credits."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "pydantic[email]==2.13.4",
  "httpx[http2]==0.28.1",
  "bcrypt==4.3.0",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.35.0",
  "google-auth==2.40.3",
  "PyJWT[crypto]==2.10.1",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "openpyxl==3.1.5",
  "pypdf==6.14.2",
  "reportlab==5.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", "node_modules", "ios", "android"]

[tool.ruff.lint]
select = ["E9", "F"]
